<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كاشير محل ملابس</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-soft:#eef2ff;
  --green:#059669; --green-soft:#ecfdf5;
  --red:#dc2626; --red-soft:#fef2f2;
  --amber:#d97706; --amber-soft:#fffbeb;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 28px -14px rgba(15,23,42,.14);
  --sidebar:#0f172a; --sidebar-text:#94a3b8;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Segoe UI", Tahoma, system-ui, -apple-system, "Cairo", "Noto Kufi Arabic", sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit;}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--text);}
a{color:var(--primary); text-decoration:none;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#cbd5e1; border-radius:8px; border:2px solid transparent; background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
.muted{color:var(--muted);}
.small{font-size:12px;}
.bold{font-weight:700;}
.row{display:flex; align-items:center; gap:8px;}
.grow{flex:1;}
.mt8{margin-top:8px;} .mt16{margin-top:16px;} .mb8{margin-bottom:8px;} .mb16{margin-bottom:16px;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 16px; border-radius:var(--radius-sm);
  font-weight:600; transition:.15s; border:1px solid transparent; white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:#fff; border-color:var(--border); color:var(--text);}
.btn-ghost:hover{background:#f8fafc;}
.btn-green{background:var(--green); color:#fff;}
.btn-green:hover{background:#047857;}
.btn-red{background:var(--red); color:#fff;}
.btn-red:hover{background:#b91c1c;}
.btn-soft-red{background:var(--red-soft); color:var(--red);}
.btn-soft-red:hover{background:#fee2e2;}
.btn-soft{background:var(--primary-soft); color:var(--primary);}
.btn-soft:hover{background:#e0e7ff;}
.btn-block{width:100%;}
.btn-sm{padding:6px 11px; font-size:13px;}
.btn-icon{padding:7px; border-radius:8px;}
.icon-btn{display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:8px; color:var(--muted); transition:.15s;}
.icon-btn:hover{background:#f1f5f9; color:var(--text);}
.icon-btn.danger:hover{background:var(--red-soft); color:var(--red);}
.icon-btn.primary:hover{background:var(--primary-soft); color:var(--primary);}

/* ---------- Cards ---------- */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.card h3{font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px;}

/* ---------- Stat cards ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:18px;}
.stat{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; position:relative; overflow:hidden;}
.stat .ic{width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; color:#fff;}
.stat .val{font-size:22px; font-weight:800;}
.stat .lbl{color:var(--muted); font-size:12.5px;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:right; color:var(--muted); font-weight:600; font-size:12px; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:hover{background:#f8fafc;}
tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.badge-green{background:var(--green-soft); color:var(--green);}
.badge-red{background:var(--red-soft); color:var(--red);}
.badge-amber{background:var(--amber-soft); color:var(--amber);}
.badge-blue{background:var(--primary-soft); color:var(--primary);}
.badge-gray{background:#f1f5f9; color:var(--muted);}
.badge-cyan{background:#ecfeff; color:#0891b2;}
.badge-purple{background:#f5f3ff; color:#7c3aed;}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:linear-gradient(135deg,#0f172a 0%,#312e81 60%,#4f46e5 100%);}
.login-card{background:#fff; border-radius:20px; padding:34px 30px; width:100%; max-width:400px; box-shadow:0 30px 60px -20px rgba(0,0,0,.45);}
.login-logo{width:64px; height:64px; border-radius:18px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.login-card h1{text-align:center; font-size:20px; margin-bottom:4px;}
.login-card .sub{text-align:center; color:var(--muted); margin-bottom:22px; font-size:13px;}
.field{margin-bottom:14px;}
.field label{display:block; font-weight:600; font-size:13px; margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%; padding:10px 13px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; outline:none; transition:.15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.15);}
.field textarea{resize:vertical; min-height:70px;}
.hint-box{background:var(--primary-soft); border:1px dashed #c7d2fe; border-radius:var(--radius-sm); padding:12px 14px; font-size:12.5px; margin-bottom:18px;}
.hint-box div{display:flex; justify-content:space-between; padding:2px 0;}
.hint-box code{background:#fff; border:1px solid #e0e7ff; padding:1px 8px; border-radius:6px; font-size:12px; direction:ltr; display:inline-block;}

/* ---------- App shell ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{width:235px; background:var(--sidebar); color:var(--sidebar-text); display:flex; flex-direction:column; flex-shrink:0; position:sticky; top:0; height:100vh; transition:.2s;}
.sidebar .brand{display:flex; align-items:center; gap:10px; padding:18px 18px 14px; color:#fff;}
.sidebar .brand .logo{width:40px; height:40px; border-radius:11px; background:var(--primary); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
.sidebar .brand .nm{font-weight:800; font-size:15px; line-height:1.2;}
.sidebar .brand .sm{font-size:11px; color:var(--sidebar-text);}
.sidebar nav{flex:1; padding:6px 10px; overflow-y:auto;}
.nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; color:var(--sidebar-text); margin-bottom:3px; font-weight:500; font-size:13.5px; transition:.15s; width:100%; text-align:right;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--primary); color:#fff;}
.sidebar .foot{padding:14px; border-top:1px solid rgba(255,255,255,.08);}
.user-chip{display:flex; align-items:center; gap:10px; padding:9px; border-radius:10px; background:rgba(255,255,255,.05); margin-bottom:8px;}
.user-chip .avatar{width:34px; height:34px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0;}
.user-chip .nm{color:#fff; font-weight:600; font-size:13px;}
.user-chip .rl{font-size:11px; color:var(--sidebar-text);}
.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{background:#fff; border-bottom:1px solid var(--border); padding:12px 22px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20;}
.topbar h2{font-size:17px; font-weight:800;}
.topbar .date{color:var(--muted); font-size:12.5px;}
.view{padding:22px; max-width:1250px; width:100%; margin:0 auto;}
.burger{display:none;}
.scrim{display:none;}

/* ---------- POS ---------- */
.pos{display:grid; grid-template-columns:1fr 370px; gap:16px; align-items:start;}
.pos-search{display:flex; gap:8px; margin-bottom:12px;}
.pos-search .inp{flex:1; position:relative;}
.pos-search .inp svg{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none;}
.pos-search .inp input{width:100%; padding:11px 40px 11px 13px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; outline:none;}
.pos-search .inp input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.15);}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{padding:6px 14px; border-radius:999px; background:#fff; border:1px solid var(--border); font-size:12.5px; font-weight:600; color:var(--muted); transition:.15s;}
.chip:hover{border-color:var(--primary); color:var(--primary);}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.pcard{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer; transition:.15s; position:relative; display:flex; flex-direction:column; gap:6px;}
.pcard:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:#c7d2fe;}
.pcard .emoji{font-size:34px; line-height:1;}
.pcard .pname{font-weight:700; font-size:13.5px; line-height:1.3;}
.pcard .pprice{color:var(--primary); font-weight:800; font-size:15px;}
.pcard .pmeta{display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--muted);}
.pcard .stock{position:absolute; top:10px; left:10px;}
.pcard.disabled{opacity:.5; pointer-events:none;}
.cart-panel{background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); display:flex; flex-direction:column; max-height:calc(100vh - 160px); position:sticky; top:86px;}
.cart-head{padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.cart-head .t{font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px;}
.cart-head .count{background:var(--primary-soft); color:var(--primary); font-size:12px; font-weight:800; padding:2px 9px; border-radius:999px;}
.cart-items{flex:1; overflow-y:auto; padding:10px 14px; min-height:80px;}
.cart-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px dashed var(--border); align-items:flex-start;}
.cart-item:last-child{border-bottom:none;}
.cart-item .emoji{font-size:24px;}
.cart-item .info{flex:1; min-width:0;}
.cart-item .nm{font-weight:700; font-size:13px;}
.cart-item .opt{font-size:11px; color:var(--muted);}
.cart-item .pr{font-weight:700; color:var(--primary); font-size:13px;}
.qty-ctrl{display:flex; align-items:center; gap:4px; margin-top:4px;}
.qty-ctrl button{width:24px; height:24px; border-radius:6px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--muted);}
.qty-ctrl button:hover{background:var(--primary-soft); color:var(--primary);}
.qty-ctrl span{min-width:26px; text-align:center; font-weight:700; font-size:13px;}
.cart-empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:13px;}
.cart-empty .big{font-size:40px; margin-bottom:8px;}
.cart-foot{border-top:1px solid var(--border); padding:14px 16px; background:#f8fafc; border-radius:0 0 var(--radius) var(--radius);}
.tot-row{display:flex; justify-content:space-between; padding:3px 0; font-size:13px;}
.tot-row.grand{font-weight:800; font-size:17px; padding-top:8px; margin-top:6px; border-top:1px solid var(--border); color:var(--text);}

/* ---------- Modals ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; animation:fade .15s;}
.modal{background:#fff; border-radius:16px; width:100%; max-width:520px; max-height:92vh; display:flex; flex-direction:column; animation:pop .18s;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px; font-weight:800;}
.modal-body{padding:20px; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-start;}
.modal.wide{max-width:640px;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.96); opacity:0}to{transform:scale(1); opacity:1}}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
.form-grid .full{grid-column:1 / -1;}

/* ---------- Toast ---------- */
#toasts{position:fixed; bottom:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:10px;}
.toast{background:#0f172a; color:#fff; padding:12px 18px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:0 12px 30px -8px rgba(0,0,0,.4); display:flex; align-items:center; gap:9px; animation:slideIn .25s; max-width:340px;}
.toast.ok{border-right:4px solid #10b981;}
.toast.err{border-right:4px solid #ef4444;}
.toast.warn{border-right:4px solid #f59e0b;}
@keyframes slideIn{from{transform:translateY(14px); opacity:0}to{transform:translateY(0); opacity:1}}

/* ---------- Receipt / print ---------- */
#print-area{display:none;}
@media print{
  body>*:not(#print-area){display:none !important;}
  #print-area{display:block !important;}
}
.receipt{width:300px; margin:0 auto; font-family:"Courier New", monospace; font-size:12.5px; color:#000; background:#fff; padding:14px;}
.receipt .rc{text-align:center; margin:2px 0;}
.receipt .rc.name{font-size:16px; font-weight:800;}
.receipt .divider{border-top:1px dashed #000; margin:8px 0;}
.receipt table{width:100%; font-size:12px;}
.receipt td{padding:2px 0; border:none;}
.receipt .ttl{display:flex; justify-content:space-between;}
.receipt .bold{font-weight:800;}
.receipt .barcode{text-align:center; margin-top:10px; letter-spacing:2px;}

/* ---------- Reports ---------- */
.bars{display:flex; align-items:flex-end; gap:6px; height:180px; padding:10px 4px 0;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; min-width:0;}
.bar-col .bar{width:100%; max-width:38px; background:linear-gradient(180deg,#6366f1,#4f46e5); border-radius:6px 6px 2px 2px; min-height:2px; position:relative; transition:.2s;}
.bar-col .bar:hover{background:#4338ca;}
.bar-col .bv{font-size:10px; color:var(--muted); font-weight:700;}
.bar-col .bl{font-size:9.5px; color:var(--muted); white-space:nowrap; transform:rotate(-40deg); transform-origin:center;}

/* ---------- Empty state ---------- */
.empty{text-align:center; padding:50px 20px; color:var(--muted);}
.empty .big{font-size:52px; margin-bottom:10px;}

/* ---------- Filter bar ---------- */
.filterbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.filterbar select,.filterbar input{padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; outline:none;}
.filterbar select:focus,.filterbar input:focus{border-color:var(--primary);}

.warn-banner{background:var(--amber-soft); color:#92400e; border:1px solid #fde68a; border-radius:12px; padding:11px 15px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:9px;}

/* ---------- Responsive ---------- */
@media (max-width:960px){
  .pos{grid-template-columns:1fr;}
  .cart-panel{max-height:none; position:static;}
  .sidebar{position:fixed; right:-260px; z-index:60; height:100vh;}
  .sidebar.open{right:0; box-shadow:0 0 0 100vmax rgba(15,23,42,.5);}
  .burger{display:inline-flex;}
  .scrim.show{display:block; position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:50;}
  .form-grid{grid-template-columns:1fr;}
}

/* ---------- صور المنتجات ---------- */
.thumb-emoji{display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--primary-soft);flex-shrink:0;line-height:1;}
.pthumb{display:flex;justify-content:center;margin-bottom:2px;}

/* ---------- قوائم المتغيرات (مقاس/لون) ---------- */
.vlist{display:flex;flex-direction:column;gap:8px;}
.vrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;flex-wrap:wrap;}
.vrow.disabled{opacity:.5;}
.vlab{font-weight:600;font-size:13px;min-width:70px;}

/* ---------- استيكر الباركود ---------- */
.labelsheet{display:flex;flex-wrap:wrap;gap:6px;padding:10px;}
.plabel{width:260px;padding:10px 8px;border:1px solid #000;text-align:center;page-break-inside:avoid;background:#fff;}
.plabel .pl-name{font-weight:800;font-size:12.5px;}
.plabel .pl-var{font-size:10px;color:#333;}
.plabel .pl-price{font-weight:800;font-size:16px;margin:3px 0;}
.plabel .pl-bc{display:flex;justify-content:center;margin:4px 0;}
.plabel .pl-code{font-size:10px;letter-spacing:1px;font-family:monospace;}

/* ---------- أوردرات الشحن ---------- */
.osheet{width:100%;max-width:340px;margin:0 auto;font-family:"Segoe UI",Tahoma,sans-serif;font-size:12.5px;border:1px solid #000;padding:12px;direction:rtl;}
.osheet h3{text-align:center;margin:0 0 2px;font-size:16px;font-weight:800;}
.osheet table{width:100%;font-size:11.5px;border-collapse:collapse;}
.osheet td{padding:3px 2px;border-bottom:1px dashed #999;text-align:right;}
.osheet .ttl{display:flex;justify-content:space-between;margin:2px 0;}
.osheet .rc{text-align:center;margin:2px 0;}

/* ---------- عروض وخصومات ---------- */
.strike{text-decoration:line-through;color:var(--muted);font-size:12px;font-weight:400;}
.offer-badge{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;}

/* ---------- جرس التنبيهات ---------- */
.bell-btn{position:relative;}
.bell-count{position:absolute;top:-3px;left:-3px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ---------- وضع الكشك ---------- */
.app.kiosk-on .sidebar{display:none;}
.kiosk-view{padding:4px;}
.kiosk-grid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr)) !important;gap:14px !important;}
.kiosk-grid .pcard{padding:18px 14px;gap:9px;border-radius:16px;}
.kiosk-grid .pcard .pname{font-size:15px;}
.kiosk-grid .pcard .pprice{font-size:18px;}
.kiosk-grid .pcard .pmeta{font-size:12px;}

/* ---------- سطور فاتورة الشراء ---------- */
.pur-line{display:grid;grid-template-columns:1.5fr 1fr 64px 88px 34px;gap:8px;align-items:center;margin-bottom:8px;}
.pur-line select,.pur-line input{padding:8px 9px;border:1px solid var(--border);border-radius:8px;width:100%;background:#fff;}
.pur-line select:focus,.pur-line input:focus{border-color:var(--primary);outline:none;}

/* ---------- شرائح المقاسات والألوان في كروت نقطة البيع ---------- */
.vchips{display:flex;flex-wrap:wrap;gap:3px;margin:1px 0 3px;}
.vchip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f1f5f9;color:#475569;line-height:1.6;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.vchip.size{background:var(--primary-soft);color:var(--primary);}
.vdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(15,23,42,.15);}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<div id="print-area"></div>

<script>
"use strict";
/* ============================================================
   سيستم كاشير لمحل ملابس — نسخة تخزين محلي (localStorage)
   ============================================================ */

/* ---------- التخزين (مع بديل مؤقت للمعاينة) ---------- */
var storageOK = true;
var store = (function(){
  try{
    var t = "__t__" + Date.now();
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    return window.localStorage;
  }catch(e){
    storageOK = false;
    var mem = {};
    return {
      getItem:function(k){ return (k in mem) ? mem[k] : null; },
      setItem:function(k,v){ mem[k] = String(v); },
      removeItem:function(k){ delete mem[k]; }
    };
  }
})();
var DB_KEY = "clothing_pos_db_v1";
var SESSION_KEY = "clothing_pos_session_v1";

/* ---------- أدوات مساعدة ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(n){ return Number(n||0).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtInt(n){ return Number(n||0).toLocaleString("en-US"); }
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function pad(n){ return (n<10?"0":"")+n; }
function dateStr(ts){
  var d = new Date(ts);
  return pad(d.getDate()) + "/" + pad(d.getMonth()+1) + "/" + d.getFullYear();
}
function timeStr(ts){ var d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayKey(){ return dayKey(Date.now()); }

function productThumb(p, px){

  if(p.image){

  }

}
function resizeImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 420;
      var w = img.width, h = img.height;
      var sc = Math.min(1, max/Math.max(w,h));
      w = Math.max(1, Math.round(w*sc)); h = Math.max(1, Math.round(h*sc));
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.82));
    };
    img.onerror = function(){ cb(null); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- المتغيرات (مقاس/لون) والمخزون ---------- */
function stockOf(p){ return (p.variants||[]).reduce(function(a,v){ return a + (v.stock||0); },0); }
function variantLabel(v){ return [v.size, v.color].filter(Boolean).join(" / ") || "قطعة واحدة"; }
function ensureVariants(p){
  if(p.variants && p.variants.length){
    p.variants.forEach(function(v){ if(!v.id) v.id = uid(); if(!v.barcode) v.barcode = generateEAN13(); });
    return;
  }
  var sizes = (p.sizes && p.sizes.length) ? p.sizes : [null];
  var colors = (p.colors && p.colors.length) ? p.colors : [null];
  var combos = [];
  sizes.forEach(function(s){ colors.forEach(function(c){ combos.push([s,c]); }); });
  var total = Math.max(0, parseInt(p.stock,10)||0);
  var per = Math.floor(total / combos.length);
  var rem = total % combos.length;
  p.variants = combos.map(function(cb, i){
    return { id: uid(), size: cb[0], color: cb[1], stock: per + (i<rem?1:0), barcode: generateEAN13() };
  });
}
function migrateProducts(){
  DB.products.forEach(function(p){
    ensureVariants(p);
    p.stock = stockOf(p);
    if(!p.image) p.image = "";
    if(!("offer" in p)) p.offer = null;
  });
}
function findVariantByBarcode(code){
  code = String(code||"").trim();
  if(!code) return null;
  for(var i=0;i<DB.products.length;i++){
    var p = DB.products[i];
    for(var j=0;j<(p.variants||[]).length;j++){
      if(String(p.variants[j].barcode) === code){ return {product:p, variant:p.variants[j]}; }
    }
  }
  return null;
}

/* ---------- باركود (رقم EAN-13 + رسم Code 39) ---------- */
function eanCheck(s12){
  var sum = 0;
  for(var i=0;i<12;i++){ var d = +s12[i]; sum += (i%2===0) ? d : d*3; }
  return String((10 - (sum%10)) % 10);
}
function generateEAN13(){
  var body = "2";
  for(var i=0;i<11;i++){ body += Math.floor(Math.random()*10); }
  return body + eanCheck(body);
}

function code39SVG(text, opts){
  opts = opts||{};
  var h = opts.height||52, unit = opts.unit||2, showText = opts.text !== false;
  var chars = ("*" + String(text).toUpperCase() + "*").split("");
  var x = 0, bars = [];
  chars.forEach(function(c){
    var pat = CODE39[c] || CODE39["-"];
    for(var i=0;i<9;i++){
      var w = (pat.charAt(i)==="w" ? 3 : 1) * unit;
      if(i%2===0){ bars.push('<rect x="'+x+'" y="0" width="'+w+'" height="'+h+'" fill="#000"/>'); }
      x += w;
    }
    x += unit;
  });
  var textH = showText ? 14 : 0;
  var W = x, H = h + textH;
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+bars.join("")+
    (showText ? '<text x="'+(W/2)+'" y="'+(h+11)+'" font-size="10" text-anchor="middle" font-family="monospace, Arial">'+esc(text)+'</text>' : '')+
    '</svg>';
}

function logAction(action, detail){
  var u = currentUser();

  DB.audit.push({id:uid(), date:Date.now(), userId: u ? u.id : null, userName: u ? u.name : "النظام", action:action, detail:detail||""});
  if(DB.audit.length > 3000){ DB.audit = DB.audit.slice(-3000); }
  saveDB();
}

/* ---------- العروض والخصومات ---------- */
function offerPrice(p){
  if(!p) return 0;
  if(p.offer && p.offer.type === "percent"){ return Math.max(0, p.price * (1 - p.offer.value/100)); }
  if(p.offer && p.offer.type === "fixed"){ return Math.max(0, p.offer.value); }
  return p.price;
}
function hasOffer(p){
  if(!p || !p.offer) return false;
  if(p.offer.type === "percent"){ return p.offer.value > 0 && p.offer.value < 100; }
  if(p.offer.type === "fixed"){ return p.offer.value > 0 && p.offer.value < p.price; }
  return false;
}
function offerLabel(p){
  if(!hasOffer(p)) return "";
  return p.offer.type === "percent" ? ("خصم "+p.offer.value+"%") : ("عرض "+fmt(p.offer.value));
}

/* الشخص اللي استلم/دفع لكل نوع سجل (مع بديل قديم) */
function saleCashBy(s){ return s.cashBy || s.userId; }
function expensePaidBy(e){ return e.paidBy || e.userId; }
function payOutPaidBy(p){ return p.paidBy || p.userId; }
function payInReceivedBy(p){ return p.receivedBy || p.userId; }
function incomeReceivedBy(i){ return i.receivedBy || i.userId; }

/* الرصيد الجاري لكل شخص (كل الفلوس اللي معاه) */
function userCashBalance(userId){
  var b = 0;
  DB.sales.forEach(function(s){ if(s.paymentMethod==="cash" && saleCashBy(s)===userId) b += s.total; });
  DB.orders.forEach(function(o){ if(o.collected && o.collectedBy===userId) b += (o.collectedAmount||o.total); });
  DB.otherIncome.forEach(function(i){ if(incomeReceivedBy(i)===userId) b += i.amount; });
  (DB.paymentsIn||[]).forEach(function(p){ if(payInReceivedBy(p)===userId) b += p.amount; });
  (DB.transfers||[]).forEach(function(t){ if(t.toId===userId) b += t.amount; if(t.fromId===userId) b -= t.amount; });
  DB.expenses.forEach(function(e){ if(e.paymentMethod==="cash" && expensePaidBy(e)===userId) b -= e.amount; });
  (DB.paymentsOut||[]).forEach(function(p){ if((p.paymentMethod||"cash")==="cash" && payOutPaidBy(p)===userId) b -= p.amount; });
  return b;
}
/* حركات شخص في يوم معين */
function dayMovements(userId, day){
  var from = new Date(day+"T00:00:00").getTime(), to = new Date(day+"T23:59:59").getTime();
  function inR(t){ return t>=from && t<=to; }
  var m = {cashSales:0, cod:0, transfersIn:0, transfersOut:0, expenses:0, supplierPay:0, otherIncome:0, custPay:0};
  DB.sales.forEach(function(s){ if(s.paymentMethod==="cash" && saleCashBy(s)===userId && inR(s.date)) m.cashSales += s.total; });
  DB.orders.forEach(function(o){ if(o.collected && o.collectedBy===userId && inR(o.collectedAt||o.date)) m.cod += (o.collectedAmount||o.total); });
  DB.otherIncome.forEach(function(i){ if(incomeReceivedBy(i)===userId && inR(i.date)) m.otherIncome += i.amount; });
  (DB.paymentsIn||[]).forEach(function(p){ if(payInReceivedBy(p)===userId && inR(p.date)) m.custPay += p.amount; });
  (DB.transfers||[]).forEach(function(t){ if(inR(t.date)){ if(t.toId===userId) m.transfersIn += t.amount; if(t.fromId===userId) m.transfersOut += t.amount; } });
  DB.expenses.forEach(function(e){ if(e.paymentMethod==="cash" && expensePaidBy(e)===userId && inR(e.date)) m.expenses += e.amount; });
  (DB.paymentsOut||[]).forEach(function(p){ if((p.paymentMethod||"cash")==="cash" && payOutPaidBy(p)===userId && inR(p.date)) m.supplierPay += p.amount; });
  m.net = m.cashSales + m.cod + m.otherIncome + m.custPay + m.transfersIn - m.expenses - m.supplierPay - m.transfersOut;
  return m;
}

function addVariantToCart(pid, vid, qty){
  var p = DB.products.find(function(x){ return x.id===pid; });
  if(!p) return;
  var v = (p.variants||[]).find(function(x){ return x.id===vid; });
  if(!v) return;
  qty = Math.max(1, parseInt(qty,10)||1);
  var inCart = cart.reduce(function(a,c){ return a + (c.variantId===v.id ? c.qty : 0); },0);
  if(inCart + qty > v.stock){ toast("الكمية المطلوبة أكبر من المتاح لهذا المقاس","err"); return; }
  var item = cart.find(function(c){ return c.variantId===v.id; });
  if(item){ item.qty += qty; }
  else{
    cart.push({key:v.id, variantId:v.id, productId:p.id, name:p.name, emoji:p.emoji, image:p.image, price:offerPrice(p), cost:p.cost, qty:qty, size:v.size, color:v.color, barcode:v.barcode});
  }
  renderCart();
  toast(p.emoji+" تمت إضافة "+p.name+(v.size||v.color ? " ("+variantLabel(v)+")" : ""));
}
function updateQty(key, d){
  var item = cart.find(function(c){ return c.key===key; });
  if(!item) return;
  if(d > 0){
    var p = DB.products.find(function(x){ return x.id===item.productId; });
    var v = p && (p.variants||[]).find(function(x){ return x.id===item.variantId; });
    var inCart = cart.reduce(function(a,c){ return a + (c.variantId===item.variantId ? c.qty : 0); },0);
    if(v && inCart + 1 > v.stock){ toast("وصلت للحد الأقصى المتاح لهذا المقاس","warn"); return; }
  }
  item.qty += d;
  if(item.qty <= 0){ cart = cart.filter(function(c){ return c.key!==key; }); }
  renderCart();
}
function removeItem(key){
  cart = cart.filter(function(c){ return c.key!==key; });

function cartTotals(){
  var subtotal = cart.reduce(function(a,c){ return a + c.price*c.qty; },0);
  var discount = 0; var tax = 0; var total = subtotal;
  var discEl = $("#chk-discount");
  if(discEl){
    discount = num(discEl.value);
    var taxable = Math.max(0, subtotal - discount);
    tax = taxable * (DB.settings.taxRate/100);
    total = taxable + tax;
  }
  return {subtotal:subtotal, discount:discount, tax:tax, total:total};
}

function completeSale(){
  var t = cartTotals();
  var method = $("#ck-method").value;
  var customerId = $("#ck-customer").value || null;
  var cashBy = $("#ck-person") ? $("#ck-person").value : null;
  if(method==="credit" && !customerId){
    toast("البيع الآجل يتطلب اختيار عميل","err");
    return;
  }
  var cashReceived = method==="cash" ? num($("#ck-cash").value) : 0;
  if(method==="cash" && cashReceived < t.total){
    toast("المبلغ المدفوع أقل من المطلوب","err");
    return;
  }
  var u = currentUser();
  var number = DB.settings.invoicePrefix + "-" + DB.settings.invoiceCounter;
  DB.settings.invoiceCounter++;
  var sale = {
    id: uid(),
    number: number,
    date: Date.now(),
    items: cart.map(function(c){ return {productId:c.productId, variantId:c.variantId, name:c.name, emoji:c.emoji, price:c.price, cost:c.cost, qty:c.qty, size:c.size, color:c.color}; }),
    subtotal: t.subtotal,
    discount: t.discount,
    tax: t.tax,
    total: t.total,
    profit: (t.subtotal - t.discount) - cart.reduce(function(a,c){ return a+c.cost*c.qty; },0),
    paymentMethod: method,
    cashReceived: cashReceived,
    change: Math.max(0, cashReceived - t.total),
    customerId: customerId,
    cashBy: cashBy || u.id,
    userId: u.id
  };
  DB.sales.push(sale);
  // إنقاص المخزون (لكل مقاس/لون)
  cart.forEach(function(c){
    var p = DB.products.find(function(x){ return x.id===c.productId; });
    if(p){
      var v = (p.variants||[]).find(function(x){ return x.id===c.variantId; });
      if(v){ v.stock = Math.max(0, v.stock - c.qty); }
      p.stock = stockOf(p);
    }
  });
  saveDB();
  logAction("بيع", "فاتورة " + number + " — " + fmt(t.total) + " " + DB.settings.currency);
  closeModal();
  cart = [];
  renderViewInPlace();
  showReceipt(sale);
  toast("تم حفظ الفاتورة " + number);
}

function receiptHTML(sale){
  var payLbl = payMethodLabel(sale.paymentMethod);
  var cust = sale.customerId ? DB.customers.find(function(c){ return c.id===sale.customerId; }) : null;
  var rows = sale.items.map(function(it){

function variantTableHTML(){
  if(!editDraft.variants.length){ return '<p class="muted small">أضف مقاسات أو ألوان ثم اضغط "توليد".</p>'; }
  var rows = editDraft.variants.map(function(v, i){
    return '<tr>'+
      '<td>'+esc(v.size||"—")+'</td>'+
      '<td>'+esc(v.color||"—")+'</td>'+
      '<td><input type="number" min="0" step="1" id="vstk-'+i+'" value="'+v.stock+'" style="width:90px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;"></td>'+
      '<td class="small muted" dir="ltr" style="text-align:left;">'+esc(v.barcode)+'</td>'+
      '<td><button type="button" class="icon-btn" title="إعادة توليد الباركود" onclick="regenBarcode('+i+')">'+icon("edit",13)+'</button></td>'+
    '</tr>';
  }).join("");
  return '<div class="table-wrap" style="border:1px solid var(--border);border-radius:10px;">'+
    '<table><thead><tr><th>المقاس</th><th>اللون</th><th>الكمية</th><th>الباركود</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function regenVariants(){
  var sizes = $("#p-sizes").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  var colors = $("#p-colors").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  if(!sizes.length) sizes = [null];
  if(!colors.length) colors = [null];
  var combos = [];
  sizes.forEach(function(s){ colors.forEach(function(c){ combos.push([s,c]); }); });
  var next = [];
  combos.forEach(function(cb){
    var existing = editDraft.variants.find(function(v){ return (v.size||null)===cb[0] && (v.color||null)===cb[1]; });
    if(existing){ next.push(existing); }
    else{ next.push({id:uid(), size:cb[0], color:cb[1], stock:0, barcode:generateEAN13()}); }
  });
  editDraft.variants = next;
  var el = $("#vtable"); if(el) el.innerHTML = variantTableHTML();
}
function regenBarcode(i){
  editDraft.variants[i].barcode = generateEAN13();
  var el = $("#vtable"); if(el) el.innerHTML = variantTableHTML();
}
function saveProduct(id){
  var name = $("#p-name").value.trim();
  var price = num($("#p-price").value);
  if(!name || price <= 0){ toast("أدخل اسم المنتج وسعر بيع صحيح","err"); return; }
  editDraft.name = name;
  editDraft.category = $("#p-cat").value || "عام";
  editDraft.sku = $("#p-sku").value.trim();
  editDraft.price = price;
  editDraft.cost = num($("#p-cost").value);
  editDraft.emoji = $("#p-emoji").value.trim() || "👕";
  editDraft.sizes = $("#p-sizes").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  editDraft.colors = $("#p-colors").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  var ot = $("#p-offer") ? $("#p-offer").value : "none";
  var ov = num($("#p-offer-val") ? $("#p-offer-val").value : 0);
  if(ot === "percent" && ov > 0){ editDraft.offer = {type:"percent", value:Math.min(99, ov)}; }
  else if(ot === "fixed" && ov > 0){ editDraft.offer = {type:"fixed", value:ov}; }
  else { editDraft.offer = null; }
  // قراءة كميات الجدول الحالي
  editDraft.variants.forEach(function(v, i){
    var el = $("#vstk-"+i);
    v.stock = Math.max(0, parseInt(el ? el.value : 0, 10)||0);
  });
  // إعادة بناء التركيبات حسب المقاسات/الألوان النهائية (الحفاظ على الكميات المدخلة)
  var sizes = editDraft.sizes.length ? editDraft.sizes : [null];
  var colors = editDraft.colors.length ? editDraft.colors : [null];
  var combos = [];
  sizes.forEach(function(s){ colors.forEach(function(c){ combos.push([s,c]); }); });
  var next = combos.map(function(cb){
    var ex = editDraft.variants.find(function(v){ return (v.size||null)===cb[0] && (v.color||null)===cb[1]; });
    return ex || {id:uid(), size:cb[0], color:cb[1], stock:0, barcode:generateEAN13()};
  });
  editDraft.variants = next;
  editDraft.stock = stockOf(editDraft);
  delete editDraft.id;
  if(id){
    var p = DB.products.find(function(x){ return x.id===id; });
    Object.assign(p, editDraft);
  } else {
    DB.products.push(Object.assign({id:uid()}, editDraft));
  }
  saveDB(); logAction(id ? "تعديل منتج" : "إضافة منتج", name);
  closeModal(); reloadProducts(); toast("تم حفظ المنتج");
}
function openCategories(){
  var list = DB.categories.map(function(c){
    var used = DB.products.filter(function(p){ return p.category===c; }).length;
    return '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">'+
      '<span class="bold">'+esc(c)+' <span class="muted small">('+used+' منتج)</span></span>'+
      '<button class="icon-btn danger" onclick="deleteCategory(\''+esc(c).replace(/'/g,"\\'")+'\')">'+icon("trash",16)+'</button>'+
    '</div>';
  }).join("");
  openModal(
    '<div class="modal-head"><h3>'+icon("tag",18)+' إدارة الفئات</h3><button class="icon-btn" onclick="closeModal()">'+icon("x",20)+'</button></div>'+
    '<div class="modal-body">'+
      '<div class="row mb16">'+
        '<input id="new-cat" placeholder="اسم الفئة الجديدة" style="flex:1;padding:10px 13px;border:1px solid var(--border);border-radius:10px;">'+
        '<button class="btn btn-primary" onclick="addCategory()">'+icon("plus",16)+' إضافة</button>'+
      '</div>'+
      list+
    '</div>'
  );
}
function addCategory(){
  var v = $("#new-cat").value.trim();
  if(!v){ return; }
  if(DB.categories.indexOf(v)!==-1){ toast("الفئة موجودة بالفعل","warn"); return; }
  DB.categories.push(v);
  saveDB(); openCategories();
}
function deleteCategory(c){
  confirmBox("حذف الفئة «"+c+"»؟ المنتجات التابعة لها ستبقى بدون تغيير.", function(){
    DB.categories = DB.categories.filter(function(x){ return x!==c; });
    saveDB(); openCategories(); toast("تم حذف الفئة");
  }, true);
}

function saveCustomer(id){
  var name = $("#c-name").value.trim();
  if(!name){ toast("أدخل اسم العميل","err"); return; }
  custAddrDraft.forEach(function(a, i){
    a.label = $("#ca-lbl-"+i) ? $("#ca-lbl-"+i).value.trim() : a.label;
    a.governorate = $("#ca-gov-"+i) ? $("#ca-gov-"+i).value : a.governorate;
    a.city = $("#ca-city-"+i) ? $("#ca-city-"+i).value.trim() : "";
    a.street = $("#ca-str-"+i) ? $("#ca-str-"+i).value.trim() : "";
  });
  var data = {name:name, phone:$("#c-phone").value.trim(), notes:$("#c-notes").value.trim(), addresses:custAddrDraft};
  if(id){ Object.assign(DB.customers.find(function(x){ return x.id===id; }), data); }
  else { DB.customers.push(Object.assign({id:uid(), createdAt:Date.now()}, data)); }
  saveDB(); logAction(id ? "تعديل عميل" : "إضافة عميل", name);
  closeModal(); reloadView(); toast("تم حفظ العميل");
}
function deleteCustomer(id){

    DB.customers = DB.customers.filter(function(x){ return x.id!==id; });
    saveDB(); logAction("حذف عميل", c.name);
    reloadView(); toast("تم حذف العميل");

/* ============================================================
   التقارير
   ============================================================ */
function rangeFilter(){
  var now = Date.now();
  var from, to;
  if(reportRange === "custom"){
    from = reportFrom ? new Date(reportFrom + "T00:00:00").getTime() : 0;
    to = reportTo ? new Date(reportTo + "T23:59:59").getTime() : now;
  } else {
    var d = new Date(); d.setHours(0,0,0,0);
    if(reportRange === "today"){ from = d.getTime(); }
    else if(reportRange === "7d"){ from = d.getTime() - 6*86400000; }
    else if(reportRange === "30d"){ from = d.getTime() - 29*86400000; }
    else { from = 0; }
    to = now;
  }
  return {from:from, to:to};
}
function viewReports(){
  var f = rangeFilter();
  var sales = DB.sales.filter(function(s){ return s.date>=f.from && s.date<=f.to; });
  var revenue = sales.reduce(function(a,s){ return a+s.total; },0);
  var profit = sales.reduce(function(a,s){ return a+s.profit; },0);
  var count = sales.length;
  var avg = count ? revenue/count : 0;

  // رسم بياني يومي
  var days = [];
  var cursor = new Date(f.from); cursor.setHours(0,0,0,0);
  var end = new Date(f.to);
  var guard = 0;
  while(cursor.getTime() <= end.getTime() && guard < 1000){
    days.push(dayKey(cursor.getTime()));
    cursor.setDate(cursor.getDate()+1);
    guard++;
  }
  var dayMap = {};
  sales.forEach(function(s){ var k=dayKey(s.date); dayMap[k] = (dayMap[k]||0) + s.total; });
  var maxV = Math.max.apply(null, days.map(function(d){ return dayMap[d]||0; }).concat([1]));
  var bars = days.map(function(d){
    var v = dayMap[d]||0;
    var h = Math.round((v/maxV)*100);
    var dd = d.split("-");
    return '<div class="bar-col" title="'+dd[2]+'/'+dd[1]+': '+fmt(v)+' '+esc(DB.settings.currency)+'">'+
      '<span class="bv">'+(v>0?fmtInt(v):"")+'</span>'+
      '<div class="bar" style="height:'+Math.max(2,h)+'%"></div>'+
      '<span class="bl">'+dd[2]+'/'+dd[1]+'</span>'+
    '</div>';
  }).join("");

  // الأكثر مبيعاً
  var prodMap = {};
  sales.forEach(function(s){ s.items.forEach(function(it){
    if(!prodMap[it.productId]) prodMap[it.productId] = {name:it.name, emoji:it.emoji, qty:0, rev:0};
    prodMap[it.productId].qty += it.qty;
    prodMap[it.productId].rev += it.qty*it.price;
  });});
  var top = Object.keys(prodMap).map(function(k){ return prodMap[k]; }).sort(function(a,b){ return b.qty-a.qty; }).slice(0,6);
  var maxQ = Math.max.apply(null, top.map(function(t){ return t.qty; }).concat([1]));
  var topHTML = top.length ? top.map(function(t){
    return '<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);">'+
      '<span>'+esc(t.emoji)+' '+esc(t.name)+'</span>'+
      '<span class="row" style="gap:10px;"><span class="muted small">'+t.qty+' قطعة</span><span class="bold">'+fmt(t.rev)+'</span></span>'+
    '</div>';
  }).join("") : '<p class="muted">لا توجد بيانات</p>';

  // طرق الدفع
  var payMap = {"cash":"نقدي","card":"كارت","wallet":"محفظة","credit":"آجل"};
  var payAgg = {};
  sales.forEach(function(s){ payAgg[s.paymentMethod] = (payAgg[s.paymentMethod]||0)+s.total; });
  var payHTML = Object.keys(payAgg).map(function(k){
    return '<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);"><span>'+(payMap[k]||k)+'</span><span class="bold">'+fmt(payAgg[k])+'</span></div>';
  }).join("") || '<p class="muted">لا توجد بيانات</p>';

  var list = sales.slice().sort(function(a,b){ return b.date-a.date; });
  var rows = list.map(function(s){
    return '<tr><td class="bold">'+esc(s.number)+'</td><td>'+dateStr(s.date)+' '+timeStr(s.date)+'</td>'+
      '<td>'+esc(userById(s.userId)?userById(s.userId).name:"-")+'</td>'+
      '<td>'+s.items.reduce(function(a,it){return a+it.qty;},0)+'</td>'+
      '<td class="bold">'+fmt(s.total)+'</td>'+
      '<td><span class="badge '+(s.paymentMethod==="cash"?"badge-green":(s.paymentMethod==="card"?"badge-blue":(s.paymentMethod==="credit"?"badge-red":"badge-amber")))+'">'+(payMap[s.paymentMethod]||s.paymentMethod)+'</span></td>'+
      '<td><div class="row" style="gap:2px;">'+
        '<button class="icon-btn primary" onclick="viewSale(\''+s.id+'\')">'+icon("eye",16)+'</button>'+
        (isAdmin() ? '<button class="icon-btn danger" onclick="returnSale(\''+s.id+'\')" title="إرجاع الفاتورة">'+icon("return",16)+'</button>' : '')+
      '</div></td></tr>';
  }).join("");

  var rangeSel = '<select onchange="setRange(this.value)">'+
    '<option value="today" '+(reportRange==="today"?"selected":"")+'>اليوم</option>'+
    '<option value="7d" '+(reportRange==="7d"?"selected":"")+'>آخر 7 أيام</option>'+
    '<option value="30d" '+(reportRange==="30d"?"selected":"")+'>آخر 30 يوم</option>'+
    '<option value="all" '+(reportRange==="all"?"selected":"")+'>كل الفترة</option>'+
    '<option value="custom" '+(reportRange==="custom"?"selected":"")+'>مخصص</option>'+
  '</select>' +
  (reportRange==="custom" ?
    '<input type="date" value="'+reportFrom+'" onchange="setFrom(this.value)">'+
    '<input type="date" value="'+reportTo+'" onchange="setTo(this.value)">' : "");

  return '<div class="filterbar">'+rangeSel+'</div>'+
    '<div class="stats">'+
      statCard("chart","var(--primary)", fmt(revenue), "إجمالي المبيعات ("+DB.settings.currency+")")+
      statCard("print","var(--green)", fmtInt(count), "عدد الفواتير")+
      statCard("card","#0ea5e9", fmt(avg), "متوسط قيمة الفاتورة")+
      statCard("chart","var(--amber)", fmt(profit), "صافي الربح")+
    '</div>'+
    '<div class="card mb16"><h3>'+icon("chart",17)+' المبيعات اليومية</h3><div class="bars">'+bars+'</div></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" class="mb16">'+
      '<div class="card"><h3>🏆 الأكثر مبيعاً</h3>'+topHTML+'</div>'+
      '<div class="card"><h3>'+icon("wallet",17)+' المبيعات حسب طريقة الدفع</h3>'+payHTML+'</div>'+
    '</div>'+
    '<div class="card"><h3>'+icon("print",17)+' سجل الفواتير ('+count+')</h3>'+
      '<div class="table-wrap"><table>'+
      '<thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الكاشير</th><th>القطع</th><th>الإجمالي</th><th>الدفع</th><th></th></tr></thead>'+
      '<tbody>'+(rows || '<tr><td colspan="7" class="muted" style="text-align:center;padding:30px;">لا توجد فواتير في هذه الفترة</td></tr>')+'</tbody>'+
      '</table></div></div>';
}
function setRange(v){ reportRange = v; renderViewInPlace(); }
function setFrom(v){ reportFrom = v; renderViewInPlace(); }
function setTo(v){ reportTo = v; renderViewInPlace(); }
function viewSale(id){
  var s = DB.sales.find(function(x){ return x.id===id; });
  if(!s) return;
  showReceipt(s);
}
function returnSale(id){
  var s = DB.sales.find(function(x){ return x.id===id; });
  if(!s) return;
  confirmBox("إرجاع الفاتورة "+s.number+"؟ سيتم إرجاع الكميات للمخزون وحذف الفاتورة.", function(){
    s.items.forEach(function(it){
      var p = DB.products.find(function(x){ return x.id===it.productId; });
      if(p){
        var v = (p.variants||[]).find(function(x){ return x.id===it.variantId; });
        if(!v && (it.size || it.color)){ v = (p.variants||[]).find(function(x){ return (x.size||null)===(it.size||null) && (x.color||null)===(it.color||null); }); }
        if(!v){ v = (p.variants||[])[0]; }
        if(v){ v.stock += it.qty; }
        p.stock = stockOf(p);
      }
    });
    DB.sales = DB.sales.filter(function(x){ return x.id!==id; });
    saveDB();
    logAction("إرجاع فاتورة", s.number);
    renderViewInPlace(); toast("تم إرجاع الفاتورة واستعادة المخزون");
  }, true);
}

function purchaseModalHTML(){
  var supOpts = DB.suppliers.map(function(s){ return '<option value="'+s.id+'" '+(purchaseDraft.supplierId===s.id?"selected":"")+'>'+esc(s.name)+'</option>'; }).join("");
  return '<div class="modal-head"><h3>'+icon("truck",18)+' فاتورة شراء جديدة</h3><button class="icon-btn" onclick="closeModal()">'+icon("x",20)+'</button></div>'+
  '<div class="modal-body">'+
    '<div class="form-grid">'+
      '<div class="field"><label>المورد *</label><select id="pur-supplier" onchange="purchaseDraft.supplierId=this.value">'+supOpts+'</select></div>'+
      '<div class="field"><label>التاريخ</label><input id="pur-date" type="date" value="'+esc(purchaseDraft.date||todayKey())+'" onchange="purchaseDraft.date=this.value"></div>'+
    '</div>'+
    (DB.suppliers.length ? '' : '<div class="warn-banner" style="margin:8px 0;">لا يوجد موردون بعد — أضف مورداً سريعاً بالأسفل أو من زر "إضافة مورد".</div>')+
    '<div class="row mt8">'+
      '<input id="pur-new-supplier" placeholder="أو أضف مورداً جديداً بالاسم..." style="flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:10px;">'+

    '</div>'+
    '<div class="row mt16 mb8"><span class="bold grow">الأصناف المشتراة</span><button class="btn btn-soft btn-sm" onclick="addPurLine()">'+icon("plus",14)+' سطر</button></div>'+
    '<div id="pur-lines">'+purchaseLinesHTML()+'</div>'+
    '<div class="row mt16" style="justify-content:flex-end;">'+
      '<span class="muted">الإجمالي: </span><b style="font-size:16px;" id="pur-total"></b>'+
    '</div>'+
  '</div>'+
  '<div class="modal-foot">'+
    '<button class="btn btn-green btn-block" onclick="savePurchase()">'+icon("check",16)+' حفظ وزيادة المخزون</button>'+
  '</div>';
}
function purchaseLinesHTML(){
  if(!DB.products.length){ return '<p class="muted small">لا توجد منتجات — أضف منتجات أولاً.</p>'; }
  return purchaseDraft.items.map(function(it, i){
    var prodOpts = DB.products.map(function(p){ return '<option value="'+p.id+'" '+(it.productId===p.id?"selected":"")+'>'+esc(p.name)+'</option>'; }).join("");
    var p = DB.products.find(function(x){ return x.id===it.productId; });
    var varOpts = ((p && p.variants) ? p.variants : []).map(function(v){ return '<option value="'+v.id+'" '+(it.variantId===v.id?"selected":"")+'>'+esc(variantLabel(v))+' ('+v.stock+')</option>'; }).join("");
    return '<div class="pur-line">'+
      '<select onchange="onPurProduct('+i+',this.value)">'+prodOpts+'</select>'+
      '<select onchange="onPurVariant('+i+',this.value)">'+varOpts+'</select>'+
      '<input type="number" min="1" value="'+it.qty+'" oninput="onPurQty('+i+',this.value)">'+
      '<input type="number" min="0" step="0.5" value="'+it.cost+'" oninput="onPurCost('+i+',this.value)">'+
      '<button class="icon-btn danger" onclick="removePurLine('+i+')">'+icon("trash",15)+'</button>'+
    '</div>';
  }).join("");
}
function onPurProduct(i, pid){
  var p = DB.products.find(function(x){ return x.id===pid; });
  purchaseDraft.items[i].productId = pid;
  purchaseDraft.items[i].variantId = (p && p.variants && p.variants.length) ? p.variants[0].id : "";
  purchaseDraft.items[i].cost = p ? p.cost : 0;
  refreshPurLines();
}
function onPurVariant(i, vid){ purchaseDraft.items[i].variantId = vid; refreshPurTotal(); }
function onPurQty(i, v){ purchaseDraft.items[i].qty = Math.max(1, parseInt(v,10)||1); refreshPurTotal(); }
function onPurCost(i, v){ purchaseDraft.items[i].cost = num(v); refreshPurTotal(); }
function addPurLine(){ purchaseDraft.items.push(blankPurchaseLine()); refreshPurLines(); }
function removePurLine(i){ purchaseDraft.items.splice(i,1); if(!purchaseDraft.items.length) purchaseDraft.items.push(blankPurchaseLine()); refreshPurLines(); }
function refreshPurLines(){ var el = $("#pur-lines"); if(el) el.innerHTML = purchaseLinesHTML(); refreshPurTotal(); }
function refreshPurTotal(){
  var el = $("#pur-total");
  if(el){
    var t = purchaseDraft.items.reduce(function(a,it){ return a + it.qty*it.cost; },0);
    el.textContent = fmt(t) + " " + DB.settings.currency;
  }
}
function quickAddSupplier(){
  var v = $("#pur-new-supplier").value.trim();
  if(!v){ toast("اكتب اسم المورد","err"); return; }
  var s = {id:uid(), name:v, phone:"", notes:""};
  DB.suppliers.push(s);
  purchaseDraft.supplierId = s.id;
  saveDB();
  var sel = $("#pur-supplier");
  if(sel){ sel.innerHTML = supplierOptionsHTML(); sel.value = s.id; }
  $("#pur-new-supplier").value = "";
  toast("تمت إضافة المورد");
}
function savePurchase(){
  var supId = purchaseDraft.supplierId;
  if(!supId){ toast("اختر مورداً","err"); return; }
  var lines = purchaseDraft.items.filter(function(it){ return it.productId && it.qty > 0; });
  if(!lines.length){ toast("أضف صنفاً واحداً على الأقل","err"); return; }
  var sup = DB.suppliers.find(function(s){ return s.id===supId; });
  var number = "PUR-" + (DB.settings.purchaseCounter || 1001);
  DB.settings.purchaseCounter = (DB.settings.purchaseCounter || 1001) + 1;
  var total = lines.reduce(function(a,it){ return a + it.qty*it.cost; },0);
  var items = lines.map(function(it){
    var p = DB.products.find(function(x){ return x.id===it.productId; });
    var v = p && (p.variants||[]).find(function(x){ return x.id===it.variantId; });
    if(v){ v.stock += it.qty; }
    if(p){ p.cost = it.cost; p.stock = stockOf(p); }
    return {productId:it.productId, variantId:it.variantId, name:p?p.name:"", size:v?v.size:null, color:v?v.color:null, qty:it.qty, cost:it.cost};
  });
  DB.purchases.push({id:uid(), number:number, date: new Date((purchaseDraft.date||todayKey())+"T12:00:00").getTime(), supplierId:supId, supplierName:sup.name, items:items, total:total, userId:currentUser().id});
  saveDB();
  logAction("فاتورة شراء", number + " — " + sup.name + " — " + fmt(total) + " " + DB.settings.currency);
  closeModal(); renderViewInPlace(); toast("تم تسجيل الفاتورة وزيادة المخزون");
}
function viewPurchase(id){
  var p = DB.purchases.find(function(x){ return x.id===id; });
  if(!p) return;
  var rows = p.items.map(function(it){
    var opt = [it.size, it.color].filter(Boolean).join(" / ");
    return '<tr><td class="bold">'+esc(it.name)+(opt?'<div class="small muted">'+esc(opt)+'</div>':'')+'</td>'+
      '<td>'+it.qty+'</td><td>'+fmt(it.cost)+'</td><td class="bold">'+fmt(it.qty*it.cost)+'</td></tr>';
  }).join("");
  openModal(
    '<div class="modal-head"><h3>'+icon("truck",18)+' فاتورة '+esc(p.number)+'</h3><button class="icon-btn" onclick="closeModal()">'+icon("x",20)+'</button></div>'+
    '<div class="modal-body">'+
      '<p class="mb8"><span class="muted">المورد: </span><b>'+esc(p.supplierName)+'</b> — <span class="muted">التاريخ: </span><b>'+dateStr(p.date)+'</b></p>'+
      '<div class="table-wrap"><table><thead><tr><th>الصنف</th><th>الكمية</th><th>التكلفة</th><th>الإجمالي</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="tot-row grand mt16"><span>الإجمالي</span><span>'+fmt(p.total)+' '+esc(DB.settings.currency)+'</span></div>'+
    '</div>'
  );
}
function deletePurchase(id){
  var p = DB.purchases.find(function(x){ return x.id===id; });
  if(!p) return;
  confirmBox("حذف فاتورة الشراء "+p.number+"؟ سيتم خصم الكميات من المخزون.", function(){
    p.items.forEach(function(it){
      var pr = DB.products.find(function(x){ return x.id===it.productId; });
      if(pr){
        var v = pr && (pr.variants||[]).find(function(x){ return x.id===it.variantId; });
        if(v){ v.stock = Math.max(0, v.stock - it.qty); }
        pr.stock = stockOf(pr);
      }
    });
    DB.purchases = DB.purchases.filter(function(x){ return x.id!==id; });
    saveDB(); logAction("حذف فاتورة شراء", p.number);
    renderViewInPlace(); toast("تم حذف الفاتورة");
  }, true);
}

function onOrderCustomer(cid){
  orderDraft.customerId = cid || null;
  var c = DB.customers.find(function(x){ return x.id===cid; });
  if(c){
    orderDraft.customerName = c.name;
    orderDraft.phone = c.phone || "";
    if(c.addresses && c.addresses.length){
      var a = c.addresses[0];
      orderDraft.governorate = a.governorate || orderDraft.governorate;
      orderDraft.city = a.city || "";
      orderDraft.street = a.street || "";
    }
  }
  refreshOrderFormFields();
}
function onOrderAddress(aid){
  var c = DB.customers.find(function(x){ return x.id===orderDraft.customerId; });
  if(!c) return;
  var a = (c.addresses||[]).find(function(x){ return x.id===aid; });
  if(a){
    orderDraft.governorate = a.governorate || orderDraft.governorate;
    orderDraft.city = a.city || "";
    orderDraft.street = a.street || "";
    if(!orderDraft.phone && a.phone) orderDraft.phone = a.phone;
    refreshOrderFormFields();
  }
}
function onOrderGov(gov){
  orderDraft.governorate = gov;
  orderDraft.shipping = shipPriceFor(gov);

  refreshOrderTotal();
}
function refreshOrderFormFields(){
  var n = $("#ord-name"); if(n) n.value = orderDraft.customerName;
  var ph = $("#ord-phone"); if(ph) ph.value = orderDraft.phone;
  var ad = $("#ord-addr"); if(ad) ad.innerHTML = customerAddressOptions(orderDraft.customerId);
  var gv = $("#ord-gov"); if(gv) gv.value = orderDraft.governorate;
  var ci = $("#ord-city"); if(ci) ci.value = orderDraft.city;
  var st = $("#ord-street"); if(st) st.value = orderDraft.street;
  refreshOrderTotal();
}
function onOrderProduct(i, pid){
  var p = DB.products.find(function(x){ return x.id===pid; });
  orderDraft.items[i].productId = pid;
  orderDraft.items[i].variantId = (p && p.variants && p.variants.length) ? p.variants[0].id : "";
  orderDraft.items[i].price = p ? offerPrice(p) : 0;
  refreshOrderLines();
}
function onOrderVariant(i, vid){ orderDraft.items[i].variantId = vid; refreshOrderTotal(); }
function onOrderQty(i, v){ orderDraft.items[i].qty = Math.max(1, parseInt(v,10)||1); refreshOrderTotal(); }
function onOrderPrice(i, v){ orderDraft.items[i].price = num(v); refreshOrderTotal(); }
function addOrderLine(){ orderDraft.items.push(blankOrderLine()); refreshOrderLines(); }
function removeOrderLine(i){ orderDraft.items.splice(i,1); if(!orderDraft.items.length) orderDraft.items.push(blankOrderLine()); refreshOrderLines(); }
function refreshOrderLines(){ var el = $("#ord-lines"); if(el) el.innerHTML = orderLinesHTML(); refreshOrderTotal(); }
function refreshOrderTotal(){
  var el = $("#ord-total");
  if(el){
    var sub = orderDraft.items.reduce(function(a,it){ return a+it.qty*it.price; },0);
    var t = sub + (orderDraft.shipping||0) - (orderDraft.discount||0);
    el.textContent = fmt(Math.max(0,t)) + " " + DB.settings.currency;
  }
}
function saveOrder(){
  orderDraft.customerName = ($("#ord-name") ? $("#ord-name").value : orderDraft.customerName).trim();
  orderDraft.phone = ($("#ord-phone") ? $("#ord-phone").value : orderDraft.phone).trim();
  orderDraft.governorate = $("#ord-gov") ? $("#ord-gov").value : orderDraft.governorate;
  orderDraft.city = ($("#ord-city") ? $("#ord-city").value : "").trim();
  orderDraft.street = ($("#ord-street") ? $("#ord-street").value : "").trim();
  orderDraft.note = ($("#ord-note") ? $("#ord-note").value : "").trim();
  orderDraft.shipping = num($("#ord-ship") ? $("#ord-ship").value : orderDraft.shipping);
  orderDraft.discount = num($("#ord-disc") ? $("#ord-disc").value : 0);
  if(!orderDraft.customerName){ toast("اكتب اسم العميل","err"); return; }
  if(!orderDraft.governorate){ toast("اختر المحافظة","err"); return; }
  var lines = orderDraft.items.filter(function(it){ return it.productId && it.qty>0; });
  if(!lines.length){ toast("أضف صنفاً واحداً على الأقل","err"); return; }
  for(var i=0;i<lines.length;i++){
    var p = DB.products.find(function(x){ return x.id===lines[i].productId; });
    var v = p && (p.variants||[]).find(function(x){ return x.id===lines[i].variantId; });
    if(v && lines[i].qty > v.stock){ toast("الكمية أكبر من المتاح: "+p.name+" ("+variantLabel(v)+")","err"); return; }
  }
  var u = currentUser();
  var number = "ORD-" + (DB.settings.orderCounter || 1001);
  DB.settings.orderCounter = (DB.settings.orderCounter || 1001) + 1;
  var subtotal = lines.reduce(function(a,it){ return a+it.qty*it.price; },0);
  var total = Math.max(0, subtotal + orderDraft.shipping - orderDraft.discount);
  var items = lines.map(function(it){
    var p = DB.products.find(function(x){ return x.id===it.productId; });
    var v = p && (p.variants||[]).find(function(x){ return x.id===it.variantId; });
    if(v){ v.stock = Math.max(0, v.stock - it.qty); }
    if(p){ p.stock = stockOf(p); }
    return {productId:it.productId, variantId:it.variantId, name:p?p.name:"", size:v?v.size:null, color:v?v.color:null, qty:it.qty, price:it.price, cost:p?p.cost:0};
  });
  var order = {
    id:uid(), number:number, date:Date.now(), userId:u.id,
    customerId:orderDraft.customerId, customerName:orderDraft.customerName, phone:orderDraft.phone,
    governorate:orderDraft.governorate, city:orderDraft.city, street:orderDraft.street,
    items:items, subtotal:subtotal, shipping:orderDraft.shipping, discount:orderDraft.discount, total:total,
    paymentStatus:orderDraft.paymentStatus, collected:false, status:"new",
    companyId:null, awb:"", note:orderDraft.note
  };
  DB.orders.push(order);
  saveDB(); logAction("أوردر جديد", number + " — " + order.customerName + " — " + fmt(total) + " " + DB.settings.currency);
  closeModal(); renderViewInPlace(); toast("تم حفظ الأوردر " + number);
  showOrderSlip(order);
}
function advanceOrder(id){
  var o = DB.orders.find(function(x){ return x.id===id; });
  if(!o) return;
  var next = flowNext(o.status);
  if(!next) return;
  o.status = next;
  if(next==="shipped") o.shippedDate = Date.now();
  if(next==="delivered") o.deliveredDate = Date.now();
  saveDB(); logAction("تحديث حالة أوردر", o.number+" → "+statusMeta(next).label);
  renderViewInPlace(); toast(o.number+" → "+statusMeta(next).label);
}
function restoreOrderStock(o){
  o.items.forEach(function(it){
    var p = DB.products.find(function(x){ return x.id===it.productId; });
    if(p){
      var v = (p.variants||[]).find(function(x){ return x.id===it.variantId; });
      if(v) v.stock += it.qty;
      p.stock = stockOf(p);
    }
  });
}
function returnOrder(id){
  var o = DB.orders.find(function(x){ return x.id===id; });
  if(!o) return;
  if(o.status==="returned" || o.status==="cancelled"){ toast("الأوردر بالفعل مرتجع/ملغي","warn"); return; }
  confirmBox("تسجيل الأوردر "+o.number+" كمرتجع؟ سيتم إرجاع الكميات للمخزون.", function(){
    restoreOrderStock(o);

}

function setExpQ(v){ expQ = v; renderViewInPlace(); }
function setExpCat(v){ expCat = v; renderViewInPlace(); }
function setExpFrom(v){ expFrom = v; renderViewInPlace(); }
function setExpTo(v){ expTo = v; renderViewInPlace(); }
function viewExpenses(){
  if(!isAdmin()){ return '<div class="empty"><div class="big">🔒</div><p>هذه الصفحة للمدير فقط</p></div>'; }
  var from = expFrom ? new Date(expFrom+"T00:00:00").getTime() : 0;
  var to = expTo ? new Date(expTo+"T23:59:59").getTime() : Date.now()+86400000;
  var q = expQ.toLowerCase();
  var list = DB.expenses.slice().sort(function(a,b){ return b.date-a.date; }).filter(function(e){
    return e.date>=from && e.date<=to && (expCat==="الكل" || e.category===expCat) && (!q || ((e.note||"")+" "+(e.category||"")).toLowerCase().indexOf(q)!==-1);
  });
  var total = expenseTotal(list);
  var catOpts = ["الكل"].concat(DB.expenseCategories).map(function(c){ return '<option value="'+esc(c)+'" '+(expCat===c?"selected":"")+'>'+esc(c)+'</option>'; }).join("");
  var byCat = {};
  list.forEach(function(e){ byCat[e.category||"أخرى"] = (byCat[e.category||"أخرى"]||0) + e.amount; });
  var catRows = Object.keys(byCat).map(function(c){
    var pct = total>0 ? Math.round(byCat[c]/total*100) : 0;
    return '<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);">'+
      '<span>'+esc(c)+'</span>'+
      '<span class="row" style="gap:10px;"><span class="muted small">'+pct+'%</span><span class="bold">'+fmt(byCat[c])+'</span></span>'+
    '</div>';
  }).join("") || '<p class="muted small">لا توجد بيانات</p>';
  var rows = list.map(function(e){
    return '<tr><td>'+dateStr(e.date)+'</td><td><span class="badge badge-gray">'+esc(e.category||"أخرى")+'</span></td>'+
      '<td class="muted">'+esc(e.note||"—")+'</td>'+
      '<td>'+payMethodLabel(e.paymentMethod)+'</td>'+
      '<td class="bold" style="color:var(--red);">- '+fmt(e.amount)+'</td>'+
      '<td><button class="icon-btn danger" onclick="deleteExpense(\''+e.id+'\')">'+icon("trash",16)+'</button></td></tr>';
  }).join("");
  return '<div class="filterbar">'+
    '<input placeholder="ابحث في المصاريف..." style="flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;" value="'+esc(expQ)+'" oninput="setExpQ(this.value)">'+
    '<select onchange="setExpCat(this.value)">'+catOpts+'</select>'+
    '<input type="date" value="'+expFrom+'" onchange="setExpFrom(this.value)">'+
    '<input type="date" value="'+expTo+'" onchange="setExpTo(this.value)">'+
    '<button class="btn btn-primary" onclick="openExpenseForm()">'+icon("plus",16)+' تسجيل مصروف</button>'+
    '<button class="btn btn-ghost" onclick="openExpenseCats()">'+icon("tag",16)+' الفئات</button>'+
  '</div>'+
  '<div class="stats">'+
    statCard("coins","var(--red)", fmt(total), "إجمالي المصاريف المفلترة")+
    statCard("print","var(--primary)", fmtInt(list.length), "عدد المصاريف")+
  '</div>'+
  '<div style="display:grid;grid-template-columns:1fr 2fr;gap:16px;">'+
    '<div class="card"><h3>'+icon("chart",17)+' توزيع المصاريف</h3>'+catRows+'</div>'+
    '<div class="card"><h3>'+icon("coins",17)+' سجل المصاريف</h3>'+
      '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الفئة</th><th>البيان</th><th>الدفع</th><th>المبلغ</th><th></th></tr></thead>'+
      '<tbody>'+(rows || '<tr><td colspan="6" class="muted" style="text-align:center;padding:30px;">لا توجد مصاريف</td></tr>')+'</tbody></table></div>'+
    '</div>'+
  '</div>';
}

  var catOpts = DB.expenseCategories.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join("");
  openModal(

/* ============================================================
   الخزنة — إقفال يومي لكل من يستلم فلوس
   ============================================================ */
function setCashDay(v){ cashDay = v; renderViewInPlace(); }
function cashDiff(i){
  var el = $("#cash-act-"+i);
  var diffEl = $("#cash-diff-"+i);
  if(!el || !diffEl) return;
  var actual = num(el.value);
  var exp = cashDayData[i] ? cashDayData[i].expected : 0;
  if(el.value === ""){ diffEl.textContent = "—"; diffEl.style.color = "inherit"; return; }
  var d = actual - exp;
  if(Math.abs(d) < 0.005){ diffEl.textContent = "متطابق ✓"; diffEl.style.color = "var(--green)"; }
  else { diffEl.textContent = (d>0?"+":"")+fmt(d)+" "+DB.settings.currency; diffEl.style.color = d>0 ? "var(--green)" : "var(--red)"; }
}
function saveClosing(i, userId){
  var el = $("#cash-act-"+i);
  if(!el) return;
  var actual = num(el.value);
  if(el.value === ""){ toast("اكتب المبلغ الفعلي أولاً","err"); return; }
  var data = cashDayData[i];
  var prev = (DB.cashClosings||[]).find(function(c){ return c.userId===userId && c.day===cashDay; });
  if(prev){ prev.actual = actual; prev.expected = data.expected; prev.date = Date.now(); prev.userName = data.u.name; }
  else{ DB.cashClosings.push({id:uid(), userId:userId, day:cashDay, date:Date.now(), expected:data.expected, actual:actual, userName:data.u.name}); }
  saveDB(); logAction("إقفال خزنة", data.u.name+" — "+dateStr(new Date(cashDay+"T00:00:00").getTime()));
  renderViewInPlace(); toast("تم حفظ الإقفال");
}

      statCard("box","var(--amber)", fmt(cogs), "تكلفة البضاعة المباعة")+

/* ============================================================
   الأصول المتداولة والديون (المركز المالي)
   ============================================================ */
function inventoryCostValue(){
  var value = 0, pieces = 0;
  DB.products.forEach(function(p){
    (p.variants||[]).forEach(function(v){
      var q = v.stock||0;
      pieces += q;
      value += q * (p.cost||0);
    });
  });
  return {value:value, pieces:pieces};
}
function codReceivableValue(){
  return DB.orders.reduce(function(a,o){
    if(o.paymentStatus==="cod" && !o.collected && ["returned","cancelled"].indexOf(o.status)===-1) return a + o.total;
    return a;
  },0);
}
function electronicAssetsValue(){
  var v = 0;
  DB.sales.forEach(function(s){ if(s.paymentMethod==="card"||s.paymentMethod==="wallet") v += s.total; });
  DB.orders.forEach(function(o){ if(o.paymentStatus==="paid" && ["returned","cancelled"].indexOf(o.status)===-1) v += o.total; });
  return v;
}
function customerDebtTotal(){
  var t = 0;
  DB.customers.forEach(function(c){ var b = customerBalance(c.id); if(b > 0.005) t += b; });
  return t;
}
function supplierDebtTotal(){
  var t = 0;
  DB.suppliers.forEach(function(s){ var b = supplierBalance(s.id); if(b > 0.005) t += b; });
  return t;
}
function cashOnHandTotal(){
  return DB.users.reduce(function(a,u){ return a + userCashBalance(u.id); },0);
}
function viewAssets(){
  if(!isAdmin()){ return '<div class="empty"><div class="big">🔒</div><p>هذه الصفحة للمدير فقط</p></div>'; }
  var inv = inventoryCostValue();
  var cashTotal = cashOnHandTotal();
  var cod = codReceivableValue();
  var custDebt = customerDebtTotal();
  var electronic = electronicAssetsValue();
  var supDebt = supplierDebtTotal();

  var totalAssets = inv.value + cashTotal + cod + custDebt + electronic;
  var totalLiab = supDebt;
  var net = totalAssets - totalLiab;

  function line(lbl, val, note, cls){
    return '<div class="tot-row"><span>'+lbl+(note?' <span class="small muted">'+note+'</span>':'')+'</span><span class="bold '+(cls||"")+'">'+fmt(val)+'</span></div>';
  }

  var perCash = DB.users.map(function(u){
    var b = userCashBalance(u.id);
    return '<div class="tot-row"><span class="muted small">· '+esc(u.name)+'</span><span style="color:'+(b>=0?'var(--green)':'var(--red)')+';">'+fmt(b)+'</span></div>';
  }).join("");

  var perSup = DB.suppliers.map(function(s){
    var b = supplierBalance(s.id);
    if(b <= 0.005) return "";
    return '<div class="tot-row"><span class="muted small">· '+esc(s.name)+'</span><span style="color:var(--red);">'+fmt(b)+'</span></div>';
  }).join("") || '<p class="muted small">لا توجد ديون للموردين</p>';

  var debtCusts = DB.customers.filter(function(c){ return customerBalance(c.id) > 0.005; });
  var perCust = debtCusts.map(function(c){
    return '<div class="tot-row"><span class="muted small">· '+esc(c.name)+'</span><span style="color:var(--green);">'+fmt(customerBalance(c.id))+'</span></div>';
  }).join("") || '<p class="muted small">لا توجد مستحقات على العملاء</p>';

  return '<div class="stats">'+
    statCard("pie","var(--primary)", fmt(totalAssets), "إجمالي الأصول")+
    statCard("scale","var(--red)", fmt(totalLiab), "إجمالي الديون (علينا)")+
    statCard("trendingup",(net>=0?"var(--green)":"var(--red)"), (net<0?"- ":"")+fmt(Math.abs(net)), "صافي الأصول (حقوق المالك)")+
  '</div>'+
  '<div style="display:grid;grid-template-columns:1.2fr 1fr;gap:16px;">'+
    '<div class="card"><h3>'+icon("pie",17)+' الأصول المتداولة (اللي عندك)</h3>'+
      line("قيمة المخزون (بتكلفة الشراء)", inv.value, inv.pieces+" قطعة", "var(--green)")+
      line("النقدية مع الأشخاص", cashTotal, "", "var(--green)")+
      perCash+
      line("أوردرات COD قيد التحصيل", cod, "", "var(--green)")+
      line("مستحقات العملاء (ديون لنا)", custDebt, "", "var(--green)")+
      perCust+
      line("أموال إلكترونية (كارت/محفظة/مدفوع مسبق)", electronic, "", "var(--green)")+
      '<div class="tot-row grand" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;"><span>إجمالي الأصول</span><span>'+fmt(totalAssets)+' '+esc(DB.settings.currency)+'</span></div>'+
    '</div>'+
    '<div class="card"><h3>'+icon("scale",17)+' الديون (اللي عليك)</h3>'+
      line("ديون الموردين", supDebt, "", "var(--red)")+
      perSup+
      '<div class="tot-row grand" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;"><span>إجمالي الديون</span><span>'+fmt(totalLiab)+' '+esc(DB.settings.currency)+'</span></div>'+
      '<div class="tot-row" style="margin-top:14px;font-size:16px;background:'+(net>=0?'var(--green-soft)':'var(--red-soft)')+';padding:12px;border-radius:10px;color:'+(net>=0?'var(--green)':'var(--red)')+';">'+
        '<span>صافي الأصول</span><span>'+(net<0?"- ":"")+fmt(Math.abs(net))+' '+esc(DB.settings.currency)+'</span></div>'+
      '<p class="small muted mt8">💡 صافي الأصول = كل اللي تملكه (مخزون + نقدية + مستحقات + أموال إلكترونية) − الديون اللي عليك. ده يمثل صافي ثروة النشاط في اللحظة دي.</p>'+
    '</div>'+
  '</div>';
}

/* ============================================================
