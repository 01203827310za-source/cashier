   ============================================================ */
function auditBadge(action){
  if(action.indexOf("حذف") !== -1 || action.indexOf("إرجاع") !== -1) return "badge-red";
  if(action.indexOf("بيع") !== -1 || action.indexOf("شراء") !== -1) return "badge-green";
  if(action.indexOf("إضافة") !== -1 || action.indexOf("تسجيل دخول") !== -1) return "badge-blue";
  return "badge-gray";
}
function setAuditQ(v){ auditQ = v; renderViewInPlace(); }
function setAuditFrom(v){ auditFrom = v; renderViewInPlace(); }
function setAuditTo(v){ auditTo = v; renderViewInPlace(); }
function viewAudit(){
  if(!isAdmin()){ return '<div class="empty"><div class="big">🔒</div><p>هذه الصفحة للمدير فقط</p></div>'; }
  var from = auditFrom ? new Date(auditFrom+"T00:00:00").getTime() : 0;
  var to = auditTo ? new Date(auditTo+"T23:59:59").getTime() : Date.now()+86400000;
  var q = auditQ.toLowerCase();
  var list = DB.audit.slice().sort(function(a,b){ return b.date-a.date; }).filter(function(a){
    return a.date >= from && a.date <= to && (!q || ((a.action||"")+" "+(a.detail||"")+" "+(a.userName||"")).toLowerCase().indexOf(q) !== -1);
  }).slice(0, 300);
  var rows = list.map(function(a){
    return '<tr><td>'+dateStr(a.date)+' '+timeStr(a.date)+'</td><td>'+esc(a.userName||"—")+'</td>'+
      '<td><span class="badge '+auditBadge(a.action)+'">'+esc(a.action)+'</span></td>'+
      '<td class="muted">'+esc(a.detail)+'</td></tr>';
  }).join("");
  return '<div class="filterbar">'+
    '<input placeholder="ابحث في السجل..." style="flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;" value="'+esc(auditQ)+'" oninput="setAuditQ(this.value)">'+
    '<input type="date" value="'+auditFrom+'" onchange="setAuditFrom(this.value)">'+
    '<input type="date" value="'+auditTo+'" onchange="setAuditTo(this.value)">'+
    ((auditFrom||auditTo) ? '<button class="btn btn-ghost" onclick="auditFrom=\'\';auditTo=\'\';renderViewInPlace()">مسح الفلترة</button>' : '')+
  '</div>'+
  '<div class="card"><h3>'+icon("history",17)+' سجل الحركات ('+list.length+')</h3>'+
    '<div class="table-wrap"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th></tr></thead>'+
    '<tbody>'+(rows || '<tr><td colspan="4" class="muted" style="text-align:center;padding:30px;">لا توجد حركات مسجلة</td></tr>')+'</tbody></table></div>'+
    '<p class="muted small mt8">💡 يُحتفظ بآخر 3000 حركة كحد أقصى.</p></div>';
}

/* ============================================================
   الكاشير والصلاحيات
   ============================================================ */
function viewCashiers(){
  if(!isAdmin()){ return '<div class="empty"><div class="big">🔒</div><p>هذه الصفحة للمدير فقط</p></div>'; }
  var rows = DB.users.map(function(u){
    return '<tr>'+
      '<td><div class="row"><div class="avatar" style="width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;">'+esc(u.name.charAt(0))+(u.name.charAt(1)||"")+'</div><div class="bold">'+esc(u.name)+'</div></div></td>'+
      '<td dir="ltr" style="text-align:right;">'+esc(u.username)+'</td>'+
      '<td><span class="badge '+(u.role==="admin"?"badge-blue":"badge-gray")+'">'+(u.role==="admin"?"مدير":"كاشير")+'</span></td>'+
      '<td><div class="row" style="gap:2px;">'+
        '<button class="icon-btn primary" onclick="openUserForm(\''+u.id+'\')">'+icon("edit",16)+'</button>'+
        '<button class="icon-btn danger" onclick="deleteUser(\''+u.id+'\')">'+icon("trash",16)+'</button>'+
      '</div></td>'+
    '</tr>';
  }).join("");
  return '<div class="filterbar"><button class="btn btn-primary" onclick="openUserForm()">'+icon("plus",16)+' إضافة كاشير</button></div>'+
    '<div class="card"><div class="table-wrap"><table>'+
    '<thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصلاحية</th><th></th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>'+
    '<p class="muted small mt8">🔹 المدير: صلاحية كاملة. الكاشير: بيع وعرض المنتجات والعملاء والتقارير فقط.</p></div>';
}
function openUserForm(id){
  var u = id ? DB.users.find(function(x){ return x.id===id; }) : null;
  openModal(
    '<div class="modal-head"><h3>'+(u?"تعديل مستخدم":"إضافة مستخدم")+'</h3><button class="icon-btn" onclick="closeModal()">'+icon("x",20)+'</button></div>'+
    '<div class="modal-body">'+
      '<div class="field"><label>الاسم *</label><input id="u-name" value="'+(u?esc(u.name):"")+'"></div>'+
      '<div class="form-grid">'+
        '<div class="field"><label>اسم المستخدم *</label><input id="u-user" dir="ltr" value="'+(u?esc(u.username):"")+'"></div>'+
        '<div class="field"><label>كلمة المرور *</label><input id="u-pass" dir="ltr" value="'+(u?esc(u.password):"")+'"></div>'+
      '</div>'+
      '<div class="field"><label>الصلاحية</label><select id="u-role">'+
        '<option value="cashier" '+(!u||u.role==="cashier"?"selected":"")+'>كاشير (بيع فقط)</option>'+
        '<option value="admin" '+(u&&u.role==="admin"?"selected":"")+'>مدير (صلاحية كاملة)</option>'+
      '</select></div>'+
    '</div>'+
    '<div class="modal-foot">'+
      '<button class="btn btn-primary" onclick="saveUser(\''+(u?u.id:"")+'\')">حفظ</button>'+
      '<button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>'+
    '</div>'
  );
}
function saveUser(id){
  var name = $("#u-name").value.trim();
  var username = $("#u-user").value.trim();
  var password = $("#u-pass").value;
  if(!name || !username || !password){ toast("أكمل كل الحقول","err"); return; }
  var dup = DB.users.find(function(x){ return x.username===username && x.id!==id; });
  if(dup){ toast("اسم المستخدم مستخدم بالفعل","err"); return; }
  var data = {name:name, username:username, password:password, role:$("#u-role").value};
  if(id){ Object.assign(DB.users.find(function(x){ return x.id===id; }), data); }
  else { DB.users.push(Object.assign({id:uid()}, data)); }
  saveDB(); logAction(id ? "تعديل مستخدم" : "إضافة مستخدم", username);
  closeModal(); renderViewInPlace(); toast("تم حفظ المستخدم");
}
function deleteUser(id){
  var u = DB.users.find(function(x){ return x.id===id; });
  if(!u) return;
  if(u.id === sessionId){ toast("لا يمكنك حذف حسابك الحالي","err"); return; }
  if(u.role==="admin" && DB.users.filter(function(x){ return x.role==="admin"; }).length <= 1){ toast("لا يمكن حذف آخر مدير","err"); return; }
  confirmBox("حذف المستخدم «"+u.name+"»؟", function(){
    DB.users = DB.users.filter(function(x){ return x.id!==id; });
    saveDB(); logAction("حذف مستخدم", u.name);
    renderViewInPlace(); toast("تم حذف المستخدم");
  }, true);
}

/* ============================================================
   الإعدادات
   ============================================================ */
function viewSettings(){
  if(!isAdmin()){ return '<div class="empty"><div class="big">🔒</div><p>هذه الصفحة للمدير فقط</p></div>'; }
  var s = DB.settings;
  return '<div class="card mb16"><h3>'+icon("store",17)+' بيانات المتجر</h3>'+
    '<div class="form-grid">'+
      '<div class="field"><label>اسم المتجر</label><input id="s-name" value="'+esc(s.storeName)+'"></div>'+
      '<div class="field"><label>العملة</label><input id="s-cur" value="'+esc(s.currency)+'"></div>'+
      '<div class="field"><label>نسبة الضريبة %</label><input id="s-tax" type="number" min="0" max="100" step="0.5" value="'+s.taxRate+'"></div>'+
      '<div class="field"><label>حد التنبيه للمخزون المنخفض</label><input id="s-low" type="number" min="0" value="'+s.lowStockThreshold+'"></div>'+
      '<div class="field"><label>بادئة رقم الفاتورة</label><input id="s-prefix" value="'+esc(s.invoicePrefix)+'"></div>'+
      '<div class="field"><label>رقم الفاتورة التالي</label><input id="s-counter" type="number" min="1" value="'+s.invoiceCounter+'"></div>'+
      '<div class="field"><label>هاتف المتجر (للإيصال)</label><input id="s-phone" dir="ltr" value="'+esc(s.phone||"")+'"></div>'+
      '<div class="field full"><label>نص أسفل الإيصال</label><input id="s-footer" value="'+esc(s.receiptFooter)+'"></div>'+
    '</div>'+
    '<button class="btn btn-primary mt8" onclick="saveSettings()">'+icon("check",16)+' حفظ الإعدادات</button>'+
  '</div>'+
  '<div class="card mb16"><h3>'+icon("down",17)+' النسخ الاحتياطي</h3>'+
    '<div class="row" style="flex-wrap:wrap;">'+
      '<button class="btn btn-ghost" onclick="exportData()">'+icon("down",16)+' تصدير البيانات (JSON)</button>'+
      '<button class="btn btn-ghost" onclick="$(\'#import-file\').click()">'+icon("up",16)+' استيراد بيانات</button>'+
      '<input type="file" id="import-file" accept="application/json" class="hidden" onchange="importData(event)">'+
      '<button class="btn btn-soft-red" onclick="clearAll()">'+icon("trash",16)+' مسح كل البيانات</button>'+
    '</div>'+
    '<p class="muted small mt8">💡 صدّر نسخة من بياناتك بشكل دوري لتفادي فقدانها عند مسح بيانات المتصفح.</p>'+
  '</div>'+
  '<div class="card"><h3>ℹ️ عن النظام</h3>'+
    '<p class="small muted">نظام كاشير لمحل ملابس — يعمل بالكامل في المتصفح ويحفظ البيانات محلياً على هذا الجهاز. للاستخدام على أكثر من جهاز، انسخ ملف النسخة الاحتياطية إلى الجهاز الآخر.</p>'+
  '</div>';
}
function saveSettings(){
  DB.settings.storeName = $("#s-name").value.trim() || "بوتيك الموضة";
  DB.settings.currency = $("#s-cur").value.trim() || "ج.م";
  DB.settings.taxRate = num($("#s-tax").value);
  DB.settings.lowStockThreshold = Math.max(0, parseInt($("#s-low").value,10)||0);
  DB.settings.invoicePrefix = $("#s-prefix").value.trim() || "INV";
  DB.settings.invoiceCounter = Math.max(1, parseInt($("#s-counter").value,10)||1);
  DB.settings.phone = $("#s-phone").value.trim();
  DB.settings.receiptFooter = $("#s-footer").value.trim();
  saveDB(); logAction("تحديث الإعدادات");
  render(); toast("تم حفظ الإعدادات");
}
function exportData(){
  var blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "backup-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("تم تصدير النسخة الاحتياطية");
}
function importData(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data.settings || !data.products){ toast("ملف غير صالح","err"); return; }
      confirmBox("سيتم استبدال البيانات الحالية ببيانات الملف. متابعة؟", function(){
        DB = data; saveDB(); render(); toast("تم استيراد البيانات بنجاح");
      }, true);
    }catch(err){ toast("تعذر قراءة الملف","err"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}
function clearAll(){
  confirmBox("سيتم حذف كل البيانات (المنتجات، الفواتير، العملاء، المستخدمين) والرجوع للإعدادات الافتراضية. هل أنت متأكد؟", function(){
    store.removeItem(DB_KEY);
    DB = seed(); saveDB(); render(); toast("تم مسح كل البيانات");
  }, true);
}

/* ============================================================
   الإقلاع
   ============================================================ */
loadDB();
loadSession();
render();
</script>
</body>
