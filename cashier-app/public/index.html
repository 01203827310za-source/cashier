async function confirmOrderExchange(){
  var o = DB.orders.find(function(x){ return x.id===orderExchangeDraft.orderId; });
  if(!o) return;
  var checkedLines = orderExchangeDraft.lines.filter(function(l){ return l.checked && l.qty>0; });
  if(!checkedLines.length){ toast("اختر صنفاً واحداً على الأقل للاستبدال","err"); return; }
  if(checkedLines.some(function(l){ return !l.replacementVariantId; })){
    toast("اختر المنتج البديل (بالمقاس/اللون) لكل صنف مرتجع","err"); return;
  }

  var totals = computeOrderExchangeTotals();
  var newTotal = Math.max(0, (o.total||0) + totals.difference);
  var collected = orderCollectedTotal(o);
  var refundAmount = Math.max(0, collected - newTotal);
  if(refundAmount > 0.004 && !orderExchangeDraft.refundPartner){
    toast("اختر الحساب (مؤمن/عبدو) اللي هيتحمّل الاسترداد","err"); return;
  }

  var payload = {
    reason: orderExchangeDraft.reason||"",
    refundPartner: refundAmount>0.004 ? orderExchangeDraft.refundPartner : null,
    items: checkedLines.map(function(l){
      var repProd = DB.products.find(function(p){ return p.id===l.replacementProductId; });
      return {
        orderItemId: l.orderItemId, qty: l.qty,
        replacementVariantId: l.replacementVariantId || null,
        replacementQty: l.replacementVariantId ? l.replacementQty : null,
        replacementPrice: repProd ? repProd.price : null
      };
    })
  };
  api("POST", "/api/order/" + o.id + "/exchange", payload).then(function(r){
    afterSync(r);
    closeModal(); renderViewInPlace(); toast("تم تنفيذ الاستبدال بنجاح");
  }).catch(function(e){ toast(e.message, "err"); });
}

/* ============================================================
   الديون — نظام حسابات أشخاص مستقل: حساب واحد لكل اسم شخص (DebtAccount)،
   تحته أي عدد من الفواتير (DB.debts)، وتحت كل فاتورة أو الحساب مباشرة أي عدد
   من الدفعات (DB.debtPayments). مفيش نوع دين ولا اعتماد على عميل/مورد.
   ============================================================ */
var DEBT_PAY_METHODS = ["cash","card","wallet","transfer"];
function debtStatusMeta(s){
  if(s==="paid") return {label:"مدفوع بالكامل", cls:"badge-green"};
  if(s==="partial") return {label:"مدفوع جزئياً", cls:"badge-amber"};
  return {label:"غير مدفوع", cls:"badge-red"};
}
// السيرفر هو اللي بيحسب المدفوع/المتبقي فعلياً (SUM على الفواتير/الدفعات) —
// الدالتين دول بيرجّعوا نفس القيم المخزّنة بعد ما السيرفر يحسبها، مش بيعيدوا
// حسابها تاني في الواجهة، عشان الواجهة متبقاش مصدر الحقيقة لأي رصيد مالي.
function debtAccountRemaining(a){ return a.remainingAmount!=null ? a.remainingAmount : Math.max(0, (a.totalAmount||0)-(a.paidAmount||0)); }
function debtInvoiceRemaining(d){ return d.remainingAmount!=null ? d.remainingAmount : Math.max(0, (d.totalAmount||0)-(d.paidAmount||0)); }
function debtPaymentCode(p){ return "PAY-" + (p.id||"").slice(-6).toUpperCase(); }
function debtPayMethodOptionsHTML(selected){
  return DEBT_PAY_METHODS.map(function(m){ return '<option value="'+m+'" '+(selected===m?"selected":"")+'>'+payMethodLabel(m)+'</option>'; }).join("");
}
function debtsSummary(){
  var totalAmount=0, totalPaid=0, totalRemaining=0;
  (DB.debtAccounts||[]).forEach(function(a){
    totalAmount += (a.totalAmount||0);
    totalPaid += (a.paidAmount||0);
    totalRemaining += debtAccountRemaining(a);
  });
  return {totalAmount:totalAmount, totalPaid:totalPaid, totalRemaining:totalRemaining};
}

  var partnerFilterOpts = '<option value="all">كل الحسابات</option>'+
    '<option value="moamen" '+(debtPayPartnerFilter==="moamen"?"selected":"")+'>مؤمن</option>'+
    '<option value="abdo" '+(debtPayPartnerFilter==="abdo"?"selected":"")+'>عبدو</option>';
  var methodFilterOpts = '<option value="all">كل الطرق</option>'+debtPayMethodOptionsHTML(debtPayMethodFilter==="all"?"":debtPayMethodFilter);

      '<select onchange="setDebtPayPartnerFilter(this.value)">'+partnerFilterOpts+'</select>'+
      '<select onchange="setDebtPayMethodFilter(this.value)">'+methodFilterOpts+'</select>'+
    '</div>'+

async function saveDebt(){
  var name = ($("#debt-name") ? $("#debt-name").value : debtDraft.name || "").trim();
  var total = num($("#debt-total") ? $("#debt-total").value : debtDraft.totalAmount);
  var paid = num($("#debt-paid") ? $("#debt-paid").value : debtDraft.paidAmount || 0);
  var date = $("#debt-date") ? $("#debt-date").value : debtDraft.date;
  var method = $("#debt-method") ? $("#debt-method").value : debtDraft.paymentMethod;
  var notes = ($("#debt-notes") ? $("#debt-notes").value : debtDraft.notes || "").trim();
  if(!name){ toast("اسم الشخص مطلوب","err"); return; }
  if(total <= 0){ toast("المبلغ الإجمالي يجب أن يكون أكبر من صفر","err"); return; }
  if(paid < 0){ toast("المبلغ المدفوع لا يمكن أن يكون أقل من صفر","err"); return; }
  if(paid > total){ toast("المبلغ المدفوع لا يمكن أن يتجاوز المبلغ الإجمالي","err"); return; }
  var partner = "";
  if(paid > 0){
    partner = ($("#debt-partner") ? $("#debt-partner").value : debtDraft.partner) || "";
    if(!partner){ toast("اختر الحساب (مؤمن/عبدو)","err"); return; }
  }
  var dateMs = new Date((date||todayKey())+"T12:00:00").getTime();
  try{
    var r = await api("POST", "/api/debt-accounts", {
      name: name, totalAmount: total, paidAmount: paid, date: dateMs, paymentMethod: method, partner: partner, notes: notes
    });
    afterSync(r);
    closeModal(); renderViewInPlace(); toast("تم تسجيل الدين");
  }catch(e){ toast(e.message, "err"); }
}
function debtAccountLedgerRows(account){
  var invoices = (DB.debts||[]).filter(function(x){ return x.accountId===account.id; });
  var payments = (DB.debtPayments||[]).filter(function(x){ return x.accountId===account.id; });
  var events = [];
  invoices.forEach(function(d){ events.push({ kind:"invoice", date:d.date||0, ref:d }); });
  payments.forEach(function(p){ events.push({ kind:"payment", date:p.date||0, ref:p }); });
  events.sort(function(a,b){ return (a.date||0)-(b.date||0); });
  var running = 0;
  return events.map(function(e){
    running += e.kind==="invoice" ? (e.ref.totalAmount||0) : -(e.ref.amount||0);
    return { kind:e.kind, date:e.date, ref:e.ref, runningRemaining: Math.max(0, running) };
  });
}

function saveDebtInvoice(){
  var d = debtInvoiceDraft;
  var isEdit = !!d.id;
  var number = ($("#dinv-number") ? $("#dinv-number").value : d.number || "").trim();
  var total = num($("#dinv-total") ? $("#dinv-total").value : d.totalAmount);
  var date = $("#dinv-date") ? $("#dinv-date").value : d.date;
  var method = $("#dinv-method") ? $("#dinv-method").value : d.paymentMethod;
  var notes = ($("#dinv-notes") ? $("#dinv-notes").value : d.notes || "").trim();
  if(total <= 0){ toast("قيمة الفاتورة يجب أن تكون أكبر من صفر","err"); return; }
  var dateMs = new Date((date||todayKey())+"T12:00:00").getTime();
  if(isEdit){
    api("POST", "/api/debt-accounts/" + d.accountId + "/invoices/" + d.id + "/edit", {
      number: number, totalAmount: total, date: dateMs, paymentMethod: method, notes: notes
    }).then(function(r){
      afterSync(r); openDebtAccountDetail(d.accountId); toast("تم تعديل الفاتورة");
    }).catch(function(e){ toast(e.message, "err"); });
    return;
  }
  var paid = num($("#dinv-paid") ? $("#dinv-paid").value : d.paidAmount || 0);
  if(paid < 0){ toast("المبلغ المدفوع لا يمكن أن يكون أقل من صفر","err"); return; }
  if(paid > total){ toast("المبلغ المدفوع لا يمكن أن يتجاوز قيمة الفاتورة","err"); return; }
  var partner = "";
  if(paid > 0){
    partner = ($("#dinv-partner") ? $("#dinv-partner").value : d.partner) || "";
    if(!partner){ toast("اختر الحساب (مؤمن/عبدو)","err"); return; }
  }
  api("POST", "/api/debt-accounts/" + d.accountId + "/invoices", {
    number: number, totalAmount: total, paidAmount: paid, date: dateMs, paymentMethod: method, partner: partner, notes: notes
  }).then(function(r){
    afterSync(r); openDebtAccountDetail(d.accountId); toast("تم إضافة الفاتورة");
  }).catch(function(e){ toast(e.message, "err"); });
}

/* ============================================================
   الخزنة — إقفال يومي لكل من يستلم فلوس
   ============================================================ */
function setCashDay(v){ cashDay = v; renderViewInPlace(); }
function cashDiff(i){
  var el = $("#cash-act-"+i);
  var diffEl = $("#cash-diff-"+i);
  if(!el || !diffEl) return;
  var actual = num(el.value);
  var exp = cashDayData[i] ? cashDayData[i].expected : 0;
  if(el.value === ""){ diffEl.textContent = "—"; diffEl.style.color = "inherit"; return; }
  var d = actual - exp;
  if(Math.abs(d) < 0.005){ diffEl.textContent = "متطابق ✓"; diffEl.style.color = "var(--green)"; }
  else { diffEl.textContent = (d>0?"+":"")+fmt(d)+" "+DB.settings.currency; diffEl.style.color = d>0 ? "var(--green)" : "var(--red)"; }
}
function saveClosing(i, userId){
  var el = $("#cash-act-"+i);
  if(!el) return;
  var actual = num(el.value);
  if(el.value === ""){ toast("اكتب المبلغ الفعلي أولاً","err"); return; }
  var data = cashDayData[i];
  var item = { id: uid(), userId: userId, day: cashDay, expected: data.expected, actual: actual, userName: data.u.name };
  api("POST", "/api/closings", { item: item }).then(function(r){
    afterSync(r);
    renderViewInPlace(); toast("تم حفظ الإقفال");
  }).catch(function(e){ toast(e.message, "err"); });
}
function viewCash(){
  if(!can("cash","view")){ return '<div class="empty"><div class="big">🔒</div><p>ليس لديك صلاحية للوصول لهذه الصفحة</p></div>'; }
  var d = cashDay;
  var from = new Date(d+"T00:00:00").getTime();
  cashDayData = DB.users.map(function(u){
    var mv = dayMovements(u.id, d);
    var balance = userCashBalance(u.id);
    var closings = (DB.cashClosings||[]).filter(function(c){ return c.userId===u.id && c.day===d; }).sort(function(a,b){ return b.date-a.date; });
    return {u:u, mv:mv, expected:mv.net, balance:balance, closing:closings[0]||null};
  });
  var totExp = cashDayData.reduce(function(a,c){ return a+c.expected; },0);
  var totBal = cashDayData.reduce(function(a,c){ return a+c.balance; },0);
  var totTransfersIn = cashDayData.reduce(function(a,c){ return a+c.mv.transfersIn; },0);

  var cards = cashDayData.map(function(c, i){
    var mv = c.mv;
    var diff = c.closing ? (c.closing.actual - c.expected) : null;
    var diffTxt = c.closing ? (Math.abs(diff)<0.005 ? "متطابق ✓" : (diff>0?"+":"")+fmt(diff)+" "+esc(DB.settings.currency)) : "—";
    function mvRow(lbl, val, color){ return val!==0 ? '<div class="tot-row"><span>'+lbl+'</span><span class="bold" style="color:'+(color||'inherit')+';">'+(val>0?"+":"")+fmt(val)+'</span></div>' : ''; }
    return '<div class="card mb16">'+
      '<div class="row" style="justify-content:space-between;flex-wrap:wrap;">'+
        '<h3 style="margin:0;">'+icon("user",16)+' '+esc(c.u.name)+' <span class="badge '+(c.u.role==="admin"?'badge-blue':'badge-gray')+'">'+(c.u.role==="admin"?'مدير':'كاشير')+'</span></h3>'+
        '<span class="muted small">'+dateStr(from)+'</span>'+
      '</div>'+
      '<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:12px 0 0;">'+
        statCard("wallet",(c.balance>=0?"var(--primary)":"var(--red)"), (c.balance<0?"- ":"")+fmt(Math.abs(c.balance)), "الرصيد الجاري معاه")+
        statCard("cash","var(--green)", fmt(c.expected), "صافي حركات اليوم")+
      '</div>'+
      '<div class="card mt8" style="background:#f8fafc;padding:12px;">'+
        '<div class="small muted mb8">حركات اليوم:</div>'+
        mvRow("نقدي بيع المحل", mv.cashSales, "var(--green)")+
        mvRow("COD محصّل (أوردرات)", mv.cod, "var(--green)")+
        mvRow("سداد ديون من عملاء", mv.custPay, "var(--green)")+
        mvRow("إيرادات أخرى", mv.otherIncome, "var(--green)")+
        mvRow("تحويلات واردة إليه", mv.transfersIn, "var(--green)")+
        mvRow("مصاريف نقدي دفعها", -mv.expenses, "var(--red)")+
        mvRow("مدفوعات للموردين", -mv.supplierPay, "var(--red)")+
        mvRow("مبالغ استرجاع/استبدال نقدي", -mv.refunds, "var(--red)")+
        mvRow("تحويلات صادرة منه", -mv.transfersOut, "var(--red)")+
        '<div class="tot-row grand" style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px;"><span>الصافي</span><span>'+fmt(mv.net)+' '+esc(DB.settings.currency)+'</span></div>'+
      '</div>'+
      '<div class="row mt16" style="flex-wrap:wrap;gap:14px;align-items:flex-end;">'+
        '<div class="field" style="margin:0;min-width:150px;"><label>المبلغ الفعلي معاه الآن</label><input id="cash-act-'+i+'" type="number" min="0" step="0.5" value="'+(c.closing?c.closing.actual:"")+'" placeholder="0.00" oninput="cashDiff('+i+')"></div>'+
        '<div style="min-width:150px;"><div class="small muted">الفرق عن المتوقع</div><div class="bold" style="font-size:18px;" id="cash-diff-'+i+'">'+diffTxt+'</div></div>'+
        (can("cash","edit") ? '<button class="btn btn-primary" onclick="saveClosing('+i+',\''+c.u.id+'\')">'+icon("check",16)+' حفظ الإقفال</button>' : '')+
      '</div>'+
      (c.closing ? '<p class="small muted mt8">آخر إقفال: '+timeStr(c.closing.date)+'</p>' : '<p class="small muted mt8">لم يتم الإقفال لهذا اليوم بعد</p>')+
    '</div>';
  }).join("");

  var transfers = (DB.transfers||[]).slice().sort(function(a,b){ return b.date-a.date; }).slice(0,10);
  var transferRows = transfers.map(function(t){
    return '<tr><td>'+dateStr(t.date)+' '+timeStr(t.date)+'</td>'+
      '<td class="bold">'+(userById(t.fromId)?esc(userById(t.fromId).name):"—")+'</td>'+
      '<td class="bold">'+(userById(t.toId)?esc(userById(t.toId).name):"—")+'</td>'+
      '<td class="bold" style="color:var(--primary);">'+fmt(t.amount)+'</td>'+
      '<td class="muted">'+esc(t.note||"—")+'</td></tr>';
  }).join("");

  return '<div class="filterbar">'+
    '<input type="date" value="'+esc(cashDay)+'" onchange="setCashDay(this.value)">'+
    '<span class="muted small">اختر اليوم لعرض حركات كل شخص وإقفال الخزنة</span>'+
    (can("cash","create") ? '<button class="btn btn-green" onclick="openTransfer()">'+icon("banknote",16)+' تحويل فلوس بين شخصين</button>' : '')+
  '</div>'+
  '<div class="stats">'+
    statCard("wallet","var(--primary)", fmt(totBal), "إجمالي الأرصدة مع الأشخاص")+
    statCard("cash","var(--green)", fmt(totExp), "صافي حركات اليوم (الكل)")+
    statCard("banknote","#0ea5e9", fmt(totTransfersIn), "تحويلات واردة اليوم")+
  '</div>'+
  cards+

function viewFinance(){
  if(!can("finance","view")){ return '<div class="empty"><div class="big">🔒</div><p>ليس لديك صلاحية للوصول لهذه الصفحة</p></div>'; }
  var f = rangeFilter();
  var sales = activeSalesList(DB.sales).filter(function(s){ return s.date>=f.from && s.date<=f.to; });
  var orders = DB.orders.filter(function(o){ return o.date>=f.from && o.date<=f.to && ["returned","cancelled"].indexOf(o.status)===-1; });
  var expenses = DB.expenses.filter(function(e){ return e.date>=f.from && e.date<=f.to; });
  var incomes = DB.otherIncome.filter(function(i){ return i.date>=f.from && i.date<=f.to; });

  var posRev = sales.reduce(function(a,s){ return a+s.total; },0);
  var ordRev = orders.reduce(function(a,o){ return a+o.total; },0);
  var otherRev = incomes.reduce(function(a,i){ return a+i.amount; },0);
  var totalRev = posRev + ordRev + otherRev;
  var expTotal = expenseTotal(expenses);
  var cogsSales = sales.reduce(function(a,s){ return a+s.items.reduce(function(x,it){ return x+it.cost*it.qty; },0); },0);
  var cogsOrders = orders.reduce(function(a,o){ return a+o.items.reduce(function(x,it){ return x+(it.cost||0)*it.qty; },0); },0);
  var cogs = cogsSales + cogsOrders;
  var net = totalRev - expTotal - cogs;

  var rangeSel = '<select onchange="setRange(this.value)">'+
    '<option value="today" '+(reportRange==="today"?"selected":"")+'>اليوم</option>'+
    '<option value="7d" '+(reportRange==="7d"?"selected":"")+'>آخر 7 أيام</option>'+
    '<option value="30d" '+(reportRange==="30d"?"selected":"")+'>آخر 30 يوم</option>'+
    '<option value="all" '+(reportRange==="all"?"selected":"")+'>كل الفترة</option>'+
    '<option value="custom" '+(reportRange==="custom"?"selected":"")+'>مخصص</option>'+
  '</select>' +
  (reportRange==="custom" ? '<input type="date" value="'+reportFrom+'" onchange="setFrom(this.value)"><input type="date" value="'+reportTo+'" onchange="setTo(this.value)">' : "");

  function line(lbl, val, cls, sign){
    return '<div class="tot-row"><span>'+lbl+'</span><span class="bold '+(cls||"")+'">'+(sign==="+"?"+ ":"")+fmt(val)+'</span></div>';
  }
  var incomeRows = incomes.map(function(i){
    return '<tr><td>'+dateStr(i.date)+'</td><td class="muted">'+esc(i.note||"—")+'</td><td>'+(i.partner?partnerLabel(i.partner):'<span class="muted small">المحل / مشترك</span>')+'</td><td class="bold" style="color:var(--green);">+ '+fmt(i.amount)+'</td>'+
      '<td>'+(can("finance","delete") ? '<button class="icon-btn danger" onclick="deleteIncome(\''+i.id+'\')">'+icon("trash",16)+'</button>' : '')+'</td></tr>';
  }).join("");

  return '<div class="filterbar">'+rangeSel+'</div>'+
    '<div class="stats">'+
      statCard("chart","var(--green)", fmt(totalRev), "إجمالي الإيرادات")+
      statCard("coins","var(--red)", fmt(expTotal), "إجمالي المصاريف")+
      statCard("box","var(--amber)", fmt(cogs), "تكلفة البضاعة المباعة")+
      statCard("banknote",(net>=0?"var(--primary)":"var(--red)"), (net<0?"- ":"")+fmt(Math.abs(net)), "صافي الربح/الخسارة")+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" class="mb16">'+
      '<div class="card"><h3>'+icon("chart",17)+' الإيرادات</h3>'+
        line("مبيعات نقطة البيع", posRev)+
        line("مبيعات الأوردرات", ordRev)+
        line("إيرادات أخرى", otherRev)+
        '<div class="tot-row grand" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;"><span>الإجمالي</span><span>'+fmt(totalRev)+' '+esc(DB.settings.currency)+'</span></div>'+
      '</div>'+
      '<div class="card"><h3>'+icon("coins",17)+' المصروفات والتكلفة</h3>'+
        line("مصاريف مسجلة", expTotal)+
        line("تكلفة البضاعة المباعة", cogs)+
        '<div class="tot-row grand" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;"><span>الإجمالي</span><span>'+fmt(expTotal+cogs)+' '+esc(DB.settings.currency)+'</span></div>'+
        '<div class="tot-row" style="margin-top:10px;font-size:15px;background:'+(net>=0?'var(--green-soft)':'var(--red-soft)')+';padding:8px 10px;border-radius:10px;color:'+(net>=0?'var(--green)':'var(--red)')+';">'+
          '<span>صافي الربح</span><span>'+(net<0?"- ":"")+fmt(Math.abs(net))+' '+esc(DB.settings.currency)+'</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="card"><h3>'+icon("banknote",17)+' إيرادات أخرى '+(can("finance","create") ? '<button class="btn btn-soft btn-sm" style="margin-inline-start:12px;" onclick="openIncomeForm()">'+icon("plus",14)+' إضافة</button>' : '')+'</h3>'+
      '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>الحساب</th><th>المبلغ</th><th></th></tr></thead>'+
      '<tbody>'+(incomeRows || '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px;">لا توجد إيرادات أخرى</td></tr>')+'</tbody></table></div>'+

function saveIncome(){
  var amount = num($("#inc-amount").value);
  var partnerSel = $("#inc-partner").value;
  if(amount <= 0){ toast("أدخل مبلغاً صحيحاً","err"); return; }
  if(!partnerSel){ toast("اختر الحساب (مؤمن/عبدو/ميدو) أو المحل/مشترك","err"); return; }
  var partner = partnerSel === "shared" ? "" : partnerSel;
  var item = {id:uid(), date:new Date(($("#inc-date").value||todayKey())+"T12:00:00").getTime(), amount:amount, note:$("#inc-note").value.trim(), receivedBy:($("#inc-by")?$("#inc-by").value:null)||currentUser().id, userId:currentUser().id, partner:partner};
  api("POST", "/api/income", { item: item }).then(function(r){
    afterSync(r);
    closeModal(); renderViewInPlace(); toast("تم تسجيل الإيراد");
  }).catch(function(e){ toast(e.message, "err"); });
}
function deleteIncome(id){
  var i = DB.otherIncome.find(function(x){ return x.id===id; });
  if(!i) return;
  confirmBox("حذف الإيراد («"+(i.note||"—")+"» — "+fmt(i.amount)+")؟", function(){
    api("POST", "/api/income/" + id + "/delete").then(function(r){ afterSync(r); renderViewInPlace(); toast("تم الحذف"); }).catch(function(e){ toast(e.message, "err"); });
  }, true);
}

/* ============================================================
   الأصول المتداولة والديون (المركز المالي)
   ============================================================ */
function inventoryCostValue(){
  var value = 0, pieces = 0;
  DB.products.forEach(function(p){
    (p.variants||[]).forEach(function(v){
      var q = v.stock||0;
      pieces += q;
      value += q * (p.cost||0);
    });
  });
  return {value:value, pieces:pieces};
}
function codReceivableValue(){
  return DB.orders.reduce(function(a,o){
    if(o.paymentStatus==="cod" && !o.collected && ["returned","cancelled"].indexOf(o.status)===-1) return a + o.total;
    return a;
  },0);
}
function electronicAssetsValue(){
  var v = 0;
  activeSalesList(DB.sales).forEach(function(s){ if(s.paymentMethod==="card"||s.paymentMethod==="wallet") v += s.total; });
  DB.orders.forEach(function(o){ if(o.paymentStatus==="paid" && ["returned","cancelled"].indexOf(o.status)===-1) v += o.total; });
  return v;
}
function customerDebtTotal(){
  var t = 0;
  DB.customers.forEach(function(c){ var b = customerBalance(c.id); if(b > 0.005) t += b; });
  return t;
}
function supplierDebtTotal(){
  var t = 0;
  DB.suppliers.forEach(function(s){ var b = supplierBalance(s.id); if(b > 0.005) t += b; });
  return t;
}
function cashOnHandTotal(){
  return DB.users.reduce(function(a,u){ return a + userCashBalance(u.id); },0);
}
function viewAssets(){
  if(!can("assets","view")){ return '<div class="empty"><div class="big">🔒</div><p>ليس لديك صلاحية للوصول لهذه الصفحة</p></div>'; }
  var inv = inventoryCostValue();
  var cashTotal = cashOnHandTotal();
  var cod = codReceivableValue();
  var custDebt = customerDebtTotal();
  var electronic = electronicAssetsValue();
  var supDebt = supplierDebtTotal();

  var totalAssets = inv.value + cashTotal + cod + custDebt + electronic;
  var totalLiab = supDebt;
  var net = totalAssets - totalLiab;

  function line(lbl, val, note, cls){
    return '<div class="tot-row"><span>'+lbl+(note?' <span class="small muted">'+note+'</span>':'')+'</span><span class="bold '+(cls||"")+'">'+fmt(val)+'</span></div>';
  }

  var perCash = DB.users.map(function(u){
    var b = userCashBalance(u.id);
    return '<div class="tot-row"><span class="muted small">· '+esc(u.name)+'</span><span style="color:'+(b>=0?'var(--green)':'var(--red)')+';">'+fmt(b)+'</span></div>';
  }).join("");

  var perSup = DB.suppliers.map(function(s){
    var b = supplierBalance(s.id);
    if(b <= 0.005) return "";
    return '<div class="tot-row"><span class="muted small">· '+esc(s.name)+'</span><span style="color:var(--red);">'+fmt(b)+'</span></div>';
  }).join("") || '<p class="muted small">لا توجد ديون للموردين</p>';

  var debtCusts = DB.customers.filter(function(c){ return customerBalance(c.id) > 0.005; });
  var perCust = debtCusts.map(function(c){
    return '<div class="tot-row"><span class="muted small">· '+esc(c.name)+'</span><span style="color:var(--green);">'+fmt(customerBalance(c.id))+'</span></div>';
  }).join("") || '<p class="muted small">لا توجد مستحقات على العملاء</p>';

  return '<div class="stats">'+
    statCard("pie","var(--primary)", fmt(totalAssets), "إجمالي الأصول")+
    statCard("scale","var(--red)", fmt(totalLiab), "إجمالي الديون (علينا)")+
    statCard("trendingup",(net>=0?"var(--green)":"var(--red)"), (net<0?"- ":"")+fmt(Math.abs(net)), "صافي الأصول (حقوق المالك)")+
  '</div>'+
  '<div style="display:grid;grid-template-columns:1.2fr 1fr;gap:16px;">'+
    '<div class="card"><h3>'+icon("pie",17)+' الأصول المتداولة (اللي عندك)</h3>'+
      line("قيمة المخزون (بتكلفة الشراء)", inv.value, inv.pieces+" قطعة", "var(--green)")+
      line("النقدية مع الأشخاص", cashTotal, "", "var(--green)")+
      perCash+
      line("أوردرات COD قيد التحصيل", cod, "", "var(--green)")+
      line("مستحقات العملاء (ديون لنا)", custDebt, "", "var(--green)")+
      perCust+
      line("أموال إلكترونية (كارت/محفظة/مدفوع مسبق)", electronic, "", "var(--green)")+
      '<div class="tot-row grand" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;"><span>إجمالي الأصول</span><span>'+fmt(totalAssets)+' '+esc(DB.settings.currency)+'</span></div>'+
    '</div>'+
    '<div class="card"><h3>'+icon("scale",17)+' الديون (اللي عليك)</h3>'+
      line("ديون الموردين", supDebt, "", "var(--red)")+
      perSup+
      '<div class="tot-row grand" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;"><span>إجمالي الديون</span><span>'+fmt(totalLiab)+' '+esc(DB.settings.currency)+'</span></div>'+
      '<div class="tot-row" style="margin-top:14px;font-size:16px;background:'+(net>=0?'var(--green-soft)':'var(--red-soft)')+';padding:12px;border-radius:10px;color:'+(net>=0?'var(--green)':'var(--red)')+';">'+
        '<span>صافي الأصول</span><span>'+(net<0?"- ":"")+fmt(Math.abs(net))+' '+esc(DB.settings.currency)+'</span></div>'+
      '<p class="small muted mt8">💡 صافي الأصول = كل اللي تملكه (مخزون + نقدية + مستحقات + أموال إلكترونية) − الديون اللي عليك. ده يمثل صافي ثروة النشاط في اللحظة دي.</p>'+
    '</div>'+
  '</div>';
}

/* ============================================================
   سجل الحركات
   ============================================================ */
function auditBadge(action){
  if(action.indexOf("حذف") !== -1 || action.indexOf("إرجاع") !== -1) return "badge-red";
  if(action.indexOf("بيع") !== -1 || action.indexOf("شراء") !== -1) return "badge-green";
  if(action.indexOf("إضافة") !== -1 || action.indexOf("تسجيل دخول") !== -1) return "badge-blue";
  return "badge-gray";
}
function setAuditQ(v){ auditQ = v; renderViewInPlace(); }
function setAuditFrom(v){ auditFrom = v; renderViewInPlace(); }
function setAuditTo(v){ auditTo = v; renderViewInPlace(); }
function viewAudit(){
  if(!can("audit","view")){ return '<div class="empty"><div class="big">🔒</div><p>ليس لديك صلاحية للوصول لهذه الصفحة</p></div>'; }
  var from = auditFrom ? new Date(auditFrom+"T00:00:00").getTime() : 0;
  var to = auditTo ? new Date(auditTo+"T23:59:59").getTime() : Date.now()+86400000;
  var q = auditQ.toLowerCase();
  var list = DB.audit.slice().sort(function(a,b){ return b.date-a.date; }).filter(function(a){
    return a.date >= from && a.date <= to && (!q || ((a.action||"")+" "+(a.detail||"")+" "+(a.userName||"")).toLowerCase().indexOf(q) !== -1);
  }).slice(0, 300);
  var rows = list.map(function(a){
    return '<tr><td>'+dateStr(a.date)+' '+timeStr(a.date)+'</td><td>'+esc(a.userName||"—")+'</td>'+
      '<td><span class="badge '+auditBadge(a.action)+'">'+esc(a.action)+'</span></td>'+
      '<td class="muted">'+esc(a.detail)+'</td></tr>';
  }).join("");
  return '<div class="filterbar">'+
    '<input placeholder="ابحث في السجل..." style="flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;" value="'+esc(auditQ)+'" oninput="setAuditQ(this.value)">'+
    '<input type="date" value="'+auditFrom+'" onchange="setAuditFrom(this.value)">'+
    '<input type="date" value="'+auditTo+'" onchange="setAuditTo(this.value)">'+
    ((auditFrom||auditTo) ? '<button class="btn btn-ghost" onclick="auditFrom=\'\';auditTo=\'\';renderViewInPlace()">مسح الفلترة</button>' : '')+
  '</div>'+
  '<div class="card"><h3>'+icon("history",17)+' سجل الحركات ('+list.length+')</h3>'+
    '<div class="table-wrap"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th></tr></thead>'+
    '<tbody>'+(rows || '<tr><td colspan="4" class="muted" style="text-align:center;padding:30px;">لا توجد حركات مسجلة</td></tr>')+'</tbody></table></div>'+
    '<p class="muted small mt8">💡 يُحتفظ بآخر 3000 حركة كحد أقصى.</p></div>';
}

/* ============================================================
   حسابات الشركاء (مؤمن/عبدو)
   ============================================================ */
var LEDGER_TYPES = ["SALE","ORDER_DEPOSIT","ORDER_COLLECTION","PURCHASE_PAYMENT","EXPENSE","OTHER_INCOME","RETURN","EXCHANGE_ADJUSTMENT",
  "DEBT_PAYMENT","OPENING_BALANCE","MANUAL_ADD","OTHER_DUE","WITHDRAWAL","DEDUCTION","PARTNER_TRANSFER"];
var LEDGER_TYPE_LABELS = {
  SALE:"بيع POS", ORDER_DEPOSIT:"عربون طلب", ORDER_COLLECTION:"تحصيل طلب", PURCHASE_PAYMENT:"دفعة مورد",
  EXPENSE:"مصروف", OTHER_INCOME:"إيراد آخر", RETURN:"استرجاع", EXCHANGE_ADJUSTMENT:"فرق استبدال", DEBT_PAYMENT:"تحصيل دين",
  OPENING_BALANCE:"رصيد افتتاحي", MANUAL_ADD:"مبلغ مُضاف", OTHER_DUE:"مستحقات أخرى", WITHDRAWAL:"مسحوبات",
  DEDUCTION:"خصم/تسوية", PARTNER_TRANSFER:"تحويل بين الشركاء"
};
function ledgerTypeLabel(t){ return LEDGER_TYPE_LABELS[t] || t; }
function ledgerTypeBadge(t){
  var map = { SALE:"badge-green", ORDER_DEPOSIT:"badge-blue", ORDER_COLLECTION:"badge-blue", PURCHASE_PAYMENT:"badge-amber",
    EXPENSE:"badge-red", OTHER_INCOME:"badge-green", RETURN:"badge-red", EXCHANGE_ADJUSTMENT:"badge-purple", DEBT_PAYMENT:"badge-green",
    OPENING_BALANCE:"badge-blue", MANUAL_ADD:"badge-green", OTHER_DUE:"badge-blue", WITHDRAWAL:"badge-red",
    DEDUCTION:"badge-red", PARTNER_TRANSFER:"badge-purple" };
  return map[t] || "badge-gray";
}
var LEDGER_SOURCE_LABELS = { sale:"بيع POS", return:"استرجاع/استبدال", orderCollection:"طلب شحن", purchasePayment:"مشتريات",
  expense:"مصروف", otherIncome:"إيراد آخر", paymentOut:"دفعة مورد", debtPayment:"دفعة دين", orderExchange:"استبدال أوردر",
  partnerManual:"قيد يدوي", partnerOpening:"رصيد افتتاحي", partnerTransfer:"تحويل بين الشركاء" };
function ledgerSourceLabel(rt){ return LEDGER_SOURCE_LABELS[rt] || (rt||"—"); }
// نص "من → إلى" الواضح المطلوب لعرض عملية تحويل بين الشركاء (كل قيد فيه طرفين
// محفوظين في data وقت الإنشاء — راجع /api/partners/transfer في السيرفر).
function partnerTransferLabel(t){
  var d = t.data || {};
  if(!d.fromPartner || !d.toPartner) return t.notes || ledgerTypeLabel(t.type);
  return "تحويل بين الشركاء: " + partnerLabel(d.fromPartner) + " → " + partnerLabel(d.toPartner) + " | " + fmt(t.amount) + " " + DB.settings.currency;
}
// معرّف التحويل المنطقي الواحد من أي طرف من طرفيه (القيد الصادر referenceId
// هو نفسه، والوارد referenceId+"-in") — عشان التعديل/الحذف يشتغلوا على
// العمليتين مع بعض دايمًا مهما ضغط المستخدم على أي طرف من الاتنين.
function partnerTransferBaseId(referenceId){
  return (referenceId||"").replace(/-in$/, "");
}
function partnersLedgerWithBalance(){
  var running = {};
  PARTNERS.forEach(function(p){ running[p.id] = 0; });
  return (DB.partnerTransactions||[]).slice().sort(function(a,b){ return a.date-b.date; }).map(function(t){
    running[t.partner] = (running[t.partner]||0) + (t.direction==="in"?(t.amount||0):-(t.amount||0));
    return Object.assign({}, t, { balanceAfter: running[t.partner] });
  });
}
function setPartnersFilter(v){ partnersFilter = v; renderViewInPlace(); }
function setPartnersTypeFilter(v){ partnersTypeFilter = v; renderViewInPlace(); }
function setPartnersFrom(v){ partnersFrom = v; renderViewInPlace(); }
function setPartnersTo(v){ partnersTo = v; renderViewInPlace(); }
function viewPartners(){
  if(!can("partners","view")){ return '<div class="empty"><div class="big">🔒</div><p>ليس لديك صلاحية للوصول لهذه الصفحة</p></div>'; }
  var from = partnersFrom ? new Date(partnersFrom+"T00:00:00").getTime() : 0;
  var to = partnersTo ? new Date(partnersTo+"T23:59:59").getTime() : Date.now()+86400000;
  var all = partnersLedgerWithBalance();
  var list = all.filter(function(t){
    return t.date>=from && t.date<=to &&
      (partnersFilter==="all" || t.partner===partnersFilter) &&
      (partnersTypeFilter==="all" || t.type===partnersTypeFilter);
  }).sort(function(a,b){ return b.date-a.date; });

  var incomeTotal = list.filter(function(t){ return t.direction==="in"; }).reduce(function(a,t){ return a+(t.amount||0); },0);
  var expenseTotalF = list.filter(function(t){ return t.direction==="out"; }).reduce(function(a,t){ return a+(t.amount||0); },0);

  var typeOpts = '<option value="all">كل الأنواع</option>' + LEDGER_TYPES.map(function(t){ return '<option value="'+t+'" '+(partnersTypeFilter===t?"selected":"")+'>'+ledgerTypeLabel(t)+'</option>'; }).join("");

        '<div class="field"><label>من (الشريك المُرسِل) *</label><select id="pt-from">'+opts(from)+'</select></div>'+
        '<div class="field"><label>إلى (الشريك المُستلِم) *</label><select id="pt-to">'+opts(to)+'</select></div>'+

        '<div class="field"><label>التاريخ</label><input id="pt-date" type="date" value="'+dateVal+'"></div>'+
        '<div class="field full"><label>وصف/ملاحظات</label><input id="pt-notes" value="'+esc(notes)+'" placeholder="اختياري"></div>'+
      '</div>'+
      '<p class="muted small mt8">هيتم خصم المبلغ من رصيد المُرسِل وإضافته لرصيد المُستلِم — إجمالي أرصدة الشركاء مايتغيرش، ومش بيُحتسب كإيراد أو مصروف في التقارير المالية.</p>'+
    '</div>'+
    '<div class="modal-foot">'+
      '<button class="btn btn-primary" onclick="savePartnerTransfer('+(editing?('\''+editBaseId+'\''):'null')+')">حفظ</button>'+
      '<button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>'+
    '</div>',
    true
  );

function savePartnerTransfer(id){
  var from = $("#pt-from").value;
  var to = $("#pt-to").value;
  var amount = num($("#pt-amount").value);
  if(!from || !to){ toast("اختر الشريك المُرسِل والمُستلِم","err"); return; }

    date: new Date(($("#pt-date").value||todayKey())+"T12:00:00").getTime(),

    afterSync(r);
    closeModal();

// الصلاحيات الفعلية لمستخدم: لو معاه صفوف UserPermission صريحة بترجع هي زي
// ما هي، ولو لسه معندوش (لسه مايتحفظش له نموذج الصلاحيات الجديد) بترجع
// المكافئ المفكوك لقواعد legacyCan القديمة، عشان الشاشة تعرض الواقع الفعلي
// مش فورمة فاضية. المدير بيرجّع null (صلاحية كاملة، مش قايمة محدودة).
function userEffectivePermissions(u){
  if(!u || u.role === "admin") return null;
  if(u.permissions && u.permissions.length) return u.permissions;
  var list = [];
  PERMISSION_MODULES.forEach(function(m){
    m.actions.forEach(function(a){
      if(legacyCan(u, m.id, a.id)) list.push({module:m.id, action:a.id});
    });
  });
  return list;
}
function viewCashiers(){
  if(!can("cashiers","view")){ return '<div class="empty"><div class="big">🔒</div><p>ليس لديك صلاحية للوصول لهذه الصفحة</p></div>'; }
  var rows = DB.users.map(function(u){
    var eff = userEffectivePermissions(u);
    return '<tr>'+
      '<td><div class="row"><div class="avatar" style="width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;">'+esc(u.name.charAt(0))+(u.name.charAt(1)||"")+'</div><div class="bold">'+esc(u.name)+'</div></div></td>'+
      '<td dir="ltr" style="text-align:right;">'+esc(u.username)+'</td>'+
      '<td><span class="badge '+(u.role==="admin"?"badge-blue":"badge-gray")+'">'+(u.role==="admin"?"مدير":"كاشير")+'</span></td>'+
      '<td>'+(eff===null ? '<span class="muted small">كاملة</span>' : '<button class="btn btn-ghost btn-sm" onclick="viewUserPermissions(\''+u.id+'\')">'+icon("shield",14)+' '+eff.length+' صلاحية</button>')+'</td>'+
      '<td><div class="row" style="gap:2px;">'+
        (can("cashiers","edit") ? '<button class="icon-btn primary" onclick="openUserForm(\''+u.id+'\')">'+icon("edit",16)+'</button>' : '')+
        (can("cashiers","delete") ? '<button class="icon-btn danger" onclick="deleteUser(\''+u.id+'\')">'+icon("trash",16)+'</button>' : '')+
      '</div></td>'+
    '</tr>';
  }).join("");
  return '<div class="filterbar">'+(can("cashiers","create") ? '<button class="btn btn-primary" onclick="openUserForm()">'+icon("plus",16)+' إضافة كاشير</button>' : '')+'</div>'+
    '<div class="card"><div class="table-wrap"><table>'+
    '<thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصلاحية</th><th>الصلاحيات التفصيلية</th><th></th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>'+
    '<p class="muted small mt8">🔹 المدير: صلاحية كاملة دائماً على كل الصفحات. الكاشير: حسب الصلاحيات المحددة له تحديدًا.</p></div>';
}
function viewUserPermissions(id){
  var u = DB.users.find(function(x){ return x.id===id; });
  if(!u) return;
  var eff = userEffectivePermissions(u) || [];
  var isLegacy = u.role !== "admin" && (!u.permissions || !u.permissions.length);
  var body = PERMISSION_MODULES.map(function(m){
    var granted = m.actions.filter(function(a){ return eff.some(function(p){ return p.module===m.id && p.action===a.id; }); });
    if(!granted.length) return "";
    return '<div class="tot-row"><span>'+esc(m.label)+'</span><span class="small">'+granted.map(function(a){ return esc(a.label); }).join("، ")+'</span></div>';
  }).join("") || '<p class="muted small">لا توجد صلاحيات محددة لهذا المستخدم.</p>';
  openModal(
    '<div class="modal-head"><h3>'+icon("shield",18)+' صلاحيات: '+esc(u.name)+'</h3><button class="icon-btn" onclick="closeModal()">'+icon("x",20)+'</button></div>'+
    '<div class="modal-body">'+
      (isLegacy ? '<p class="small" style="color:var(--amber);margin-bottom:10px;">⚠️ لسه معندوش صلاحيات محددة صراحةً — الصلاحيات المعروضة دي القيمة الافتراضية القديمة. افتح «تعديل» واحفظ عشان تخصصها.</p>' : '')+
      body+
    '</div>'+
    '<div class="modal-foot">'+
      (can("cashiers","edit") ? '<button class="btn btn-primary" onclick="closeModal();openUserForm(\''+u.id+'\')">'+icon("edit",16)+' تعديل الصلاحيات</button>' : '')+
      '<button class="btn btn-ghost" onclick="closeModal()">إغلاق</button>'+
    '</div>'
  );
}
var userPermDraft = null;
function openUserForm(id){
  var u = id ? DB.users.find(function(x){ return x.id===id; }) : null;
  var initialPerms = u ? (userEffectivePermissions(u) || []) : [];
  userPermDraft = {
    id: u ? u.id : "",
    name: u ? u.name : "", username: u ? u.username : "", password: u ? u.password : "",
    role: u ? (u.role||"cashier") : "cashier",
    perms: initialPerms.map(function(p){ return {module:p.module, action:p.action}; })
  };
  openModal(userFormModalHTML(), true);
}
function onUserRoleChange(v){ userPermDraft.role = v; refreshUserFormModal(); }
function refreshUserFormModal(){ var m = $("#modal"); if(m) m.innerHTML = userFormModalHTML(); }
function userHasPerm(module, action){
  return userPermDraft.perms.some(function(p){ return p.module===module && p.action===action; });
}
function toggleUserPerm(module, action, checked){
  var idx = userPermDraft.perms.findIndex(function(p){ return p.module===module && p.action===action; });
  if(checked && idx===-1) userPermDraft.perms.push({module:module, action:action});
  if(!checked && idx!==-1) userPermDraft.perms.splice(idx,1);
}
function selectAllPerms(on){
  userPermDraft.perms = [];
  if(on){
    PERMISSION_MODULES.forEach(function(m){ m.actions.forEach(function(a){ userPermDraft.perms.push({module:m.id, action:a.id}); }); });
  }
  refreshUserFormModal();
}
function toggleModulePerms(moduleId, on){
  var m = PERMISSION_MODULES.find(function(x){ return x.id===moduleId; });
  if(!m) return;
  m.actions.forEach(function(a){ toggleUserPerm(moduleId, a.id, on); });
  refreshUserFormModal();
}
function permissionsSectionHTML(){
  if(userPermDraft.role === "admin"){
    return '<div class="field full"><div class="card" style="background:#f8fafc;padding:12px;margin-top:8px;">'+
      '<div class="bold mb8">صلاحيات المستخدم</div>'+
      '<p class="muted small">المدير لديه صلاحية كاملة دائماً على كل صفحات النظام — لا حاجة لتحديد صلاحيات.</p>'+
    '</div></div>';
  }
  var moduleBlocks = PERMISSION_MODULES.map(function(m){
    var allOn = m.actions.every(function(a){ return userHasPerm(m.id, a.id); });
    var checks = m.actions.map(function(a){
      var checked = userHasPerm(m.id, a.id);
      return '<label style="display:inline-flex;gap:6px;align-items:center;margin-inline-end:14px;margin-top:6px;">'+
        '<input type="checkbox" style="width:auto;" '+(checked?"checked":"")+' onchange="toggleUserPerm(\''+m.id+'\',\''+a.id+'\',this.checked)"> '+esc(a.label)+
      '</label>';
    }).join("");
    return '<div class="card" style="background:#f8fafc;padding:12px;margin-top:10px;">'+
      '<div class="row" style="justify-content:space-between;align-items:center;">'+
        '<span class="bold">'+esc(m.label)+'</span>'+
        '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleModulePerms(\''+m.id+'\', '+(!allOn)+')">'+(allOn?"إلغاء تحديد الكل":"تحديد الكل")+'</button>'+
      '</div>'+
      '<div style="margin-top:4px;">'+checks+'</div>'+
    '</div>';
  }).join("");
  return '<div class="field full" style="margin-top:8px;">'+
    '<div class="row" style="justify-content:space-between;align-items:center;">'+
      '<label class="bold">صلاحيات المستخدم</label>'+
      '<div class="row" style="gap:8px;">'+
        '<button type="button" class="btn btn-ghost btn-sm" onclick="selectAllPerms(true)">تحديد الكل</button>'+
        '<button type="button" class="btn btn-ghost btn-sm" onclick="selectAllPerms(false)">إلغاء تحديد الكل</button>'+
      '</div>'+
    '</div>'+
    moduleBlocks+
  '</div>';
}
function userFormModalHTML(){
  var d = userPermDraft;
  var isEdit = !!d.id;
  return '<div class="modal-head"><h3>'+(isEdit?"تعديل مستخدم":"إضافة مستخدم")+'</h3><button class="icon-btn" onclick="closeModal()">'+icon("x",20)+'</button></div>'+
    '<div class="modal-body">'+
      '<div class="field"><label>الاسم *</label><input id="u-name" value="'+esc(d.name)+'" onchange="userPermDraft.name=this.value"></div>'+
      '<div class="form-grid">'+
        '<div class="field"><label>اسم المستخدم *</label><input id="u-user" dir="ltr" value="'+esc(d.username)+'" onchange="userPermDraft.username=this.value"></div>'+
        '<div class="field"><label>كلمة المرور *</label><input id="u-pass" dir="ltr" value="'+esc(d.password)+'" onchange="userPermDraft.password=this.value"></div>'+
      '</div>'+
      '<div class="field"><label>الصلاحية</label><select id="u-role" onchange="onUserRoleChange(this.value)">'+
        '<option value="cashier" '+(d.role==="cashier"?"selected":"")+'>كاشير (بيع فقط)</option>'+
        '<option value="admin" '+(d.role==="admin"?"selected":"")+'>مدير (صلاحية كاملة)</option>'+
      '</select></div>'+
      permissionsSectionHTML()+
    '</div>'+
    '<div class="modal-foot">'+
      '<button class="btn btn-primary" onclick="saveUser()">حفظ</button>'+
      '<button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>'+
    '</div>';
}
function saveUser(){
  var d = userPermDraft;
  var name = $("#u-name").value.trim();
  var username = $("#u-user").value.trim();
  var password = $("#u-pass").value;
  if(!name || !username || !password){ toast("أكمل كل الحقول","err"); return; }
  var dup = DB.users.find(function(x){ return x.username===username && x.id!==d.id; });
  if(dup){ toast("اسم المستخدم مستخدم بالفعل","err"); return; }
  var role = $("#u-role").value;
  // canManageReturns القديم بيتحدد تلقائيًا من صلاحيات returns الجديدة، عشان
  // أي كود لسه بيقرا الحقل القديم مباشرة (لو موجود) يفضل شغال صح.
  var canManageReturnsFlag = role === "admin" || d.perms.some(function(p){ return p.module==="returns" && (p.action==="return"||p.action==="exchange"||p.action==="cancel"); });
  var data = {
    name: name, username: username, password: password, role: role,
    canManageReturns: canManageReturnsFlag,
    permissions: role === "admin" ? [] : d.perms
  };
  var item = d.id ? Object.assign({}, DB.users.find(function(x){ return x.id===d.id; }), data) : Object.assign({id:uid()}, data);
  api("POST", "/api/users", { item: item }).then(function(r){
    afterSync(r);
    closeModal(); renderViewInPlace(); toast("تم حفظ المستخدم");
  }).catch(function(e){ toast(e.message, "err"); });
}
function deleteUser(id){
  var u = DB.users.find(function(x){ return x.id===id; });
  if(!u) return;
  if(u.id === sessionId){ toast("لا يمكنك حذف حسابك الحالي","err"); return; }
  if(u.role==="admin" && DB.users.filter(function(x){ return x.role==="admin"; }).length <= 1){ toast("لا يمكن حذف آخر مدير","err"); return; }
  confirmBox("حذف المستخدم «"+u.name+"»؟", function(){
    api("POST", "/api/users/" + id + "/delete").then(function(r){ afterSync(r); renderViewInPlace(); toast("تم حذف المستخدم"); }).catch(function(e){ toast(e.message, "err"); });
  }, true);
}

/* ============================================================
   الإعدادات
   ============================================================ */
function viewSettings(){
  if(!isAdmin()){ return '<div class="empty"><div class="big">🔒</div><p>هذه الصفحة للمدير فقط</p></div>'; }
  var s = DB.settings;
  return '<div class="card mb16"><h3>'+icon("store",17)+' بيانات المتجر</h3>'+
    '<div class="form-grid">'+
      '<div class="field"><label>اسم المتجر</label><input id="s-name" value="'+esc(s.storeName)+'"></div>'+
      '<div class="field"><label>العملة</label><input id="s-cur" value="'+esc(s.currency)+'"></div>'+
      '<div class="field"><label>حد التنبيه للمخزون المنخفض</label><input id="s-low" type="number" min="0" value="'+s.lowStockThreshold+'"></div>'+
      '<div class="field"><label>بادئة رقم الفاتورة</label><input id="s-prefix" value="'+esc(s.invoicePrefix)+'"></div>'+
      '<div class="field"><label>رقم الفاتورة التالي</label><input id="s-counter" type="number" min="1" value="'+s.invoiceCounter+'"></div>'+
      '<div class="field"><label>هاتف المتجر (للإيصال)</label><input id="s-phone" dir="ltr" value="'+esc(s.phone||"")+'"></div>'+
      '<div class="field full"><label>نص أسفل الإيصال</label><input id="s-footer" value="'+esc(s.receiptFooter)+'"></div>'+
    '</div>'+
    '<button class="btn btn-primary mt8" onclick="saveSettings()">'+icon("check",16)+' حفظ الإعدادات</button>'+
  '</div>'+
  '<div class="card mb16"><h3>'+icon("down",17)+' النسخ الاحتياطي</h3>'+
    '<div class="row" style="flex-wrap:wrap;">'+
      '<button class="btn btn-ghost" onclick="exportData()">'+icon("down",16)+' تصدير البيانات (JSON)</button>'+
      '<button class="btn btn-ghost" onclick="$(\'#import-file\').click()">'+icon("up",16)+' استيراد بيانات</button>'+
      '<input type="file" id="import-file" accept="application/json" class="hidden" onchange="importData(event)">'+
      '<button class="btn btn-soft-red" onclick="clearAll()">'+icon("trash",16)+' مسح كل البيانات</button>'+
    '</div>'+
    '<p class="muted small mt8">💡 صدّر نسخة من بياناتك بشكل دوري لتفادي فقدانها عند مسح بيانات المتصفح.</p>'+
  '</div>'+
  '<div class="card"><h3>ℹ️ عن النظام</h3>'+
    '<p class="small muted">نظام كاشير لمحل ملابس — نسخة السيرفر: كل الأجهزة تشترك في نفس قاعدة البيانات على الخادم.</p>'+
  '</div>';
}
function saveSettings(){
  var settings = {
    storeName: $("#s-name").value.trim() || "29 STORE",
    currency: $("#s-cur").value.trim() || "ج.م",
    lowStockThreshold: Math.max(0, parseInt($("#s-low").value,10)||0),
    invoicePrefix: $("#s-prefix").value.trim() || "INV",
    invoiceCounter: Math.max(1, parseInt($("#s-counter").value,10)||1),
    phone: $("#s-phone").value.trim(),
    receiptFooter: $("#s-footer").value.trim()
  };
  api("POST", "/api/settings", { settings: settings }).then(function(r){
    afterSync(r);
    render(); toast("تم حفظ الإعدادات");
  }).catch(function(e){ toast(e.message, "err"); });
}
function exportData(){
  var blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "backup-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("تم تصدير النسخة الاحتياطية");
}
function importData(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data.settings || !data.products){ toast("ملف غير صالح","err"); return; }
      confirmBox("سيتم استبدال البيانات الحالية ببيانات الملف. متابعة؟", function(){
        api("POST", "/api/import", { db: data }).then(function(r){ afterSync(r); render(); toast("تم استيراد البيانات بنجاح"); }).catch(function(err){ toast(err.message, "err"); });
      }, true);
    }catch(err){ toast("تعذر قراءة الملف","err"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}
function clearAll(){
  confirmBox("سيتم حذف كل البيانات (المنتجات، الفواتير، العملاء، المستخدمين) والرجوع للإعدادات الافتراضية. هل أنت متأكد؟", function(){
    api("POST", "/api/reset").then(function(r){ afterSync(r); render(); toast("تم مسح كل البيانات"); }).catch(function(e){ toast(e.message, "err"); });
  }, true);
}

/* ============================================================
   الإقلاع
   ============================================================ */
(async function boot(){
  try{
    var r = await api("GET", "/api/state");
    afterSync(r);
    setSession(r.userId);
  }catch(e){ /* مش مسجل دخول → شاشة الدخول */ }
  render();
})();
</script>
</body>
</html>
