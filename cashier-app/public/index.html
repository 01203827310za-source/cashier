<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كاشير محل ملابس</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-soft:#eef2ff;
  --green:#059669; --green-soft:#ecfdf5;
  --red:#dc2626; --red-soft:#fef2f2;
  --amber:#d97706; --amber-soft:#fffbeb;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 28px -14px rgba(15,23,42,.14);
  --sidebar:#0f172a; --sidebar-text:#94a3b8;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Segoe UI", Tahoma, system-ui, -apple-system, "Cairo", "Noto Kufi Arabic", sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit;}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--text);}
a{color:var(--primary); text-decoration:none;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#cbd5e1; border-radius:8px; border:2px solid transparent; background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
.muted{color:var(--muted);}
.small{font-size:12px;}
.bold{font-weight:700;}
.row{display:flex; align-items:center; gap:8px;}
.grow{flex:1;}
.mt8{margin-top:8px;} .mt16{margin-top:16px;} .mb8{margin-bottom:8px;} .mb16{margin-bottom:16px;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 16px; border-radius:var(--radius-sm);
  font-weight:600; transition:.15s; border:1px solid transparent; white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:#fff; border-color:var(--border); color:var(--text);}
.btn-ghost:hover{background:#f8fafc;}
.btn-green{background:var(--green); color:#fff;}
.btn-green:hover{background:#047857;}
.btn-red{background:var(--red); color:#fff;}
.btn-red:hover{background:#b91c1c;}
.btn-soft-red{background:var(--red-soft); color:var(--red);}
.btn-soft-red:hover{background:#fee2e2;}
.btn-soft{background:var(--primary-soft); color:var(--primary);}
.btn-soft:hover{background:#e0e7ff;}
.btn-block{width:100%;}
.btn-sm{padding:6px 11px; font-size:13px;}
.btn-icon{padding:7px; border-radius:8px;}
.icon-btn{display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:8px; color:var(--muted); transition:.15s;}
.icon-btn:hover{background:#f1f5f9; color:var(--text);}
.icon-btn.danger:hover{background:var(--red-soft); color:var(--red);}
.icon-btn.primary:hover{background:var(--primary-soft); color:var(--primary);}

/* ---------- Cards ---------- */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.card h3{font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px;}

/* ---------- Stat cards ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:18px;}
.stat{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; position:relative; overflow:hidden;}
.stat .ic{width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; color:#fff;}
.stat .val{font-size:22px; font-weight:800;}
.stat .lbl{color:var(--muted); font-size:12.5px;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:right; color:var(--muted); font-weight:600; font-size:12px; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:hover{background:#f8fafc;}
tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.badge-green{background:var(--green-soft); color:var(--green);}
.badge-red{background:var(--red-soft); color:var(--red);}
.badge-amber{background:var(--amber-soft); color:var(--amber);}
.badge-blue{background:var(--primary-soft); color:var(--primary);}
.badge-gray{background:#f1f5f9; color:var(--muted);}
.badge-cyan{background:#ecfeff; color:#0891b2;}
.badge-purple{background:#f5f3ff; color:#7c3aed;}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:linear-gradient(135deg,#0f172a 0%,#312e81 60%,#4f46e5 100%);}
.login-card{background:#fff; border-radius:20px; padding:34px 30px; width:100%; max-width:400px; box-shadow:0 30px 60px -20px rgba(0,0,0,.45);}
.login-logo{width:64px; height:64px; border-radius:18px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.login-card h1{text-align:center; font-size:20px; margin-bottom:4px;}
.login-card .sub{text-align:center; color:var(--muted); margin-bottom:22px; font-size:13px;}
.field{margin-bottom:14px;}
.field label{display:block; font-weight:600; font-size:13px; margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%; padding:10px 13px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; outline:none; transition:.15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.15);}
.field textarea{resize:vertical; min-height:70px;}
.hint-box{background:var(--primary-soft); border:1px dashed #c7d2fe; border-radius:var(--radius-sm); padding:12px 14px; font-size:12.5px; margin-bottom:18px;}
.hint-box div{display:flex; justify-content:space-between; padding:2px 0;}
.hint-box code{background:#fff; border:1px solid #e0e7ff; padding:1px 8px; border-radius:6px; font-size:12px; direction:ltr; display:inline-block;}

/* ---------- App shell ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{width:235px; background:var(--sidebar); color:var(--sidebar-text); display:flex; flex-direction:column; flex-shrink:0; position:sticky; top:0; height:100vh; transition:.2s;}
.sidebar .brand{display:flex; align-items:center; gap:10px; padding:18px 18px 14px; color:#fff;}
.sidebar .brand .logo{width:40px; height:40px; border-radius:11px; background:var(--primary); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
.sidebar .brand .nm{font-weight:800; font-size:15px; line-height:1.2;}
.sidebar .brand .sm{font-size:11px; color:var(--sidebar-text);}
.sidebar nav{flex:1; padding:6px 10px; overflow-y:auto;}
.nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; color:var(--sidebar-text); margin-bottom:3px; font-weight:500; font-size:13.5px; transition:.15s; width:100%; text-align:right;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--primary); color:#fff;}
.sidebar .foot{padding:14px; border-top:1px solid rgba(255,255,255,.08);}
.user-chip{display:flex; align-items:center; gap:10px; padding:9px; border-radius:10px; background:rgba(255,255,255,.05); margin-bottom:8px;}
.user-chip .avatar{width:34px; height:34px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0;}
.user-chip .nm{color:#fff; font-weight:600; font-size:13px;}
.user-chip .rl{font-size:11px; color:var(--sidebar-text);}
.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{background:#fff; border-bottom:1px solid var(--border); padding:12px 22px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20;}
.topbar h2{font-size:17px; font-weight:800;}
.topbar .date{color:var(--muted); font-size:12.5px;}
.view{padding:22px; max-width:1250px; width:100%; margin:0 auto;}
.burger{display:none;}
.scrim{display:none;}

/* ---------- POS ---------- */
.pos{display:grid; grid-template-columns:1fr 370px; gap:16px; align-items:start;}
.pos-search{display:flex; gap:8px; margin-bottom:12px;}
.pos-search .inp{flex:1; position:relative;}
.pos-search .inp svg{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none;}
.pos-search .inp input{width:100%; padding:11px 40px 11px 13px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; outline:none;}
.pos-search .inp input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.15);}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{padding:6px 14px; border-radius:999px; background:#fff; border:1px solid var(--border); font-size:12.5px; font-weight:600; color:var(--muted); transition:.15s;}
.chip:hover{border-color:var(--primary); color:var(--primary);}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.pcard{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer; transition:.15s; position:relative; display:flex; flex-direction:column; gap:6px;}
.pcard:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:#c7d2fe;}
.pcard .emoji{font-size:34px; line-height:1;}
.pcard .pname{font-weight:700; font-size:13.5px; line-height:1.3;}
.pcard .pprice{color:var(--primary); font-weight:800; font-size:15px;}
.pcard .pmeta{display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--muted);}
.pcard .stock{position:absolute; top:10px; left:10px;}
.pcard.disabled{opacity:.5; pointer-events:none;}
.cart-panel{background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); display:flex; flex-direction:column; max-height:calc(100vh - 160px); position:sticky; top:86px;}
.cart-head{padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.cart-head .t{font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px;}
.cart-head .count{background:var(--primary-soft); color:var(--primary); font-size:12px; font-weight:800; padding:2px 9px; border-radius:999px;}
.cart-items{flex:1; overflow-y:auto; padding:10px 14px; min-height:80px;}
.cart-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px dashed var(--border); align-items:flex-start;}
.cart-item:last-child{border-bottom:none;}
.cart-item .emoji{font-size:24px;}
.cart-item .info{flex:1; min-width:0;}
.cart-item .nm{font-weight:700; font-size:13px;}
.cart-item .opt{font-size:11px; color:var(--muted);}
.cart-item .pr{font-weight:700; color:var(--primary); font-size:13px;}
.qty-ctrl{display:flex; align-items:center; gap:4px; margin-top:4px;}
.qty-ctrl button{width:24px; height:24px; border-radius:6px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--muted);}
.qty-ctrl button:hover{background:var(--primary-soft); color:var(--primary);}
.qty-ctrl span{min-width:26px; text-align:center; font-weight:700; font-size:13px;}
.cart-empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:13px;}
.cart-empty .big{font-size:40px; margin-bottom:8px;}
.cart-foot{border-top:1px solid var(--border); padding:14px 16px; background:#f8fafc; border-radius:0 0 var(--radius) var(--radius);}
.tot-row{display:flex; justify-content:space-between; padding:3px 0; font-size:13px;}
.tot-row.grand{font-weight:800; font-size:17px; padding-top:8px; margin-top:6px; border-top:1px solid var(--border); color:var(--text);}

/* ---------- Modals ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; animation:fade .15s;}
.modal{background:#fff; border-radius:16px; width:100%; max-width:520px; max-height:92vh; display:flex; flex-direction:column; animation:pop .18s;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px; font-weight:800;}
.modal-body{padding:20px; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-start;}
.modal.wide{max-width:640px;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.96); opacity:0}to{transform:scale(1); opacity:1}}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
.form-grid .full{grid-column:1 / -1;}

/* ---------- Toast ---------- */
#toasts{position:fixed; bottom:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:10px;}
.toast{background:#0f172a; color:#fff; padding:12px 18px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:0 12px 30px -8px rgba(0,0,0,.4); display:flex; align-items:center; gap:9px; animation:slideIn .25s; max-width:340px;}
.toast.ok{border-right:4px solid #10b981;}
.toast.err{border-right:4px solid #ef4444;}
.toast.warn{border-right:4px solid #f59e0b;}
@keyframes slideIn{from{transform:translateY(14px); opacity:0}to{transform:translateY(0); opacity:1}}

/* ---------- Receipt / print ---------- */
#print-area{display:none;}
@media print{
  html,body{width:auto; height:auto !important; margin:0; padding:0;}
  body>*:not(#print-area){display:none !important;}
  #print-area{display:block !important; width:auto; height:auto !important;}
}
.receipt{width:100%; max-width:300px; margin:0 auto; font-family:"Courier New", monospace; font-size:12.5px; color:#000; background:#fff; padding:14px; box-sizing:border-box; word-wrap:break-word; overflow-wrap:break-word;}
.receipt .rc{text-align:center; margin:2px 0;}
.receipt .rc.name{font-size:16px; font-weight:800;}
.receipt .divider{border-top:1px dashed #000; margin:8px 0;}
.receipt table{width:100%; font-size:12px;}
.receipt td{padding:2px 0; border:none;}
.receipt .ttl{display:flex; justify-content:space-between;}
.receipt .bold{font-weight:800;}
.receipt .barcode{text-align:center; margin-top:10px; letter-spacing:2px;}

/* ---------- Inventory print report ---------- */
.inv-report{background:#fff; color:#0f172a; font-family:"Segoe UI", Tahoma, sans-serif; direction:rtl; padding:16px; box-sizing:border-box;}
.inv-report-head{text-align:center; margin-bottom:14px;}
.inv-report-head h1{font-size:20px; margin:0 0 2px;}
.inv-report-head h2{font-size:15px; font-weight:600; margin:0 0 4px; color:var(--muted);}
.inv-report-head p{font-size:12px; color:var(--muted); margin:0;}
.inv-report-table{width:100%; border-collapse:collapse; font-size:12px;}
.inv-report-table th,.inv-report-table td{border:1px solid #cbd5e1; padding:6px 8px;}
.inv-report-table thead th{background:#f1f5f9; font-weight:700;}
.inv-report-totals{display:flex; flex-wrap:wrap; gap:18px; margin-top:14px; padding-top:10px; border-top:2px solid #0f172a;}
.inv-report-totals div{display:flex; flex-direction:column; gap:2px; font-size:12px; min-width:130px;}
.inv-report-totals b{font-size:15px;}
@media print{
  .inv-report-table thead{display:table-header-group;}
  .inv-report-table tr{page-break-inside:avoid;}
  .inv-report{padding:0;}
}

/* ---------- Reports ---------- */
.bars{display:flex; align-items:flex-end; gap:6px; height:180px; padding:10px 4px 0;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; min-width:0;}
.bar-col .bar{width:100%; max-width:38px; background:linear-gradient(180deg,#6366f1,#4f46e5); border-radius:6px 6px 2px 2px; min-height:2px; position:relative; transition:.2s;}
.bar-col .bar:hover{background:#4338ca;}
.bar-col .bv{font-size:10px; color:var(--muted); font-weight:700;}
.bar-col .bl{font-size:9.5px; color:var(--muted); white-space:nowrap; transform:rotate(-40deg); transform-origin:center;}

/* ---------- Empty state ---------- */
.empty{text-align:center; padding:50px 20px; color:var(--muted);}
.empty .big{font-size:52px; margin-bottom:10px;}

/* ---------- Filter bar ---------- */
.filterbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.filterbar select,.filterbar input{padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; outline:none;}
.filterbar select:focus,.filterbar input:focus{border-color:var(--primary);}

.warn-banner{background:var(--amber-soft); color:#92400e; border:1px solid #fde68a; border-radius:12px; padding:11px 15px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:9px;}

/* ---------- Responsive ---------- */
@media (max-width:960px){
  .pos{grid-template-columns:1fr;}
  .cart-panel{max-height:none; position:static;}
  .sidebar{position:fixed; right:-260px; z-index:60; height:100vh;}
  .sidebar.open{right:0; box-shadow:0 0 0 100vmax rgba(15,23,42,.5);}
  .burger{display:inline-flex;}
  .scrim.show{display:block; position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:50;}
  .form-grid{grid-template-columns:1fr;}
}

/* ---------- صور المنتجات ---------- */
.thumb-emoji{display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--primary-soft);flex-shrink:0;line-height:1;}
.pthumb{display:flex;justify-content:center;margin-bottom:2px;}

/* صورة/أيقونة المنتج الكبيرة (مربعة، ملاصقة لحواف البطاقة العلوية) في بطاقات نقطة البيع */
.pthumb.pthumb-lg{margin:-14px -14px 8px -14px;}
.kiosk-grid .pthumb.pthumb-lg{margin:-18px -14px 8px -14px;}
.pcard-img{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box;background:var(--primary-soft);border-radius:14px 14px 0 0;overflow:hidden;}
.pcard-img-el{width:100%;height:100%;object-fit:contain;display:block;}
.pcard-emoji{font-size:88px;line-height:1;}
.kiosk-grid .pcard-img{padding:12px;border-radius:16px 16px 0 0;}
.kiosk-grid .pcard-emoji{font-size:112px;}
@media (max-width:480px){
  .pcard-img{padding:6px;}
  .pcard-emoji{font-size:64px;}
}

/* ---------- قوائم المتغيرات (مقاس/لون) ---------- */
.vlist{display:flex;flex-direction:column;gap:8px;}
.vrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;flex-wrap:wrap;}
.vrow.disabled{opacity:.5;}
.vlab{font-weight:600;font-size:13px;min-width:70px;}

/* ---------- استيكر الباركود ---------- */
.labelsheet{display:flex;flex-wrap:wrap;gap:6px;padding:10px;}
.plabel{width:260px;padding:10px 8px;border:1px solid #000;text-align:center;page-break-inside:avoid;background:#fff;}
.plabel .pl-name{font-weight:800;font-size:12.5px;}
.plabel .pl-var{font-size:10px;color:#333;}
.plabel .pl-price{font-weight:800;font-size:16px;margin:3px 0;}
.plabel .pl-bc{display:flex;justify-content:center;margin:4px 0;}
.plabel .pl-code{font-size:10px;letter-spacing:1px;font-family:monospace;}

/* ---------- أوردرات الشحن ---------- */
.osheet{width:100%;max-width:340px;margin:0 auto;font-family:"Segoe UI",Tahoma,sans-serif;font-size:12.5px;border:1px solid #000;padding:12px;direction:rtl;}
.osheet h3{text-align:center;margin:0 0 2px;font-size:16px;font-weight:800;}
.osheet table{width:100%;font-size:11.5px;border-collapse:collapse;}
.osheet td{padding:3px 2px;border-bottom:1px dashed #999;text-align:right;}
.osheet .ttl{display:flex;justify-content:space-between;margin:2px 0;}
.osheet .rc{text-align:center;margin:2px 0;}

/* ---------- عروض وخصومات ---------- */
.strike{text-decoration:line-through;color:var(--muted);font-size:12px;font-weight:400;}
.offer-badge{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;}

/* ---------- جرس التنبيهات ---------- */
.bell-btn{position:relative;}
.bell-count{position:absolute;top:-3px;left:-3px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ---------- وضع الكشك ---------- */
.app.kiosk-on .sidebar{display:none;}
.kiosk-view{padding:4px;}
.kiosk-grid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr)) !important;gap:14px !important;}
.kiosk-grid .pcard{padding:18px 14px;gap:9px;border-radius:16px;}
.kiosk-grid .pcard .pname{font-size:15px;}
.kiosk-grid .pcard .pprice{font-size:18px;}
.kiosk-grid .pcard .pmeta{font-size:12px;}

/* ---------- سطور فاتورة الشراء ---------- */

async function api(method, p, body){
  var headers = { "Content-Type": "application/json" };
  var opts = { method: method, headers: headers, credentials: "include" };
  if(body !== undefined){ opts.body = JSON.stringify(body); }
  var res = await fetch(p, opts);
  var data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok || !data.ok){ throw new Error((data && data.error) || ("خطأ في الاتصال ("+res.status+")")); }

}
function resizeImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 420;
      var w = img.width, h = img.height;
      var sc = Math.min(1, max/Math.max(w,h));
      w = Math.max(1, Math.round(w*sc)); h = Math.max(1, Math.round(h*sc));
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.82));
    };
    img.onerror = function(){ cb(null); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- المتغيرات (مقاس/لون) والمخزون ---------- */
function stockOf(p){ return (p.variants||[]).reduce(function(a,v){ return a + (v.stock||0); },0); }
function variantLabel(v){ return [v.size, v.color].filter(Boolean).join(" / ") || "قطعة واحدة"; }
function ensureVariants(p){
  if(p.variants && p.variants.length){
    p.variants.forEach(function(v){ if(!v.id) v.id = uid(); if(!v.barcode) v.barcode = generateEAN13(); });
    return;
  }
  var sizes = (p.sizes && p.sizes.length) ? p.sizes : [null];
  var colors = (p.colors && p.colors.length) ? p.colors : [null];
  var combos = [];
  sizes.forEach(function(s){ colors.forEach(function(c){ combos.push([s,c]); }); });
  var total = Math.max(0, parseInt(p.stock,10)||0);
  var per = Math.floor(total / combos.length);
  var rem = total % combos.length;
  p.variants = combos.map(function(cb, i){
    return { id: uid(), size: cb[0], color: cb[1], stock: per + (i<rem?1:0), barcode: generateEAN13() };
  });
}
function migrateProducts(){
  DB.products.forEach(function(p){
    ensureVariants(p);
    p.stock = stockOf(p);
    if(!p.image) p.image = "";
    if(!("offer" in p)) p.offer = null;
  });
}
function findVariantByBarcode(code){
  code = String(code||"").trim();
  if(!code) return null;
  for(var i=0;i<DB.products.length;i++){
    var p = DB.products[i];
    for(var j=0;j<(p.variants||[]).length;j++){
      if(String(p.variants[j].barcode) === code){ return {product:p, variant:p.variants[j]}; }
    }
  }
  return null;
}

/* ---------- باركود (رقم EAN-13 + رسم Code 39) ---------- */
function eanCheck(s12){
  var sum = 0;
  for(var i=0;i<12;i++){ var d = +s12[i]; sum += (i%2===0) ? d : d*3; }
  return String((10 - (sum%10)) % 10);
}
function generateEAN13(){
  var body = "2";
  for(var i=0;i<11;i++){ body += Math.floor(Math.random()*10); }
  return body + eanCheck(body);
}
var CODE39 = {
  "0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw",
  "5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn",

  "P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn",
  "U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn",
  "Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","*":"nwnnwnwnn",
  "$":"nwnwnwnnn","/":"nwnwnnnwn","+":"nwnnnwnwn","%":"nnnwnwnwn"
};
function code39SVG(text, opts){
  opts = opts||{};
  var h = opts.height||52, unit = opts.unit||2, showText = opts.text !== false;
  var chars = ("*" + String(text).toUpperCase() + "*").split("");
  var x = 0, bars = [];
  chars.forEach(function(c){
    var pat = CODE39[c] || CODE39["-"];
    for(var i=0;i<9;i++){
      var w = (pat.charAt(i)==="w" ? 3 : 1) * unit;
      if(i%2===0){ bars.push('<rect x="'+x+'" y="0" width="'+w+'" height="'+h+'" fill="#000"/>'); }
      x += w;
    }
    x += unit;
  });
  var textH = showText ? 14 : 0;
  var W = x, H = h + textH;
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+bars.join("")+
    (showText ? '<text x="'+(W/2)+'" y="'+(h+11)+'" font-size="10" text-anchor="middle" font-family="monospace, Arial">'+esc(text)+'</text>' : '')+
    '</svg>';
}

/* ---------- العروض والخصومات ---------- */
function offerPrice(p){
  if(!p) return 0;
  if(p.offer && p.offer.type === "percent"){ return Math.max(0, p.price * (1 - p.offer.value/100)); }
  if(p.offer && p.offer.type === "fixed"){ return Math.max(0, p.offer.value); }
  return p.price;
}
function hasOffer(p){
  if(!p || !p.offer) return false;
  if(p.offer.type === "percent"){ return p.offer.value > 0 && p.offer.value < 100; }
  if(p.offer.type === "fixed"){ return p.offer.value > 0 && p.offer.value < p.price; }
  return false;
}
function offerLabel(p){
  if(!hasOffer(p)) return "";
  return p.offer.type === "percent" ? ("خصم "+p.offer.value+"%") : ("عرض "+fmt(p.offer.value));
}

    var items = list.filter(function(t){ return sec.types.indexOf(t.type) !== -1 && (!sec.direction || t.direction===sec.direction); });
    var total = items.reduce(function(a,t){ return a + (t.direction==="in" ? (t.amount||0) : -(t.amount||0)); }, 0);

  var balance = sections.reduce(function(a,s){ return a+s.total; }, 0);
  return { sections: sections, balance: balance };
}

// أثر الاسترجاع/الاستبدال على رصيد العميل: لو الفاتورة الأصلية آجلة فالاسترجاع
// بيقلل اللي عليه (أو الفرق في الاستبدال)؛ لو مش آجلة لكن رد المبلغ "رصيد للعميل"
// بدل كاش، فده مبلغ جديد بقى المحل مديون بيه للعميل.
function customerReturnsAdjustment(cid){
  var v = 0;
  (DB.returns||[]).forEach(function(r){
    if(r.customerId !== cid) return;
    if(isReturnCancelled(r)) return;
    var sale = DB.sales.find(function(s){ return s.id === r.saleId; });
    if(isSaleCancelled(sale)) return;
    var wasCreditSale = !!(sale && sale.paymentMethod === "credit");
    if(wasCreditSale){
      v += r.type === "exchange" ? -(r.difference||0) : (r.returnedTotal||0);
    } else if(r.refundMethod === "credit"){
      v += r.type === "exchange" ? Math.max(0, -(r.difference||0)) : (r.returnedTotal||0);
    }
  });
  return v;
}
// المرتجع الإجمالي المسجّل على فاتورة بيع معينة (يشمل الجزء المرتجع من أي عملية
// استبدال أيضاً — القطعة القديمة رجعت فعلاً بغض النظر عن نوع العملية).
function saleReturnedTotal(saleId){
  return (DB.returns||[]).filter(function(r){ return r.saleId===saleId && !isReturnCancelled(r); })
    .reduce(function(a,r){ return a+(r.returnedTotal||0); },0);
}
// أثر مجموعة من عمليات الاسترجاع/الاستبدال على أرقام التقارير المالية:
// - returnsTotal: قيمة كل القطع المرتجعة (سواء استرجاع مستقل أو الجزء المرتجع من استبدال)
// - exchangeReplacementTotal: قيمة كل الأصناف البديلة في عمليات الاستبدال — دي مبيعات
//   جديدة فعلياً ولازم تُضاف إلى إجمالي المبيعات (مفيش فاتورة بيع منفصلة اتسجلت لها)
// - profitImpact: التعديل على صافي الربح: نقص ربح القطعة المرتجعة (بسعرها وتكلفتها
//   الأصليين وقت البيع) + ربح القطعة البديلة (بسعرها وتكلفتها الحاليين) لو استبدال
function returnsImpact(returnsList){
  var returnsTotal = 0, exchangeReplacementTotal = 0, profitImpact = 0;
  (returnsList||[]).forEach(function(r){
    if(isReturnCancelled(r)) return;
    var sale = DB.sales.find(function(s){ return s.id===r.saleId; });
    if(isSaleCancelled(sale)) return;
    returnsTotal += (r.returnedTotal||0);
    if(r.type === "exchange") exchangeReplacementTotal += (r.replacementTotal||0);
    (r.items||[]).forEach(function(it){
      var saleItem = sale ? sale.items.find(function(si){ return si.id===it.saleItemId; }) : null;
      var cost = (saleItem && saleItem.cost!=null) ? saleItem.cost : 0;
      profitImpact -= ((it.unitPrice||0) - cost) * (it.qty||0);
      if(r.type === "exchange" && it.replacementProductId){
        var rp = DB.products.find(function(p){ return p.id===it.replacementProductId; });
        var repCost = rp ? (rp.cost||0) : 0;
        profitImpact += ((it.replacementPrice||0) - repCost) * (it.replacementQty||0);
      }
    });
  });
  return { returnsTotal: returnsTotal, exchangeReplacementTotal: exchangeReplacementTotal, profitImpact: profitImpact };
}

function saleCashBy(s){ return s.cashBy || s.userId; }
function expensePaidBy(e){ return e.paidBy || e.userId; }

/* الرصيد الجاري لكل شخص (كل الفلوس اللي معاه) — لازم يشمل نفس بنود dayMovements
   بالظبط (بما فيها أثر الاسترجاع/الاستبدال النقدي) وإلا الرصيد التراكمي
   (كل التاريخ) ميطابقش مجموع "الصافي" اليومي، ويظهر رقم أعلى من الحقيقي بمقدار
   أي مبالغ استرجاع/استبدال نقدي كان المفروض تتخصم. */
function userCashBalance(userId){
  var b = 0;
  activeSalesList(DB.sales).forEach(function(s){ if(s.paymentMethod==="cash" && saleCashBy(s)===userId) b += s.total; });
  DB.orders.forEach(function(o){ if(o.collected && o.collectedBy===userId) b += (o.collectedAmount||o.total); });
  DB.otherIncome.forEach(function(i){ if(incomeReceivedBy(i)===userId) b += i.amount; });
  (DB.paymentsIn||[]).forEach(function(p){ if(payInReceivedBy(p)===userId) b += p.amount; });
  (DB.transfers||[]).forEach(function(t){ if(t.toId===userId) b += t.amount; if(t.fromId===userId) b -= t.amount; });
  DB.expenses.forEach(function(e){ if(e.paymentMethod==="cash" && expensePaidBy(e)===userId) b -= e.amount; });
  (DB.paymentsOut||[]).forEach(function(p){ if((p.paymentMethod||"cash")==="cash" && payOutPaidBy(p)===userId) b -= p.amount; });
  (DB.returns||[]).forEach(function(r){
    if(isReturnCancelled(r) || r.refundMethod !== "cash" || r.userId !== userId) return;
    if(r.type === "exchange") b += (r.difference||0); // العميل دفع فرق كاش زيادة (+) أو المحل رجّع فرق (-)
    else b -= (r.returnedTotal||0);
  });
  return b;
}
/* حركات شخص في يوم معين */
function dayMovements(userId, day){
  var from = new Date(day+"T00:00:00").getTime(), to = new Date(day+"T23:59:59").getTime();
  function inR(t){ return t>=from && t<=to; }
  var m = {cashSales:0, cod:0, transfersIn:0, transfersOut:0, expenses:0, supplierPay:0, otherIncome:0, custPay:0, refunds:0};
  activeSalesList(DB.sales).forEach(function(s){ if(s.paymentMethod==="cash" && saleCashBy(s)===userId && inR(s.date)) m.cashSales += s.total; });
  DB.orders.forEach(function(o){ if(o.collected && o.collectedBy===userId && inR(o.collectedAt||o.date)) m.cod += (o.collectedAmount||o.total); });
  DB.otherIncome.forEach(function(i){ if(incomeReceivedBy(i)===userId && inR(i.date)) m.otherIncome += i.amount; });
  (DB.paymentsIn||[]).forEach(function(p){ if(payInReceivedBy(p)===userId && inR(p.date)) m.custPay += p.amount; });
  (DB.transfers||[]).forEach(function(t){ if(inR(t.date)){ if(t.toId===userId) m.transfersIn += t.amount; if(t.fromId===userId) m.transfersOut += t.amount; } });
  DB.expenses.forEach(function(e){ if(e.paymentMethod==="cash" && expensePaidBy(e)===userId && inR(e.date)) m.expenses += e.amount; });
  (DB.paymentsOut||[]).forEach(function(p){ if((p.paymentMethod||"cash")==="cash" && payOutPaidBy(p)===userId && inR(p.date)) m.supplierPay += p.amount; });
  (DB.returns||[]).forEach(function(r){
    if(isReturnCancelled(r) || r.refundMethod !== "cash" || r.userId !== userId || !inR(r.date)) return;
    if(r.type === "exchange"){
      if((r.difference||0) > 0) m.cashSales += r.difference; // العميل دفع فرق كاش زيادة
      else if((r.difference||0) < 0) m.refunds += -r.difference; // المحل رجّع فرق كاش
    } else {
      m.refunds += (r.returnedTotal||0);
    }
  });
  m.net = m.cashSales + m.cod + m.otherIncome + m.custPay + m.transfersIn - m.expenses - m.supplierPay - m.transfersOut - m.refunds;
  return m;
}

async function saveTransfer(){

/* ---------- نظام الصلاحيات الدقيقة (صفحة + إجراء) ----------
   مرآة لنفس منطق can()/legacyCan()/LEGACY_CASHIER_MODULES في server.js —
   هنا بس للتحكم في الواجهة (إخفاء/تعطيل عناصر)، الأمان الفعلي مفروض في
   السيرفر. لازم أي تعديل هنا يترافق بنفس التعديل هناك. */
var PERMISSION_MODULES = [
  { id:"dashboard", label:"لوحة التحكم", actions:[{id:"view",label:"عرض"}] },
  { id:"pos", label:"نقطة البيع", actions:[

  ]},

  ]},

  ]},

  ]},

  ]},
  { id:"cash", label:"الخزنة", actions:[
    {id:"view",label:"عرض"},{id:"create",label:"إضافة"},{id:"edit",label:"تعديل"}
  ]},

    {id:"view",label:"عرض"},{id:"create",label:"إضافة"},{id:"edit",label:"تعديل"},{id:"delete",label:"حذف"}
  ]},

  ]}

// نفس الصلاحيات اللي كانت فعلية فعلاً قبل النظام ده (nav roles القديمة +
// canManageReturns) — بتتطبق بس على كاشير معندوش ولا صف UserPermission واحد
// (يعني لسه ما اتحفظش له صلاحيات صريحة من الشاشة الجديدة)، عشان محدش يتقفل
// عليه فجأة أول ما الميزة دي تتنشر.
var LEGACY_CASHIER_MODULES = { dashboard:["view"], pos:["view","create","edit"], products:["view","create","edit"], orders:["view","create","edit"], reports:["view"] };
function legacyCan(u, module, action){
  if(module === "returns" && (action === "return" || action === "exchange" || action === "cancel")){
    return u.canManageReturns !== false;
  }
  var allowed = LEGACY_CASHIER_MODULES[module];
  return !!allowed && allowed.indexOf(action) !== -1;
}
function can(module, action){
  var u = currentUser();
  if(!u) return false;
  if(u.role === "admin") return true;
  var perms = u.permissions || [];
  if(!perms.length) return legacyCan(u, module, action);
  return perms.some(function(p){ return p.module === module && p.action === action; });
}

/* ---------- Toast ---------- */
function toast(msg, type){
  var box = $("#toasts");
  var el = document.createElement("div");
  el.className = "toast " + (type||"ok");
  var ic = type==="err" ? "⚠️" : (type==="warn" ? "🔔" : "✅");
  el.innerHTML = "<span>"+ic+"</span><span>"+esc(msg)+"</span>";
  box.appendChild(el);
  setTimeout(function(){ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(function(){ el.remove(); },300); }, 2600);
}

  var gated = PERMISSION_MODULES.some(function(m){ return m.id === currentView; });

    return '<div class="empty"><div class="big">🔒</div><p>ليس لديك صلاحية للوصول لهذه الصفحة</p></div>';

function addVariantToCart(pid, vid, qty){
  var p = DB.products.find(function(x){ return x.id===pid; });

  var v = (p.variants||[]).find(function(x){ return x.id===vid; });
  if(!v) return;
  qty = Math.max(1, parseInt(qty,10)||1);
  var inCart = cart.reduce(function(a,c){ return a + (c.variantId===v.id ? c.qty : 0); },0);
  if(inCart + qty > v.stock){ toast("الكمية المطلوبة أكبر من المتاح لهذا المقاس","err"); return; }
  var item = cart.find(function(c){ return c.variantId===v.id; });
  if(item){ item.qty += qty; }
  else{
    cart.push({key:v.id, variantId:v.id, productId:p.id, name:p.name, emoji:p.emoji, image:p.image, price:offerPrice(p), cost:p.cost, qty:qty, size:v.size, color:v.color, barcode:v.barcode});
  }
  renderCart();
  toast(p.emoji+" تمت إضافة "+p.name+(v.size||v.color ? " ("+variantLabel(v)+")" : ""));
}
function updateQty(key, d){
  var item = cart.find(function(c){ return c.key===key; });
  if(!item) return;
  if(d > 0){
    var p = DB.products.find(function(x){ return x.id===item.productId; });
    var v = p && (p.variants||[]).find(function(x){ return x.id===item.variantId; });
    var inCart = cart.reduce(function(a,c){ return a + (c.variantId===item.variantId ? c.qty : 0); },0);
    if(v && inCart + 1 > v.stock){ toast("وصلت للحد الأقصى المتاح لهذا المقاس","warn"); return; }
  }
  item.qty += d;
  if(item.qty <= 0){ cart = cart.filter(function(c){ return c.key!==key; }); }
  renderCart();
}

async function completeSale(){
  var t = cartTotals();
  var method = $("#ck-method").value;
  var customerId = $("#ck-customer").value || null;
  var cashBy = $("#ck-person") ? $("#ck-person").value : null;
  if(method==="credit" && !customerId){
    toast("البيع الآجل يتطلب اختيار عميل","err");
    return;
  }
  var cashReceived = method==="cash" ? num($("#ck-cash").value) : 0;
  if(method==="cash" && cashReceived < t.total){
    toast("المبلغ المدفوع أقل من المطلوب","err");
    return;
  }
  var u = currentUser();
  var sale = {
    items: cart.map(function(c){ return {productId:c.productId, variantId:c.variantId, name:c.name, emoji:c.emoji, price:c.price, cost:c.cost, qty:c.qty, size:c.size, color:c.color}; }),
    subtotal: t.subtotal,
    discount: t.discount,
    tax: t.tax,
    total: t.total,
    profit: (t.subtotal - t.discount) - cart.reduce(function(a,c){ return a+c.cost*c.qty; },0),
    paymentMethod: method,
    cashReceived: cashReceived,
    change: Math.max(0, cashReceived - t.total),
    customerId: customerId,
    cashBy: cashBy || u.id
  };
  var decrements = cart.map(function(c){ return { productId: c.productId, variantId: c.variantId, qty: c.qty }; });
  var savedCart = cart.slice();
  var r = await api("POST", "/api/sale", { sale: sale, decrements: decrements });
  afterSync(r);
  var savedSale = r.sale;
  closeModal();
  cart = [];
  renderViewInPlace();
  showReceipt(savedSale);
  toast("تم حفظ الفاتورة " + savedSale.number);
}

// الفاتورة "الفعلية" بعد احتساب أي مرتجعات نشطة عليها — من غير ما نلمس صفوف
// Sale/SaleItem الأصلية في قاعدة البيانات ولا نحذف أي بيانات (نفس مصدر
// saleReturnedTotal/saleItemReturnedQty بالظبط، فمفيش رقمين مختلفين لنفس الفاتورة
// في أي مكان بالنظام). الخصم الفعلي بيتحسب عكسيًا من الصافي عشان يفضل
// effectiveSubtotal - effectiveDiscount === effectiveTotal بالظبط زي ما مطلوب
// (الإجمالي النهائي = إجمالي الأصناف - الخصم).
function saleEffectiveView(sale){
  var items = sale.items.map(function(it){
    var returnedQty = sale.id ? saleItemReturnedQty(it.id) : 0;
    var remainingQty = Math.max(0, (it.qty||0) - returnedQty);
    return { it: it, returnedQty: returnedQty, remainingQty: remainingQty, lineTotal: remainingQty * (it.price||0) };
  });
  var effectiveSubtotal = items.reduce(function(a,x){ return a+x.lineTotal; }, 0);
  var returnedTotal = sale.id ? saleReturnedTotal(sale.id) : 0;
  var effectiveTotal = Math.max(0, (sale.total||0) - returnedTotal);
  var effectiveDiscount = Math.max(0, effectiveSubtotal - effectiveTotal);
  return { items: items, effectiveSubtotal: effectiveSubtotal, effectiveDiscount: effectiveDiscount, effectiveTotal: effectiveTotal, returnedTotal: returnedTotal };
}
// سجل المرتجعات/الاستبدالات المرتبطة بهذه الفاتورة — بالترتيب الزمني، مع قيمة
// الفاتورة قبل/بعد كل عملية (نفس فكرة "كانت بقيمة X، تم إرجاع Y، أصبحت Z"
// المطلوبة، من غير ما نسجّل أي عملية مالية إضافية — البيانات دي كلها معروضة من
// SaleReturn/SaleReturnItem الموجودين بالفعل).
function saleReturnHistoryHTML(sale){
  var list = (DB.returns||[]).filter(function(r){ return r.saleId===sale.id; }).sort(function(a,b){ return a.date-b.date; });
  if(!list.length) return "";
  var running = sale.total||0;
  var rows = list.map(function(r){
    var cancelled = isReturnCancelled(r);
    var before = running;
    var net = (r.returnedTotal||0) - (r.replacementTotal||0);
    if(!cancelled) running = Math.max(0, running - net);
    var after = cancelled ? before : running;
    var itemsTxt = (r.items||[]).map(function(it){ return esc(it.size||it.color?((it.qty||0)+"× "+[it.size,it.color].filter(Boolean).join("/")):(it.qty||0)+"×"); }).join("، ");
    return '<div class="tot-row" style="align-items:flex-start;'+(cancelled?'opacity:.55;':'')+'">'+
      '<span>'+dateStr(r.date)+' '+timeStr(r.date)+' — '+(r.type==="exchange"?"استبدال":"استرجاع")+' '+esc(r.number||"")+
        (cancelled?' <span class="badge badge-gray">ملغي</span>':'')+
        '<div class="small muted">بواسطة '+esc(userById(r.userId)?userById(r.userId).name:"—")+(itemsTxt?(' — '+itemsTxt):'')+'</div>'+
      '</span>'+
      '<span class="small" style="text-align:left;white-space:nowrap;">'+fmt(before)+' ← '+fmt(after)+'</span>'+
    '</div>';
  }).join("");
  return '<div class="card mt8" style="background:#f8fafc;padding:12px;">'+
    '<div class="bold small mb8">'+icon("history",14)+' سجل المرتجعات على هذه الفاتورة</div>'+rows+'</div>';
}
function saleInvoiceDetailHTML(sale){
  if(!sale.id) return "";

  if(ev.returnedTotal <= 0.004) return "";
  var remainingItems = ev.items.filter(function(x){ return x.remainingQty > 0; });
  var removedItems = ev.items.filter(function(x){ return x.remainingQty <= 0; });
  var rows = remainingItems.map(function(x){

      '<td class="bold" style="text-align:center;">'+x.remainingQty+'</td>'+

  return '<div class="card mb8"><h3 style="font-size:14px;">'+icon("box",15)+' الفاتورة بعد المرتجع</h3>'+
    '<div class="table-wrap"><table><thead><tr><th>الصنف</th><th style="text-align:center;">الكمية الحالية</th><th style="text-align:left;">الإجمالي</th></tr></thead>'+
    '<tbody>'+(rows||'<tr><td colspan="3" class="muted" style="text-align:center;padding:12px;">تم إرجاع كل أصناف الفاتورة</td></tr>')+'</tbody></table></div>'+
    (removedItems.length ? '<p class="small muted mb8">أصناف أُزيلت من الفاتورة (أُرجعت بالكامل): '+removedItems.map(function(x){ return esc(x.it.name||""); }).join("، ")+'</p>' : '')+

  '</div>'+saleReturnHistoryHTML(sale);

// صفوف تقرير الطباعة — سطر لكل مقاس/لون (variant)، من نفس المخزون المعروض
// فعلياً (filteredProductsList) وبدون أي إعادة حساب. المخزون الحالي مفيهوش مفهوم
// "محجوز" منفصل عن stock (الكمية بتتخصم من الـ variant فوراً وقت إنشاء أي أوردر
// أو فاتورة بيع — راجع adjustVariantStock)، يعني مفيش رصيد تاني "محجوز" يتفرق عن
// المتاح. فالمحجوز هنا = صفر دايماً، والمتاح = الفعلية بالظبط، طبقاً للمعادلة
// المطلوبة (المتاح = الفعلية - المحجوز) لكن من غير اختلاق رقم مش موجود فعلاً في
// النظام.
function inventoryPrintRows(){
  var rows = [];
  filteredProductsList().forEach(function(p){
    var variants = (p.variants && p.variants.length) ? p.variants : [{ size:null, color:null, stock:p.stock||0 }];
    variants.forEach(function(v){
      var actual = v.stock||0;
      var reserved = 0;
      rows.push({
        name: p.name, sku: p.sku||"", modelCode: p.modelCode||"",
        color: v.color||"", size: v.size||"",
        actual: actual, reserved: reserved, available: actual - reserved
      });
    });
  });
  return rows;
}

    '<table class="inv-report-table">'+
      '<thead><tr><th>كود/اسم المنتج</th><th>الموديل</th><th>اللون</th><th>المقاس</th><th>الكمية الفعلية</th><th>المحجوز</th><th>المتاح</th></tr></thead>'+
      '<tbody>'+trs+'</tbody>'+
    '</table>'+
    '<div class="inv-report-totals">'+
      '<div><span>إجمالي الأصناف</span><b>'+fmtInt(rows.length)+'</b></div>'+

      '<div><span>إجمالي الكمية المحجوزة</span><b>'+fmtInt(totalReserved)+'</b></div>'+

    '</div>'+
  '</div>';
}

async function savePrintingOrder(){
  var d = printingOrderDraft;
  var sourceVariant = resolveVariant(d.sourceProductId, d.sourceColor, d.sourceSize);
  var targetVariant = resolveVariant(d.targetProductId, d.targetColor, d.targetSize);
  var qty = parseInt(d.quantity, 10) || 0;
  if(!sourceVariant){ toast("اختر الموديل المصدر (والمقاس/اللون)","err"); return; }
  if(!targetVariant){ toast("اختر الموديل الناتج (والمقاس/اللون)","err"); return; }
  if(sourceVariant.id === targetVariant.id){ toast("لا يمكن أن يكون الموديل المصدر هو نفس الموديل الناتج","err"); return; }
  if(qty <= 0){ toast("الكمية يجب أن تكون أكبر من صفر","err"); return; }
  if(qty > (sourceVariant.stock||0)){ toast("الكمية المطلوبة أكبر من الكمية المتاحة","err"); return; }
  try{
    var r = await api("POST", "/api/printing-orders", {
      sourceVariantId: sourceVariant.id, targetVariantId: targetVariant.id, quantity: qty,
      date: new Date((d.date||todayKey())+"T12:00:00").getTime(), notes: (d.notes||"").trim()
    });
    afterSync(r);
    closeModal(); renderViewInPlace(); toast("تم تنفيذ أمر الطباعة بنجاح");
  }catch(e){ toast(e.message, "err"); }
}

function printStickers(id){

    var cb = $("#bp-"+i);
    if(!cb || !cb.checked) return;
    var q = parseInt($("#bpq-"+i).value,10)||1;
    for(var k=0;k<q;k++){ labels.push(v); }

  if(!labels.length){ toast("اختر مقاساً واحداً على الأقل","warn"); return; }
  setPrintPageSize(null);
  $("#print-area").innerHTML = '<div class="labelsheet">'+labels.map(function(v){ return labelHTML(p, v); }).join("")+'</div>';

  setTimeout(function(){ window.print(); }, 200);

function regenVariants(){
  var sizes = $("#p-sizes").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  var colors = $("#p-colors").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  if(!sizes.length) sizes = [null];
  if(!colors.length) colors = [null];
  var combos = [];
  sizes.forEach(function(s){ colors.forEach(function(c){ combos.push([s,c]); }); });
  var next = [];
  combos.forEach(function(cb){
    var existing = editDraft.variants.find(function(v){ return (v.size||null)===cb[0] && (v.color||null)===cb[1]; });
    if(existing){ next.push(existing); }
    else{ next.push({id:uid(), size:cb[0], color:cb[1], stock:0, barcode:generateEAN13()}); }
  });
  editDraft.variants = next;
  var el = $("#vtable"); if(el) el.innerHTML = variantTableHTML();
}

function saveProduct(id){
  var name = $("#p-name").value.trim();

  var modelCode = $("#p-model-code").value.trim();
  if(!name || price <= 0){ toast("أدخل اسم المنتج وسعر بيع صحيح","err"); return; }
  if(!modelCode){ toast("أدخل كود الموديل","err"); return; }
  editDraft.name = name;
  editDraft.category = $("#p-cat").value || "عام";
  editDraft.modelCode = modelCode;
  editDraft.sku = $("#p-sku").value.trim();
  editDraft.price = price;
  editDraft.cost = num($("#p-cost").value);
  editDraft.emoji = $("#p-emoji").value.trim() || "👕";
  editDraft.sizes = $("#p-sizes").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  editDraft.colors = $("#p-colors").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  var ot = $("#p-offer") ? $("#p-offer").value : "none";
  var ov = num($("#p-offer-val") ? $("#p-offer-val").value : 0);
  if(ot === "percent" && ov > 0){ editDraft.offer = {type:"percent", value:Math.min(99, ov)}; }
  else if(ot === "fixed" && ov > 0){ editDraft.offer = {type:"fixed", value:ov}; }

  // قراءة كميات الجدول الحالي
  editDraft.variants.forEach(function(v, i){

  var sizes = editDraft.sizes.length ? editDraft.sizes : [null];
  var colors = editDraft.colors.length ? editDraft.colors : [null];
  var combos = [];
  sizes.forEach(function(s){ colors.forEach(function(c){ combos.push([s,c]); }); });
  var next = combos.map(function(cb){
    var ex = editDraft.variants.find(function(v){ return (v.size||null)===cb[0] && (v.color||null)===cb[1]; });
    return ex || {id:uid(), size:cb[0], color:cb[1], stock:0, barcode:generateEAN13()};

/* ============================================================
   التقارير
   ============================================================ */
function rangeFilter(){
  var now = Date.now();
  var from, to;
  if(reportRange === "custom"){
    from = reportFrom ? new Date(reportFrom + "T00:00:00").getTime() : 0;
    to = reportTo ? new Date(reportTo + "T23:59:59").getTime() : now;
  } else {
    var d = new Date(); d.setHours(0,0,0,0);
    if(reportRange === "today"){ from = d.getTime(); }
    else if(reportRange === "7d"){ from = d.getTime() - 6*86400000; }
    else if(reportRange === "30d"){ from = d.getTime() - 29*86400000; }
    else { from = 0; }
    to = now;
  }
  return {from:from, to:to};
}
function viewReports(){
  var f = rangeFilter();
  var sales = activeSalesList(DB.sales).filter(function(s){ return s.date>=f.from && s.date<=f.to; });
  var revenue = sales.reduce(function(a,s){ return a+s.total; },0);
  var profit = sales.reduce(function(a,s){ return a+s.profit; },0);
  var count = sales.length;
  var avg = count ? revenue/count : 0;

  // المرتجعات وصافي المبيعات: إجمالي المبيعات (بما فيه قيمة الأصناف البديلة في
  // عمليات الاستبدال، لأنها مبيعات فعلية جديدة) ناقص إجمالي قيمة المرتجعات.
  // صافي المبيعات = إجمالي المبيعات - إجمالي المرتجعات
  var returnsInRange = (DB.returns||[]).filter(function(r){ return r.date>=f.from && r.date<=f.to; });
  var ri = returnsImpact(returnsInRange);
  var returnsTotal = ri.returnsTotal;
  var grossSales = revenue + ri.exchangeReplacementTotal;
  var netSales = grossSales - returnsTotal;
  var netProfit = profit + ri.profitImpact;

  // رسم بياني يومي
  var days = [];
  var cursor = new Date(f.from); cursor.setHours(0,0,0,0);
  var end = new Date(f.to);
  var guard = 0;
  while(cursor.getTime() <= end.getTime() && guard < 1000){
    days.push(dayKey(cursor.getTime()));
    cursor.setDate(cursor.getDate()+1);
    guard++;
  }
  var dayMap = {};
  sales.forEach(function(s){ var k=dayKey(s.date); dayMap[k] = (dayMap[k]||0) + s.total; });
  var maxV = Math.max.apply(null, days.map(function(d){ return dayMap[d]||0; }).concat([1]));
  var bars = days.map(function(d){
    var v = dayMap[d]||0;
    var h = Math.round((v/maxV)*100);
    var dd = d.split("-");
    return '<div class="bar-col" title="'+dd[2]+'/'+dd[1]+': '+fmt(v)+' '+esc(DB.settings.currency)+'">'+
      '<span class="bv">'+(v>0?fmtInt(v):"")+'</span>'+
      '<div class="bar" style="height:'+Math.max(2,h)+'%"></div>'+
      '<span class="bl">'+dd[2]+'/'+dd[1]+'</span>'+
    '</div>';
  }).join("");

  // الأكثر مبيعاً
  var prodMap = {};
  sales.forEach(function(s){ s.items.forEach(function(it){
    if(!prodMap[it.productId]) prodMap[it.productId] = {name:it.name, emoji:it.emoji, qty:0, rev:0};
    prodMap[it.productId].qty += it.qty;
    prodMap[it.productId].rev += it.qty*it.price;
  });});

function saleItemReturnedQty(saleItemId){

  return used;
}

  var sale = DB.sales.find(function(s){ return s.id===saleId; });

  var p = it && it.productId ? DB.products.find(function(x){ return x.id===it.productId; }) : null;
  return p ? p.modelCode : "";
}

function loadReturnSale(sale){
  returnDraft.saleId = sale.id;
  returnDraft.customerId = sale.customerId || null;
  returnDraft.lines = sale.items.map(function(it){
    var already = saleItemReturnedQty(it.id);
    var remaining = Math.max(0, (it.qty||0) - already);
    return {
      saleItemId: it.id, name: it.name, size: it.size, color: it.color, price: it.price,
      soldQty: it.qty||0, alreadyReturned: already, remaining: remaining,
      checked: false, qty: remaining>0?1:0, reason: "", condition: "",
      replacementProductId: "", replacementVariantId: "", replacementQty: 1
    };
  });
}
function openReturnFlow(saleId, presetType){
  if(!can("returns","return") && !can("returns","exchange")){ toast("ليس لديك صلاحية إدارة الاسترجاع والاستبدال","err"); return; }
  returnDraft = { saleId:null, invoiceInput:"", type: presetType||"return", lines:[], customerId:null, refundMethod:"cash", reason:"" };
  if(saleId){
    var sale = DB.sales.find(function(s){ return s.id===saleId; });
    if(sale) loadReturnSale(sale);
  }
  openModal(returnModalHTML(), true);
}
function refreshReturnModal(){
  var m = $("#modal");
  if(m) m.innerHTML = returnModalHTML();
}
function searchReturnInvoice(){
  var v = $("#ret-inv").value.trim();
  returnDraft.invoiceInput = v;
  if(!v){ toast("أدخل رقم الفاتورة","err"); return; }
  var sale = DB.sales.find(function(s){ return (s.number||"").toLowerCase()===v.toLowerCase(); });
  if(!sale){ toast("لم يتم العثور على فاتورة بهذا الرقم","err"); return; }
  loadReturnSale(sale);
  refreshReturnModal();
}
function setReturnType(t){ returnDraft.type = t; refreshReturnModal(); }
function onReturnLineCheck(i, checked){
  var l = returnDraft.lines[i]; l.checked = checked;
  if(checked && l.qty<1) l.qty = 1;
  refreshReturnModal();
}
function onReturnLineQty(i, v){
  var l = returnDraft.lines[i];
  l.qty = Math.max(1, Math.min(l.remaining, parseInt(v,10)||1));
  refreshReturnModal();
}
function onReturnLineReason(i, v){ returnDraft.lines[i].reason = v; }
function onReturnLineCondition(i, v){ returnDraft.lines[i].condition = v; }
function onReturnReplacementProduct(i, pid){
  var l = returnDraft.lines[i];
  l.replacementProductId = pid;
  var p = DB.products.find(function(x){ return x.id===pid; });
  l.replacementVariantId = (p && p.variants && p.variants.length) ? p.variants[0].id : "";
  refreshReturnModal();
}
function onReturnReplacementVariant(i, vid){ returnDraft.lines[i].replacementVariantId = vid; refreshReturnModal(); }
function onReturnReplacementQty(i, v){ returnDraft.lines[i].replacementQty = Math.max(1, parseInt(v,10)||1); refreshReturnModal(); }
function computeReturnTotals(){
  var returnedTotal = 0, replacementTotal = 0;
  returnDraft.lines.forEach(function(l){
    if(!l.checked || l.qty<=0) return;
    returnedTotal += l.price * l.qty;
    if(returnDraft.type==="exchange" && l.replacementVariantId){
      var p = DB.products.find(function(x){ return x.id===l.replacementProductId; });
      replacementTotal += (p?p.price:0) * (l.replacementQty||0);
    }
  });
  return { returnedTotal: returnedTotal, replacementTotal: replacementTotal, difference: replacementTotal - returnedTotal };
}

    '<td><input value="'+esc(l.reason||"")+'" style="width:110px;" oninput="onReturnLineReason('+i+',this.value)"></td>'+
    '<td><select onchange="onReturnLineCondition('+i+',this.value)"><option value="">—</option><option value="جيد" '+(l.condition==="جيد"?"selected":"")+'>جيد</option><option value="تالف" '+(l.condition==="تالف"?"selected":"")+'>تالف</option></select></td>'+

  '</tr>';

async function confirmReturn(){
  var checkedLines = returnDraft.lines.filter(function(l){ return l.checked && l.qty>0; });
  if(!checkedLines.length){ toast("اختر صنفاً واحداً على الأقل","err"); return; }
  if(returnDraft.type==="exchange" && checkedLines.some(function(l){ return !l.replacementVariantId; })){
    toast("اختر المنتج البديل (بالمقاس/اللون) لكل صنف مسترجع","err"); return;
  }
  var totals = computeReturnTotals();
  var msg = returnDraft.type==="exchange" ?
    ("تأكيد الاستبدال؟ " + (totals.difference>0.004 ? ("سيتم تحصيل "+fmt(totals.difference)+" "+DB.settings.currency+" من العميل.") : (totals.difference<-0.004 ? ("سيتم رد "+fmt(-totals.difference)+" "+DB.settings.currency+" للعميل.") : "لا يوجد فرق في السعر.")))
    : ("تأكيد استرجاع بقيمة "+fmt(totals.returnedTotal)+" "+DB.settings.currency+"؟");
  confirmBox(msg, function(){
    var payload = {
      saleId: returnDraft.saleId, type: returnDraft.type, customerId: returnDraft.customerId,
      reason: returnDraft.reason||"", refundMethod: returnDraft.refundMethod||"cash",
      items: checkedLines.map(function(l){
        var repProd = returnDraft.type==="exchange" ? DB.products.find(function(p){ return p.id===l.replacementProductId; }) : null;
        return {
          saleItemId: l.saleItemId, qty: l.qty, reason: l.reason||"", condition: l.condition||"",
          replacementVariantId: returnDraft.type==="exchange" ? l.replacementVariantId : null,
          replacementQty: returnDraft.type==="exchange" ? l.replacementQty : null,
          replacementPrice: repProd ? repProd.price : null
        };
      })
    };
    api("POST", "/api/returns", payload).then(function(r){
      afterSync(r);
      closeModal();
      renderViewInPlace();
      toast(returnDraft.type==="exchange" ? "تم تنفيذ الاستبدال بنجاح" : "تم تنفيذ الاسترجاع بنجاح");
    }).catch(function(e){ toast(e.message, "err"); });
  }, false);
}

function purchaseRemaining(p){
  return p.remaining != null ? p.remaining : Math.max(0, (p.total||0) - (p.paid||0));
}
function purchasePayBadge(p){
  var map = { paid:{label:"مدفوعة",cls:"badge-green"}, partial:{label:"مدفوعة جزئياً",cls:"badge-amber"}, unpaid:{label:"غير مدفوعة",cls:"badge-red"} };
  var status = p.paymentStatus;
  if(!status){
    var paid = p.paid||0, total = p.total||0;
    status = (paid >= total && total > 0) ? "paid" : (paid > 0 ? "partial" : "unpaid");
  }
  var m = map[status];
  return m ? '<span class="badge '+m.cls+'">'+m.label+'</span>' : '<span class="muted small">—</span>';
}

function refreshPurFinRemaining(){

function purchaseLinesHTML(){
  if(!DB.products.length){ return '<p class="muted small">لا توجد منتجات — أضف منتجات أولاً.</p>'; }
  return purchaseDraft.items.map(function(it, i){
    var prodOpts = DB.products.map(function(p){ return '<option value="'+p.id+'" '+(it.productId===p.id?"selected":"")+'>'+esc(p.name)+(p.modelCode?' — '+esc(p.modelCode):'')+'</option>'; }).join("");
    var p = DB.products.find(function(x){ return x.id===it.productId; });
    var varOpts = ((p && p.variants) ? p.variants : []).map(function(v){ return '<option value="'+v.id+'" '+(it.variantId===v.id?"selected":"")+'>'+esc(variantLabel(v))+' ('+v.stock+')</option>'; }).join("");
    return '<div class="pur-line">'+

function onPurProduct(i, pid){
  var p = DB.products.find(function(x){ return x.id===pid; });
  purchaseDraft.items[i].productId = pid;
  purchaseDraft.items[i].variantId = (p && p.variants && p.variants.length) ? p.variants[0].id : "";
  purchaseDraft.items[i].cost = p ? p.cost : 0;
  refreshPurLines();
}
function onPurVariant(i, vid){ purchaseDraft.items[i].variantId = vid; refreshPurTotal(); }
function onPurQty(i, v){ purchaseDraft.items[i].qty = Math.max(1, parseInt(v,10)||1); refreshPurTotal(); }
function onPurCost(i, v){ purchaseDraft.items[i].cost = num(v); refreshPurTotal(); }
function addPurLine(){ purchaseDraft.items.push(blankPurchaseLine()); refreshPurLines(); }
function removePurLine(i){ purchaseDraft.items.splice(i,1); if(!purchaseDraft.items.length) purchaseDraft.items.push(blankPurchaseLine()); refreshPurLines(); }
function refreshPurLines(){ var el = $("#pur-lines"); if(el) el.innerHTML = purchaseLinesHTML(); refreshPurTotal(); }
function refreshPurTotal(){
  var el = $("#pur-total");

async function savePurchase(){
  var supId = purchaseDraft.supplierId;
  if(!supId){ toast("اختر مورداً","err"); return; }
  var sup = DB.suppliers.find(function(s){ return s.id===supId; });

  if(purchaseDraft.type === "financial"){
    var total = num(purchaseDraft.total);
    var paid = num(purchaseDraft.paid);
    if(total <= 0){ toast("أدخل إجمالي فاتورة صحيح","err"); return; }
    if(paid < 0){ toast("المبلغ المدفوع لا يمكن أن يكون سالباً","err"); return; }
    if(paid > total){ toast("المبلغ المدفوع لا يمكن أن يتجاوز إجمالي الفاتورة","err"); return; }
    if(paid > 0 && !purchaseDraft.partner){ toast("اختر الحساب (مؤمن/عبدو) للدفعة المبدئية","err"); return; }
    var purchase = {
      id: uid(), type:"financial", supplierId: supId, supplierName: sup.name,
      number: (purchaseDraft.number||"").trim(), total: total, paid: paid,
      paymentMethod: purchaseDraft.paymentMethod, notes: (purchaseDraft.notes||"").trim(),
      partner: paid > 0 ? purchaseDraft.partner : null
    };
    try{
      var r = await api("POST", "/api/purchase", { purchase: purchase });
      afterSync(r);
      closeModal(); renderViewInPlace(); toast("تم تسجيل الفاتورة المالية");
    }catch(e){ toast(e.message, "err"); }
    return;
  }

  var lines = purchaseDraft.items.filter(function(it){ return it.productId && it.qty > 0; });
  if(!lines.length){ toast("أضف صنفاً واحداً على الأقل","err"); return; }
  var total2 = lines.reduce(function(a,it){ return a + it.qty*it.cost; },0);
  var items = lines.map(function(it){
    var p = DB.products.find(function(x){ return x.id===it.productId; });
    var v = p && (p.variants||[]).find(function(x){ return x.id===it.variantId; });
    return {productId:it.productId, variantId:it.variantId, name:p?p.name:"", size:v?v.size:null, color:v?v.color:null, qty:it.qty, cost:it.cost};
  });
  var increments = lines.map(function(it){ return { productId: it.productId, variantId: it.variantId, qty: it.qty, cost: it.cost }; });
  var purchaseGoods = { id: uid(), type:"goods", supplierId: supId, supplierName: sup.name, items: items, total: total2, paid: 0 };
  var r2 = await api("POST", "/api/purchase", { purchase: purchaseGoods, increments: increments });
  afterSync(r2);
  closeModal(); renderViewInPlace(); toast("تم تسجيل الفاتورة وزيادة المخزون");
}

function shippingCompanyStats(){
  var buckets = DB.shippingCompanies.map(function(c){ return {id:c.id, name:c.name, orders:[]}; });
  buckets.push({id:null, name:"بدون شركة شحن", orders:[]});
  DB.orders.forEach(function(o){
    var b = buckets.find(function(x){ return x.id===(o.companyId||null); }) || buckets[buckets.length-1];
    b.orders.push(o);
  });
  return buckets.filter(function(b){ return b.orders.length>0; }).map(function(b){
    var orders = b.orders;
    var activeOrders = activeOrdersList(orders);
    return {
      id: b.id, name: b.name, count: orders.length,
      delivered: orders.filter(function(o){ return o.status==="delivered"; }).length,
      returned: orders.filter(function(o){ return o.status==="returned"; }).length,
      exchanged: orders.filter(function(o){ return o.status==="exchanged"; }).length,
      cancelled: orders.filter(function(o){ return o.status==="cancelled"; }).length,
      pending: orders.filter(function(o){ return ["new","preparing","ready","shipped","transit"].indexOf(o.status)!==-1; }).length,
      totalValue: activeOrders.reduce(function(a,o){ return a+(o.total||0); },0),
      totalDeposit: activeOrders.reduce(function(a,o){ return a+(o.deposit||0); },0),
      totalCollected: activeOrders.reduce(function(a,o){ return a+orderCollectedTotal(o); },0),
      totalRemaining: activeOrders.reduce(function(a,o){ return a+orderRemaining(o); },0),
      returnedValue: orders.filter(function(o){ return o.status==="returned"; }).reduce(function(a,o){ return a+(o.total||0); },0)
    };
  }).sort(function(a,b){ return b.count-a.count; });
}

function viewOrders(){
  var q = orderQ.toLowerCase();
  var from = orderFrom ? new Date(orderFrom+"T00:00:00").getTime() : 0;

  var list = DB.orders.slice().sort(function(a,b){ return b.date-a.date; }).filter(function(o){
    var comp = o.companyId ? DB.shippingCompanies.find(function(c){ return c.id===o.companyId; }) : null;
    var hay = (o.number+" "+o.customerName+" "+(o.phone||"")+" "+(o.awb||"")+" "+(o.governorate||"")+" "+(comp?comp.name:"")).toLowerCase();
    var okQ = !q || hay.indexOf(q)!==-1;
    var okS = orderStatusFilter==="all" || o.status===orderStatusFilter;
    var okC = orderCompanyFilter==="all" || (orderCompanyFilter==="none" ? !o.companyId : o.companyId===orderCompanyFilter);
    var okP = orderPayFilter==="all" || orderPaymentStatus(o).key===orderPayFilter;
    var okD = o.date>=from && o.date<=to;
    return okQ && okS && okC && okP && okD;
  });

  // إجماليات الكروت لازم تستبعد الأوردرات الملغية دايمًا — الأوردر الملغي يفضل
  // ظاهر في جدول القائمة تحته (list) بحالة "ملغي"، لكنه ملوش أي وجود في أي رقم
  // مالي/عدّاد "نشط" هنا. المرتجع/المستبدل بيفضلوا محسوبين زي ما هما (منطقهم
  // الحالي متطلوبش تغيير).
  var statsList = activeOrdersList(list);
  var totalOrders = statsList.length;
  var totalValue = statsList.reduce(function(a,o){ return a+(o.total||0); },0);
  var totalDeposit = statsList.reduce(function(a,o){ return a+(o.deposit||0); },0);

  var totalRemaining = statsList.reduce(function(a,o){ return a+orderRemaining(o); },0);
  var shippingCount = list.filter(function(o){ return ["shipped","transit"].indexOf(o.status)!==-1; }).length;

    '<option value="unpaid" '+(orderPayFilter==="unpaid"?"selected":"")+'>غير مدفوعة</option>';
  var hasFilters = orderQ || orderStatusFilter!=="all" || orderCompanyFilter!=="all" || orderPayFilter!=="all" || orderFrom || orderTo;

  var filterBar = '<div class="filterbar">'+

    statCard("return","var(--red)", fmtInt(returnedCount), "أوردرات مرتجعة")+

    '<button class="btn '+(ordersTab==="list"?"btn-primary":"btn-ghost")+'" onclick="setOrdersTab(\'list\')">قائمة الأوردرات</button>'+
    '<button class="btn '+(ordersTab==="companies"?"btn-primary":"btn-ghost")+'" onclick="setOrdersTab(\'companies\')">'+icon("truck",15)+' مطابقة شركات الشحن</button>'+
  '</div>';

  var listSection = '<div class="card"><h3>'+icon("send",17)+' الأوردرات ('+list.length+')</h3>'+
    '<div class="table-wrap"><table><thead><tr>'+
      '<th>الأوردر</th><th>التاريخ</th><th>العميل</th><th>الهاتف</th><th>المحافظة/المدينة</th><th>شركة الشحن</th>'+
      '<th>قيمة الأوردر</th><th>العربون</th><th>المحصل</th><th>المتبقي</th><th>طريقة الدفع</th><th>الحالة</th><th>حالة الدفع</th><th></th>'+
    '</tr></thead>'+
    '<tbody>'+(list.length ? list.map(orderRowHTML).join("") : '<tr><td colspan="14" class="muted" style="text-align:center;padding:30px;">لا توجد أوردرات مطابقة</td></tr>')+'</tbody></table></div></div>';

  return filterBar + stats + tabs + (ordersTab==="companies" ? viewShippingReconciliation() : listSection);
}

function onOrderVariant(i, vid){ orderDraft.items[i].variantId = vid; refreshOrderTotal(); }

function refreshOrderTotal(){

    var t = sub + (orderDraft.shipping||0) - (orderDraft.discount||0);

async function saveOrder(){
  orderDraft.customerName = ($("#ord-name") ? $("#ord-name").value : orderDraft.customerName).trim();
  orderDraft.phone = ($("#ord-phone") ? $("#ord-phone").value : orderDraft.phone).trim();
  orderDraft.awb = ($("#ord-awb") ? $("#ord-awb").value : orderDraft.awb || "").trim();
  orderDraft.street = ($("#ord-street") ? $("#ord-street").value : "").trim();
  orderDraft.note = ($("#ord-note") ? $("#ord-note").value : "").trim();
  orderDraft.shipping = num($("#ord-ship") ? $("#ord-ship").value : orderDraft.shipping);
  orderDraft.discount = num($("#ord-disc") ? $("#ord-disc").value : 0);
  orderDraft.deposit = num($("#ord-deposit") ? $("#ord-deposit").value : 0);
  if(!orderDraft.customerName){ toast("اكتب اسم العميل","err"); return; }
  var lines = orderDraft.items.filter(function(it){ return it.productId && it.qty>0; });
  for(var i=0;i<lines.length;i++){
    var p = DB.products.find(function(x){ return x.id===lines[i].productId; });
    var v = p && (p.variants||[]).find(function(x){ return x.id===lines[i].variantId; });
    if(v && lines[i].qty > v.stock){ toast("الكمية أكبر من المتاح: "+p.name+" ("+variantLabel(v)+")","err"); return; }
  }
  var u = currentUser();
  var subtotal = lines.reduce(function(a,it){ return a+it.qty*it.price; },0);
  var total = Math.max(0, subtotal + orderDraft.shipping - orderDraft.discount);
  var deposit = Math.max(0, Math.min(total, orderDraft.deposit||0));
  var items = lines.map(function(it){
    var p = DB.products.find(function(x){ return x.id===it.productId; });
    var v = p && (p.variants||[]).find(function(x){ return x.id===it.variantId; });
    return {productId:it.productId, variantId:it.variantId, name:p?p.name:"", size:v?v.size:null, color:v?v.color:null, qty:it.qty, price:it.price, cost:p?p.cost:0};
  });
  var decrements = lines.map(function(it){ return { productId: it.productId, variantId: it.variantId, qty: it.qty }; });
  var order = {
    id:uid(),
    customerId:orderDraft.customerId, customerName:orderDraft.customerName, phone:orderDraft.phone,
    governorate:"", city:"", street:orderDraft.street,
    items:items, subtotal:subtotal, shipping:orderDraft.shipping, discount:orderDraft.discount, total:total, deposit:deposit,
    paymentStatus:orderDraft.paymentStatus, collected:false, status:"new",
    companyId:null, awb:orderDraft.awb, note:orderDraft.note
  };
  var r = await api("POST", "/api/order", { order: order, decrements: decrements });
  afterSync(r);
  var savedOrder = r.order;
  closeModal(); renderViewInPlace(); toast("تم حفظ الأوردر " + savedOrder.number);
  showOrderSlip(savedOrder);
}
function advanceOrder(id){
  var o = DB.orders.find(function(x){ return x.id===id; });
  if(!o) return;
  var next = flowNext(o.status);
  if(!next) return;
  api("POST", "/api/order/" + id + "/status", { status: next }).then(function(r){
    afterSync(r);
    renderViewInPlace(); toast(o.number+" → "+statusMeta(next).label);
  }).catch(function(e){ toast(e.message, "err"); });
}
function returnOrder(id){
  var o = DB.orders.find(function(x){ return x.id===id; });
  if(!o) return;
  if(o.status==="returned" || o.status==="cancelled"){ toast("الأوردر بالفعل مرتجع/ملغي","warn"); return; }
  confirmBox("تسجيل الأوردر "+o.number+" كمرتجع؟ سيتم إرجاع الكميات للمخزون.", function(){
    api("POST", "/api/order/" + id + "/return").then(function(r){ afterSync(r); renderViewInPlace(); toast("تم تسجيل المرتجع واستعادة المخزون"); }).catch(function(e){ toast(e.message, "err"); });
  }, true);
}
function cancelOrder(id){
  var o = DB.orders.find(function(x){ return x.id===id; });
  if(!o) return;
  if(o.status==="returned" || o.status==="cancelled"){ toast("الأوردر بالفعل ملغي/مرتجع","warn"); return; }
  confirmBox("إلغاء الأوردر "+o.number+"؟ سيتم إرجاع الكميات للمخزون.", function(){
    api("POST", "/api/order/" + id + "/cancel").then(function(r){ afterSync(r); renderViewInPlace(); toast("تم إلغاء الأوردر"); }).catch(function(e){ toast(e.message, "err"); });
  }, true);
}
/* ملاحظة: تسجيل تحصيل COD كان له نظام مالي منفصل قديمًا (collectCod/saveCodCollection
   → POST /api/order/:id/cod). تم توحيده بالكامل: كل التحصيلات (بما فيها COD) تمر الآن
   عبر openOrderCollection/saveOrderCollection → POST /api/order/:id/collection، واللي

   الدفتر) لأي استدعاء مباشر قديم، لكن الواجهة ما بقتش تستخدمها. السجلات التاريخية

/* أوردر قديم من قبل نظام التحصيل الموحّد (collectedTotal فاضي)؟ نرجع لعلم collected
   القديم كبديل آمن بدل ما نخترع صفر مش دقيق — نفس مبدأ "لا تخترع، لا تفقد بيانات". */
function orderCollectedTotal(o){
  if(o.collectedTotal!=null) return o.collectedTotal;
  return o.collected ? (o.collectedAmount!=null?o.collectedAmount:(o.total||0)) : 0;
}
function orderRemaining(o){
  return o.remaining != null ? o.remaining : Math.max(0, (o.total||0) - orderCollectedTotal(o));
}
function orderPaymentStatus(o){
  var collected = orderCollectedTotal(o), total = o.total||0;
  if(collected <= 0) return {label:"غير مدفوعة", cls:"badge-red", key:"unpaid"};
  if(collected >= total - 0.004) return {label:"مدفوعة", cls:"badge-green", key:"paid"};
  return {label:"مدفوعة جزئياً", cls:"badge-amber", key:"partial"};
}
function orderFinancialBlockHTML(o){
  if(o.deposit==null && o.collectionStatus==null) return "";
  var collectedTotal = orderCollectedTotal(o);
  var remaining = orderRemaining(o);
  var laterCollected = Math.max(0, collectedTotal - (o.deposit||0));
  var statusLabel = (o.collectionStatus==="collected") ? "تم التحصيل" : "لم يتم التحصيل";
  var statusColor = (o.collectionStatus==="collected") ? "var(--green)" : "var(--amber)";
  var payStatus = orderPaymentStatus(o);
  return '<div class="card mt16" style="background:#f8fafc;padding:12px;">'+
      '<h3 style="margin-bottom:8px;">'+icon("wallet",17)+' الملخص المالي</h3>'+
      '<div class="tot-row"><span>إجمالي الفاتورة</span><b>'+fmt(o.total)+'</b></div>'+
      '<div class="tot-row"><span>العربون (حساب عبدو)</span><b>'+fmt(o.deposit||0)+'</b></div>'+
      '<div class="tot-row"><span>المحصَّل لاحقاً</span><b>'+fmt(laterCollected)+'</b></div>'+
      '<div class="tot-row"><span>إجمالي المحصَّل</span><b>'+fmt(collectedTotal)+'</b></div>'+
      '<div class="tot-row"><span>المتبقي</span><b style="color:'+(remaining>0?'var(--red)':'var(--green)')+';">'+fmt(remaining)+'</b></div>'+
      '<div class="tot-row"><span>حالة الدفع</span><span class="badge '+payStatus.cls+'">'+payStatus.label+'</span></div>'+
      '<div class="tot-row"><span>حالة التحصيل</span><b style="color:'+statusColor+';">'+statusLabel+'</b></div>'+
    '</div>';
}

/* ---------- استبدال أوردر (مرآة لنموذج الاسترجاع والاستبدال الخاص بنقطة البيع) ---------- */
function orderItemExchangedQty(orderItemId){
  var used = 0;
  (DB.orderExchanges||[]).forEach(function(e){ (e.items||[]).forEach(function(it){ if(it.orderItemId===orderItemId) used += (it.qty||0); }); });
  return used;
}
function openOrderExchange(id){
  var o = DB.orders.find(function(x){ return x.id===id; });
  if(!o) return;
  orderExchangeDraft = {
    orderId: id, reason: "", refundPartner: "",
    lines: o.items.map(function(it){
      var already = orderItemExchangedQty(it.id);
      var remaining = Math.max(0, (it.qty||0) - already);
      return {
        orderItemId: it.id, name: it.name, size: it.size, color: it.color, price: it.price,
        orderedQty: it.qty||0, remaining: remaining,
        checked: false, qty: remaining>0?1:0,
        replacementProductId: "", replacementVariantId: "", replacementQty: 1
      };
    })
  };
  openModal(orderExchangeModalHTML(), true);
}
function refreshOrderExchangeModal(){ var m = $("#modal"); if(m) m.innerHTML = orderExchangeModalHTML(); }
function onOrderExchLineCheck(i, checked){
  var l = orderExchangeDraft.lines[i]; l.checked = checked;
  if(checked && l.qty<1) l.qty = 1;
  refreshOrderExchangeModal();
}
function onOrderExchLineQty(i, v){
  var l = orderExchangeDraft.lines[i];
  l.qty = Math.max(1, Math.min(l.remaining, parseInt(v,10)||1));
  refreshOrderExchangeModal();
}
function onOrderExchReplacementProduct(i, pid){
  var l = orderExchangeDraft.lines[i];
  l.replacementProductId = pid;
  var p = DB.products.find(function(x){ return x.id===pid; });
  l.replacementVariantId = (p && p.variants && p.variants.length) ? p.variants[0].id : "";
  refreshOrderExchangeModal();
}
function onOrderExchReplacementVariant(i, vid){ orderExchangeDraft.lines[i].replacementVariantId = vid; refreshOrderExchangeModal(); }
function onOrderExchReplacementQty(i, v){ orderExchangeDraft.lines[i].replacementQty = Math.max(1, parseInt(v,10)||1); refreshOrderExchangeModal(); }
function computeOrderExchangeTotals(){
  var returnedTotal = 0, replacementTotal = 0;
  orderExchangeDraft.lines.forEach(function(l){
    if(!l.checked || l.qty<=0) return;
    returnedTotal += l.price * l.qty;
    if(l.replacementVariantId){
      var p = DB.products.find(function(x){ return x.id===l.replacementProductId; });
      replacementTotal += (p?p.price:0) * (l.replacementQty||0);
    }
  });
  return { returnedTotal: returnedTotal, replacementTotal: replacementTotal, difference: replacementTotal - returnedTotal };
}
function orderExchLineHTML(l, i){
  var prodOpts = '<option value="">— اختر منتج —</option>' + DB.products.map(function(p){ return '<option value="'+p.id+'" '+(l.replacementProductId===p.id?"selected":"")+'>'+esc(p.name)+(p.modelCode?' — '+esc(p.modelCode):'')+'</option>'; }).join("");
  var repProd = DB.products.find(function(p){ return p.id===l.replacementProductId; });
  var varOpts = '<option value="">—</option>' + ((repProd&&repProd.variants)?repProd.variants:[]).map(function(v){ return '<option value="'+v.id+'" '+(l.replacementVariantId===v.id?"selected":"")+'>'+esc(variantLabel(v))+' ('+v.stock+')</option>'; }).join("");
  var repHTML = '<td><div class="row" style="gap:4px;flex-wrap:wrap;">'+
    '<select onchange="onOrderExchReplacementProduct('+i+',this.value)" style="min-width:130px;">'+prodOpts+'</select>'+
    '<select onchange="onOrderExchReplacementVariant('+i+',this.value)" style="min-width:110px;">'+varOpts+'</select>'+
    '<input type="number" min="1" value="'+l.replacementQty+'" style="width:60px;" oninput="onOrderExchReplacementQty('+i+',this.value)">'+
  '</div></td>';
  return '<tr>'+
    '<td><input type="checkbox" '+(l.checked?"checked":"")+' '+(l.remaining<=0?"disabled":"")+' onchange="onOrderExchLineCheck('+i+',this.checked)"></td>'+
    '<td>'+esc(l.name||"")+'</td>'+
    '<td>'+esc([l.size,l.color].filter(Boolean).join(" / ")||"—")+'</td>'+
    '<td>'+fmt(l.price)+'</td>'+
    '<td>'+l.orderedQty+'</td>'+
    '<td>'+l.remaining+'</td>'+
    '<td><input type="number" min="1" max="'+l.remaining+'" value="'+l.qty+'" style="width:60px;" '+(l.remaining<=0?"disabled":"")+' oninput="onOrderExchLineQty('+i+',this.value)"></td>'+
    repHTML+
  '</tr>';
}
function orderExchangeModalHTML(){
  var o = DB.orders.find(function(x){ return x.id===orderExchangeDraft.orderId; });
  var rows = orderExchangeDraft.lines.map(orderExchLineHTML).join("");
  var table = '<div class="table-wrap"><table><thead><tr><th></th><th>الصنف</th><th>المقاس/اللون</th><th>سعر الوحدة</th><th>الكمية بالأوردر</th><th>المتاح للاستبدال</th><th>الكمية المرتجعة</th><th>المنتج البديل</th></tr></thead><tbody>'+rows+'</tbody></table></div>';

  var totals = computeOrderExchangeTotals();
  var diffLine;
  if(totals.difference > 0.004) diffLine = '<div class="ttl bold" style="color:var(--red);"><span>المبلغ المطلوب تحصيله لاحقاً</span><span>'+fmt(totals.difference)+' '+esc(DB.settings.currency)+'</span></div>';
  else if(totals.difference < -0.004) diffLine = '<div class="ttl bold" style="color:var(--green);"><span>الفرق لصالح العميل</span><span>'+fmt(-totals.difference)+' '+esc(DB.settings.currency)+'</span></div>';
  else diffLine = '<div class="ttl bold"><span>الفرق</span><span>لا يوجد فرق</span></div>';

  var summary = '<div class="card mt16" style="background:#f8fafc;padding:12px;">'+
    '<div class="ttl"><span>قيمة الأصناف المرتجعة</span><span class="bold">'+fmt(totals.returnedTotal)+' '+esc(DB.settings.currency)+'</span></div>'+
    '<div class="ttl"><span>قيمة الأصناف البديلة</span><span class="bold">'+fmt(totals.replacementTotal)+' '+esc(DB.settings.currency)+'</span></div>'+
    diffLine+
  '</div>';

  var collected = orderCollectedTotal(o);
  var newTotal = Math.max(0, (o.total||0) + totals.difference);
  var refundAmount = Math.max(0, collected - newTotal);
  var refundBlock = "";
  if(refundAmount > 0.004){
    refundBlock = '<div class="warn-banner" style="margin:10px 0;">⚠️ هذا الاستبدال يترتب عليه استرداد '+fmt(refundAmount)+' '+esc(DB.settings.currency)+' للعميل من رصيد أحد الشريكين — اختر الحساب.</div>'+
      '<div class="field"><label>الحساب الذي سيتحمّل الاسترداد (مؤمن/عبدو) *</label>'+partnerSelectHTML("oex-refund-partner", orderExchangeDraft.refundPartner).replace('<select ','<select onchange="orderExchangeDraft.refundPartner=this.value" ')+'</div>';
  }

  var body = '<div class="modal-body">'+
    '<div class="row" style="gap:16px;flex-wrap:wrap;margin-bottom:10px;">'+
      '<div><span class="muted small">الأوردر</span><div class="bold">'+esc(o.number)+'</div></div>'+
      '<div><span class="muted small">العميل</span><div class="bold">'+esc(o.customerName)+'</div></div>'+
      '<div><span class="muted small">إجمالي الأوردر الحالي</span><div class="bold">'+fmt(o.total)+'</div></div>'+
    '</div>'+
    table+

    summary+refundBlock+

  var foot = '<div class="modal-foot">'+
    '<button class="btn btn-green" onclick="confirmOrderExchange()">'+icon("check",16)+' تأكيد الاستبدال</button>'+
    '<button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>'+
  '</div>';
